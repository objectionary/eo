---
# The table of operations phino may answer symbolically during the one run
# of the lowering. A key is a regular expression matched against the whole
# name of a λ function; a bare 𝜎 in an answer is a fresh symbol wrapped in
# the carrier of the operation. A λ function no key matches is left where
# it stands, and the formation that reached it is a taint.
# A fork answers neither of its sides. Its condition is a value nobody
# worked out, so phino morphs both sides first. Two sides that come to one
# term up to their symbols are joined into a fresh symbol that stands for
# either, and the run goes on as one: the "stay" lines drop the ρ a side
# may hang on its bytes, the "symbolize" lines turn a literal a side holds
# into a symbol, so that a side computed and a side written out compare
# as one shape, and the "defer" lines turn a copy over a bare symbol,
# which nobody can work out, into a symbol that stands for it, so that a
# flow taking that side ends in the symbol instead of getting stuck inside
# the copy. Otherwise the run splits at the fork into two flows, one per
# side, and the record of the fork holds what each of them did from there
# on. A condition decided once on a flow is decided for that flow. Every
# flow ends in a root of its own, and the rendering turns the forks into
# nested ifs, with one return per flow, and every join into an if that
# assigns the joined symbol. A flow whose side stops at the λ of "throw",
# which is what every T is by now, ends in that throw, and its if throws
# the message.
- λ: L_number_(plus|times|div)
  dataize:
    𝛿1: $.ρ
    𝛿2: $.b
  𝑛: Φ.number( φ ↦ Φ.bytes( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ ) )
- λ: L_number_gt
  dataize:
    𝛿1: $.ρ
    𝛿2: $.b
  𝑛: ⟦ φ ↦ Φ.bool( if ↦ ⟦ λ ⤍ L_fork, left ↦ ∅, right ↦ ∅, φ ↦ ⟦ λ ⤍ 𝜎 ⟧ ⟧ ) ⟧
- λ: L_bytes_size
  dataize:
    𝛿1: $.ρ
  𝑛: Φ.number( φ ↦ Φ.bytes( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ ) )
- λ: L_bytes_eq
  dataize:
    𝛿1: $.ρ
    𝛿2: $.b
  𝑛: ⟦ φ ↦ Φ.bool( if ↦ ⟦ λ ⤍ L_fork, left ↦ ∅, right ↦ ∅, φ ↦ ⟦ λ ⤍ 𝜎 ⟧ ⟧ ) ⟧
- λ: L_bytes_(and|or|concat|right)
  dataize:
    𝛿1: $.ρ
    𝛿2: $.b
  𝑛: Φ.bytes( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
- λ: L_bytes_not
  dataize:
    𝛿1: $.ρ
  𝑛: Φ.bytes( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
- λ: L_bytes_slice
  dataize:
    𝛿1: $.ρ
    𝛿2: $.start
    𝛿3: $.len
  𝑛: Φ.bytes( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
- λ: L_dataized
  dataize:
    𝛿1: $.target
  𝑛: Φ.bytes( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )
- λ: L_os_name
  𝑛: Φ.string( φ ↦ Φ.bytes( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ ) )
- λ: L_fork
  dataize:
    𝛿1: $.φ
  morph:
    𝑛1: $.left
    𝑛2: $.right
  stay:
    𝑛3: 𝑛1
    𝑛4: 𝑛2
  symbolize:
    𝑛5: 𝑛3
    𝑛6: 𝑛4
  defer:
    𝑛7: 𝑛5
    𝑛8: 𝑛6
  fork:
    on: 𝛿1
    left: 𝑛7
    right: 𝑛8
- λ: L_entry
  dataize:
    𝛿1: $.n
  morph:
    𝑛1: $.v.φ
  𝑛: Φ.l/.root( 𝑛1 )
- λ: L_root
  dataize:
    𝛿1: $.v
  𝑛: ⟦ ⟧
