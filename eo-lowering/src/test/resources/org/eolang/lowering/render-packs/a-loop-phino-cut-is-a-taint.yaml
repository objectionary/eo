---
# yamllint disable rule:line-length
# The body calls an object of its own again and again, and phino cut the
# loop it found itself in, so the flow came to no root, and a cut loop gets no symbol for the atom to read: the entry stays
# in EO.
locator: Φ.joined
number: 54
taint: The entry 54 came to no root on the only flow, because phino cut a loop at Φ.joined.with-delimiter
eo:
  joined.eo: |
    [items] > joined
      with-delimiter items.head items.tail > @
      [acc tup] > with-delimiter
        with-delimiter acc tup.tail > @
voids:
  - "𝜎54\t54\titems.head\tobject"
  - "𝜎55\t54\titems.tail\ttuple"
links: |
  <links>
    <type id="Φ.joined.φ">
      <ref loc="Φ.bytes"/>
    </type>
  </links>
protocol: |
  <protocol>
    <dataize at="Φ.l/.e54">
      <boxed meta="𝑛·0·1">Φ.l/.e54.φ</boxed>
      <morph at="𝑛·0·1">
        <morphed meta="𝑛·0·2">𝑛·1·4</morphed>
      </morph>
      <answered meta="𝑛·1·6">𝑛·1·5</answered>
      <morph at="Φ.a🌵4">
        <looped by="morph" match="𝑛·1·4" at="Φ.a🌵4" of="Φ.joined.with-delimiter"/>
      </morph>
    </dataize>
    <msec>400</msec>
    <firings>6</firings>
    <fps>17</fps>
  </protocol>
