---
# yamllint disable rule:line-length
# The bytes of the message the fork raises are no text in UTF-8, so the atom
# cannot write them as a Java string literal.
locator: Φ.bytes.xor
number: 7
taint: raises when 𝜎137 is false, but its message FF-FE is no text in UTF-8
eo:
  bytes.eo: |
    [] > bytes
      [b] > xor
        if. > @
          ^.size.as-bytes.eq b.size.as-bytes
          ^.or b
          T (string FF-FE)
voids:
  - "𝜎7\t7\tρ\tbytes"
  - "𝜎8\t7\tb\tbytes"
protocol: |
  <protocol>
    <morph at="Φ.l/.e7">
      <evaluate λ="L_entry" by="morph" at="Φ.l/.e7">
        <evaluate λ="L_bytes_size" by="morph" at="Φ.a🌵1">
          <dataize meta="𝛿1·2">𝜎7:λ</dataize>
          <minted symbol="𝜎135">𝜎7</minted>
        </evaluate>
        <evaluate λ="L_bytes_eq" by="morph" at="Φ.a🌵1">
          <dataize meta="𝛿1·3">𝜎135:λ</dataize>
          <evaluate λ="L_bytes_size" by="morph" at="Φ.a🌵4">
            <dataize meta="𝛿1·4">𝜎8:λ</dataize>
            <minted symbol="𝜎136">𝜎8</minted>
          </evaluate>
          <dataize meta="𝛿2·3">𝜎136:λ</dataize>
          <minted symbol="𝜎137">𝜎135 𝜎136</minted>
        </evaluate>
        <evaluate λ="L_bytes_or" by="morph" at="Φ.a🌵1.left">
          <dataize meta="𝛿1·5">𝜎7:λ</dataize>
          <dataize meta="𝛿2·5">𝜎8:λ</dataize>
          <minted symbol="𝜎138">𝜎7 𝜎8</minted>
          <applied meta="𝑛·5·4" by="morph" at="𝑛·5·3" of="Φ.bytes"><attr name="φ">𝜎138</attr></applied>
        </evaluate>
        <evaluate λ="L_fork" by="morph" at="Φ.a🌵1">
          <dataize meta="𝛿1·6">𝜎137:λ</dataize>
          <applied meta="𝑛·6·2" by="morph" at="Φ.a🌵10.message" of="Φ.bytes"><attr name="φ">FF-FE:Δ</attr></applied>
          <applied meta="𝑛·6·3" by="morph" at="Φ.a🌵10.message" of="Φ.string"><attr name="φ">𝑛·6·2</attr></applied>
          <terminate symbol="𝜎137" branch="right" message="𝑛·6·3"/>
          <answer meta="𝑛·6·5">𝑛·5·4</answer>
        </evaluate>
        <bind meta="𝑛1·1">𝑛·5·4</bind>
      </evaluate>
      <evaluate λ="L_root" by="morph" at="Φ.l/.e7">
        <dataize meta="𝛿1·7">𝜎138:λ</dataize>
      </evaluate>
    </morph>
    <msec>28</msec>
    <firings>7</firings>
    <fps>250</fps>
  </protocol>
