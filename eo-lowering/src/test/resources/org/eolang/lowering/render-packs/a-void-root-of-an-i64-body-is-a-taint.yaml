---
# A void root is data too. Its bytes cannot stand in for the i64 object that
# the body promises to return, so the lowering leaves this entry in EO.
locator: Φ.wrap
number: 1
taint: >-
  The root 𝜎1 of the entry 1 is bare data, while inference says
  Φ.wrap returns Φ.i64, and bare data would lose the object around it
eo:
  wrap.eo: |
    [data] > wrap
      i64 data > @
  i64.eo: |
    [@] > i64
voids:
  - "𝜎1\t1\tdata\tbytes"
protocol: |
  <protocol>
    <dataize at="Φ.l🌵.e1">
      <manufactured meta="𝛿·2·1">𝜎1</manufactured>
    </dataize>
    <msec>100</msec>
    <firings>1</firings>
    <fps>20</fps>
  </protocol>
