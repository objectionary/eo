---
# yamllint disable rule:line-length
# The fork that raises sits in the left branch of a fork that joins, so a
# guard at the top of the atom would throw even when the program takes the
# right branch.
locator: Φ.bytes.xor
number: 7
taint: raises when 𝜎138 is false, but the fork that raises does not give the body
eo:
  bytes.eo: |
    [] > bytes
      [b] > xor
        if. > @
          ^.size.as-bytes.eq b.size.as-bytes
          if.
            ^.size.as-bytes.eq 00-00-00-00-00-00-00-00
            ^.or b
            T "bytes.xor requires an empty operand"
          ^.and b
voids:
  - "𝜎7\t7\tρ\tbytes"
  - "𝜎8\t7\tb\tbytes"
protocol: |
  <protocol>
    <morph at="Φ.l/.e7">
      <evaluate λ="L_entry" by="morph" at="Φ.l/.e7">
        <evaluate λ="L_bytes_size" by="morph" at="Φ.a🌵1">
          <dataize meta="𝛿1·2">𝜎7:λ</dataize>
          <minted symbol="𝜎135">𝜎7</minted>
        </evaluate>
        <evaluate λ="L_bytes_eq" by="morph" at="Φ.a🌵1">
          <dataize meta="𝛿1·3">𝜎135:λ</dataize>
          <evaluate λ="L_bytes_size" by="morph" at="Φ.a🌵4">
            <dataize meta="𝛿1·4">𝜎8:λ</dataize>
            <minted symbol="𝜎136">𝜎8</minted>
          </evaluate>
          <dataize meta="𝛿2·3">𝜎136:λ</dataize>
          <minted symbol="𝜎137">𝜎135 𝜎136</minted>
        </evaluate>
        <evaluate λ="L_bytes_size" by="morph" at="Φ.a🌵1.left"/>
        <evaluate λ="L_bytes_eq" by="morph" at="Φ.a🌵1.left">
          <dataize meta="𝛿1·6">𝜎135:λ</dataize>
          <minted symbol="𝜎138">𝜎135 00-00-00-00-00-00-00-00</minted>
        </evaluate>
        <evaluate λ="L_bytes_or" by="morph" at="Φ.a🌵1.left">
          <dataize meta="𝛿1·7">𝜎7:λ</dataize>
          <dataize meta="𝛿2·7">𝜎8:λ</dataize>
          <minted symbol="𝜎139">𝜎7 𝜎8</minted>
        </evaluate>
        <evaluate λ="L_fork" by="morph" at="Φ.a🌵1.left">
          <dataize meta="𝛿1·8">𝜎138:λ</dataize>
          <applied meta="𝑛·8·2" by="morph" at="Φ.a🌵12.message" of="Φ.bytes"><attr name="φ">62-79-74-65-73-2E-78-6F-72-20-72-65-71-75-69-72-65-73-20-61-6E-20-65-6D-70-74-79-20-6F-70-65-72-61-6E-64:Δ</attr></applied>
          <applied meta="𝑛·8·3" by="morph" at="Φ.a🌵12.message" of="Φ.string"><attr name="φ">𝑛·8·2</attr></applied>
          <terminate symbol="𝜎138" branch="right" message="𝑛·8·3"/>
          <answer meta="𝑛·8·5">𝑛·7·4</answer>
        </evaluate>
        <evaluate λ="L_bytes_and" by="morph" at="Φ.a🌵1.right">
          <dataize meta="𝛿1·9">𝜎7:λ</dataize>
          <dataize meta="𝛿2·9">𝜎8:λ</dataize>
          <minted symbol="𝜎140">𝜎7 𝜎8</minted>
        </evaluate>
        <evaluate λ="L_fork" by="morph" at="Φ.a🌵1">
          <dataize meta="𝛿1·10">𝜎137:λ</dataize>
          <joined symbol="𝜎141">𝜎139 𝜎140</joined>
          <answer meta="𝑛·10·2">⟦ φ ↦ 𝜎141:λ, +25 ⟧</answer>
        </evaluate>
        <bind meta="𝑛1·1">⟦ φ ↦ 𝜎141:λ, +25 ⟧</bind>
      </evaluate>
      <evaluate λ="L_root" by="morph" at="Φ.l/.e7">
        <dataize meta="𝛿1·11">𝜎141:λ</dataize>
      </evaluate>
    </morph>
    <msec>36</msec>
    <firings>11</firings>
    <fps>306</fps>
  </protocol>
