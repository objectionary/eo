---
# yamllint disable rule:line-length
# A row dataizes one operand per void it lists, so a symbol its λ minted
# of any other number of operands has nothing to bind them to.
locator: Φ.twolen
number: 5
taint: has 2 operands, while L_len takes 1
eo:
  twolen.eo: |
    [t] > twolen
      (len t).plus 1 > @
voids:
  - "𝜎4\t5\tt\tstring"
rows:
  - "L_len\tΦ.len\tΦ.len\ts:string"
provides: |
  <provides>
    <type id="Φ.twolen" reduced="Φ.number">
      <attr name="t" type="Φ.twolen.t" void="true" holds="Φ.string"/>
    </type>
  </provides>
protocol: |
  <protocol>
    <dataize at="Φ.l🌵.e5">
      <evaluate λ="L_len" by="morph" at="Φ.a🌵1">
        <minted symbol="𝜎5">𝜎4 𝜎4</minted>
      </evaluate>
      <manufactured meta="𝛿·3·1">𝜎5</manufactured>
    </dataize>
    <msec>1</msec>
    <firings>1</firings>
    <fps>1000</fps>
  </protocol>
