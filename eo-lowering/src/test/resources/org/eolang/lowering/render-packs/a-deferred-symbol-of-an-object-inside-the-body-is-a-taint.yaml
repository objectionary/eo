---
# yamllint disable rule:line-length
# The copy is of a formation inside the body the atom replaces, which the
# patching drops with the body, so at runtime there is nothing to apply.
locator: Φ.joined
number: 54
taint: The deferred symbol 𝜎134 of the entry 54 copies Φ.joined.φ.α2, which the atom replaces
eo:
  joined.eo: |
    [items] > joined
      if. > @
        items.length.eq 0
        --
        with-delimiter items.head items.tail
      [acc tup] > with-delimiter
        acc > @
voids:
  - "𝜎53\t54\titems.length\tnumber"
  - "𝜎54\t54\titems.head\tobject"
  - "𝜎55\t54\titems.tail\ttuple"
links: |
  <links>
    <type id="Φ.joined.φ">
      <ref loc="Φ.string"/>
    </type>
  </links>
protocol: |
  <protocol>
    <morph at="Φ.l/.e54">
      <evaluate λ="L_entry" by="morph" at="Φ.l/.e54">
        <evaluate λ="L_bytes_eq" by="morph" at="Φ.a🌵1">
          <dataize meta="𝛿1.2">𝜎53:λ</dataize>
          <bind meta="𝛿2.2">00-00-00-00-00-00-00-00</bind>
          <minted symbol="𝜎133">𝜎53 00-00-00-00-00-00-00-00</minted>
        </evaluate>
        <deferred symbol="𝜎134" by="morph" at="Φ.a🌵1.φ" of="Φ.joined.φ.α2"><with><attr name="acc">𝜎54</attr><attr name="tup">𝜎55</attr></with><e>⟦ φ ↦ acc, +2 ⟧</e></deferred>
      </evaluate>
      <evaluate λ="L_root" by="morph" at="Φ.l/.e54">
        <evaluate λ="L_fork" by="dataize" at="Φ.a🌵4">
          <dataize meta="𝛿1.4">𝜎133:λ</dataize>
          <known symbol="𝜎135">--</known>
          <joined symbol="𝜎136">𝜎135 𝜎134</joined>
        </evaluate>
        <dataize meta="𝛿1.5">𝜎136:λ</dataize>
      </evaluate>
    </morph>
    <msec>400</msec>
    <firings>5</firings>
    <fps>12</fps>
  </protocol>
