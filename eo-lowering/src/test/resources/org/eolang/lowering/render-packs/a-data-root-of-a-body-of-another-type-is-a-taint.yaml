---
# yamllint disable rule:line-length
# Each flow comes down to data, the protocol does not name the object
# around it, and inference says the body may be a string or a number,
# since `app` hands `pick` a `true` once and a `false` the other time. A
# string is no number, bool or bytes, and the atom would return its bytes
# bare, without the object around them, so the entry stays in EO.
locator: Φ.pick
number: 1
taint: is bare data, while inference says Φ.pick returns Φ.string, and bare data would lose the object around it
eo:
  pick.eo: |
    [c] > pick
      c.if "yes" 5 > @
  app.eo: |
    [] > app
      pick true > yes
      pick false > no
voids:
  - "𝜎1\t1\tc\tbool"
protocol: |
  <protocol>
    <dataize at="Φ.l🌵.e1">
      <evaluate λ="L_fork" by="dataize" at="Φ.a🌵2">
        <dataize at="Φ.a🌵7">
          <manufactured meta="𝛿·3·1">𝜎1</manufactured>
        </dataize>
        <bound meta="𝛿1·3">𝛿·3·1</bound>
        <morph at="Φ.a🌵3">
          <applied meta="𝑛·3·1" by="morph" at="Φ.a🌵3" of="Φ.bytes"><datum attr="φ">79-65-73</datum></applied>
        </morph>
        <forked on="𝜎1">
          <left>
            <answered meta="𝑛·3·2">𝑛·3·1</answered>
            <dataized meta="𝛿·2·1">79-65-73</dataized>
          </left>
          <right>
            <answered meta="𝑛·6·2">𝑛·6·1</answered>
            <dataized meta="𝛿·5·1">40-14-00-00-00-00-00-00</dataized>
          </right>
        </forked>
      </evaluate>
    </dataize>
    <msec>120</msec>
    <firings>5</firings>
    <fps>50</fps>
  </protocol>
