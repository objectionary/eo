---
# yamllint disable rule:line-length
# Each path comes down to data, the protocol does not name the object
# around it, and inference says the body may be a string or an "i64",
# which is no number, bool or bytes. The atom would return the bytes of
# that string or "i64" bare, without the object around them, so the entry
# stays in EO.
locator: Φ.pick
number: 1
taint: is bare data, while inference says Φ.pick returns Φ.string and Φ.i64, and bare data would lose the object around it
eo:
  pick.eo: |
    [c] > pick
      c.if "yes" 5 > @
voids:
  - "𝜎1\t1\tc\tbool"
links: |
  <links>
    <type id="Φ.pick.φ">
      <ref loc="Φ.string"/>
      <ref loc="Φ.i64"/>
    </type>
  </links>
protocol: |
  <protocol>
    <path>
      <morph at="Φ.l/.e1">
        <evaluate λ="L_entry" by="morph" at="Φ.l/.e1"/>
        <evaluate λ="L_root" by="morph" at="Φ.l/.e1">
          <dataize at="Φ.a🌵2">
            <evaluate λ="L_fork" by="dataize" at="Φ.a🌵2">
              <dataize at="Φ.a🌵7">
                <manufactured meta="𝛿·3·1">𝜎1</manufactured>
              </dataize>
              <bound meta="𝛿1·3">𝛿·3·1</bound>
              <morph at="Φ.a🌵3">
                <applied meta="𝑛·3·1" by="morph" at="Φ.a🌵3" of="Φ.bytes"><datum name="φ">79-65-73</datum></applied>
              </morph>
              <forked side="left">𝜎1</forked>
              <answered meta="𝑛·3·2">𝑛·3·1</answered>
            </evaluate>
            <dataized meta="𝛿·2·1">79-65-73</dataized>
          </dataize>
          <bound meta="𝛿1·2">𝛿·2·1</bound>
        </evaluate>
      </morph>
    </path>
    <path>
      <morph at="Φ.l/.e1">
        <evaluate λ="L_root" by="morph" at="Φ.l/.e1">
          <dataize at="Φ.a🌵2">
            <evaluate λ="L_fork" by="dataize" at="Φ.a🌵2">
              <forked side="right">𝜎1</forked>
              <answered meta="𝑛·6·2">𝑛·6·1</answered>
            </evaluate>
            <dataized meta="𝛿·5·1">40-14-00-00-00-00-00-00</dataized>
          </dataize>
          <bound meta="𝛿1·5">𝛿·5·1</bound>
        </evaluate>
      </morph>
    </path>
    <msec>120</msec>
    <firings>6</firings>
    <fps>50</fps>
  </protocol>
