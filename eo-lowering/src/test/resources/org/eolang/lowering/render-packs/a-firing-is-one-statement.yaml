# The body of neg is one firing of times over its receiver and the literal
# minus one, so the atom reads the void into a double, multiplies it by the
# bits of minus one in one statement, and returns the product as a number.
locator: Φ.number.neg
number: 217
eo:
  number.eo: |
    [] > number
      [] > neg
        ^.times -1 > @
voids:
  - "𝜎200\t217\tρ\tnumber"
protocol: |
  <morph at="Φ.l🌵.e217">
    <evaluate λ="L_entry" by="morph" at="Φ.l🌵.e217">
      <evaluate λ="L_number_times" by="morph" at="Φ.a🌵1">
        <dataize meta="𝛿1.2">𝜎200:λ</dataize>
        <bind meta="𝛿2.2">BF-F0-00-00-00-00-00-00</bind>
        <minted symbol="𝜎752">𝜎200 BF-F0-00-00-00-00-00-00</minted>
      </evaluate>
    </evaluate>
    <evaluate λ="L_root" by="morph" at="Φ.l🌵.e217">
      <dataize meta="𝛿1.3">𝜎752:λ</dataize>
    </evaluate>
  </morph>
