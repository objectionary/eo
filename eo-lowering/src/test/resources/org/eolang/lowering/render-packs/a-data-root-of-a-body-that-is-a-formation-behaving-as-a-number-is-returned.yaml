# The root is a number the atom computed, so the atom returns it bare, and
# the tables must say the body is a number, a string, a bool or bytes. The
# object `dozen` binds `word` besides its body, and its body is a formation
# that binds nothing but a body of its own. The row of the body names that
# formation, and what the formation reduces to, in its own row, is a
# number. `app` hands `dozen` a number and takes an attribute off it, so the
# engine walks the body.
