---
# yamllint disable rule:line-length
# The fork that raises is an operand of "and", so it does not give the body,
# and a guard at the top of the atom would throw before "and" reads it.
locator: Φ.bytes.xor
number: 7
taint: raises when 𝜎137 is false, but the fork that raises does not give the body
eo:
  bytes.eo: |
    [] > bytes
      [b] > xor
        ^.and > @
          if.
            ^.size.as-bytes.eq b.size.as-bytes
            b
            T "bytes.xor requires operands of the same length"
voids:
  - "𝜎7\t7\tρ\tbytes"
  - "𝜎8\t7\tb\tbytes"
protocol: |
  <protocol>
    <morph at="Φ.l/.e7">
      <evaluate λ="L_entry" by="morph" at="Φ.l/.e7">
        <evaluate λ="L_bytes_size" by="morph" at="Φ.a🌵1.b">
          <dataize meta="𝛿1·2">𝜎7:λ</dataize>
          <minted symbol="𝜎135">𝜎7</minted>
        </evaluate>
        <evaluate λ="L_bytes_size" by="morph" at="Φ.a🌵1.b">
          <dataize meta="𝛿1·3">𝜎8:λ</dataize>
          <minted symbol="𝜎136">𝜎8</minted>
        </evaluate>
        <evaluate λ="L_bytes_eq" by="morph" at="Φ.a🌵1.b">
          <dataize meta="𝛿1·4">𝜎135:λ</dataize>
          <dataize meta="𝛿2·4">𝜎136:λ</dataize>
          <minted symbol="𝜎137">𝜎135 𝜎136</minted>
        </evaluate>
        <evaluate λ="L_fork" by="morph" at="Φ.a🌵1.b">
          <dataize meta="𝛿1·5">𝜎137:λ</dataize>
          <applied meta="𝑛·5·3" by="morph" at="Φ.a🌵8.message" of="Φ.bytes"><attr name="φ">62-79-74-65-73-2E-78-6F-72-20-72-65-71-75-69-72-65-73-20-6F-70-65-72-61-6E-64-73-20-6F-66-20-74-68-65-20-73-61-6D-65-20-6C-65-6E-67-74-68:Δ</attr></applied>
          <applied meta="𝑛·5·4" by="morph" at="Φ.a🌵8.message" of="Φ.string"><attr name="φ">𝑛·5·3</attr></applied>
          <terminate symbol="𝜎137" branch="right" message="𝑛·5·4"/>
          <answer meta="𝑛·5·6">𝑛·5·1</answer>
        </evaluate>
        <evaluate λ="L_bytes_and" by="morph" at="Φ.a🌵1">
          <dataize meta="𝛿1·6">𝜎7:λ</dataize>
          <dataize meta="𝛿2·6">𝜎8:λ</dataize>
          <minted symbol="𝜎138">𝜎7 𝜎8</minted>
          <applied meta="𝑛·6·3" by="morph" at="𝑛·6·2" of="Φ.bytes"><attr name="φ">𝜎138</attr></applied>
        </evaluate>
        <bind meta="𝑛1·1">𝑛·6·3</bind>
      </evaluate>
      <evaluate λ="L_root" by="morph" at="Φ.l/.e7">
        <dataize meta="𝛿1·7">𝜎138:λ</dataize>
      </evaluate>
    </morph>
    <msec>30</msec>
    <firings>7</firings>
    <fps>233</fps>
  </protocol>
