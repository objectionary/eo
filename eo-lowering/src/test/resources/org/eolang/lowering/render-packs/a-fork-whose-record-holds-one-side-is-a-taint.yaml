---
# yamllint disable rule:line-length
# The run forks on the comparison and the record of the fork holds its left
# side alone, as happens when phino cuts the flows it runs, so the tree of
# ifs has no else, and the entry stays in EO.
locator: Φ.bytes.as-bool
number: 8
taint: The entry 8 forks on 𝜎752 before any decision, while phino never ran its right side, as it does when the flows are cut
eo:
  bytes.eo: |
    [@] > bytes
      [^] > as-bool
        (^.eq FF-).if true false > @
      [] > eq /Q.bool
        ? > ^
        ? > b
voids:
  - "𝜎10\t8\tρ\tbytes"
protocol: |
  <protocol>
    <dataize at="Φ.l🌵.e8">
      <evaluate λ="L_bytes_eq" by="morph" at="Φ.a🌵1">
        <dataize at="Φ.a🌵7">
          <manufactured meta="𝛿·2·1">𝜎10</manufactured>
        </dataize>
        <bound meta="𝛿1·2">𝛿·2·1</bound>
        <dataize at="Φ.a🌵8">
          <dataized meta="𝛿·2·2">FF-</dataized>
        </dataize>
        <bound meta="𝛿2·2">𝛿·2·2</bound>
        <minted symbol="𝜎752">𝜎10 FF-</minted>
      </evaluate>
      <evaluate λ="L_fork" by="dataize" at="Φ.a🌵2">
        <dataize at="Φ.a🌵9">
          <manufactured meta="𝛿·3·1">𝜎752</manufactured>
        </dataize>
        <bound meta="𝛿1·3">𝛿·3·1</bound>
        <morph at="Φ.a🌵3">
          <applied meta="𝑛·3·1" by="morph" at="Φ.a🌵3" of="Φ.bytes"><datum attr="φ">FF-</datum></applied>
        </morph>
        <forked on="𝜎752">
          <left>
            <answered meta="𝑛·3·2">𝑛·3·1</answered>
            <dataized meta="𝛿·2·1">FF-</dataized>
          </left>
        </forked>
      </evaluate>
    </dataize>
    <msec>120</msec>
    <firings>5</firings>
    <fps>50</fps>
  </protocol>
