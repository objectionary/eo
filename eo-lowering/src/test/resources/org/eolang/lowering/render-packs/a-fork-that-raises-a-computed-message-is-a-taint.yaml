---
# yamllint disable rule:line-length
# The message the fork raises is a "printf", which phino leaves as code, so
# the atom would have to compute the message, and such an atom is not
# written yet. The forks inside the message do not matter then.
locator: Φ.bytes.xor
number: 7
taint: raises when 𝜎137 is false, but its message 𝑛·6·378 is not a string literal
eo:
  bytes.eo: |
    [] > bytes
      [b] > xor
        if. > @
          ^.size.as-bytes.eq b.size.as-bytes
          ^.or b
          T
            "bytes.xor requires operands of the same length, got %d".printf
              * ^.size
voids:
  - "𝜎7\t7\tρ\tbytes"
  - "𝜎8\t7\tb\tbytes"
protocol: |
  <protocol>
    <morph at="Φ.l/.e7">
      <evaluate λ="L_entry" by="morph" at="Φ.l/.e7">
        <evaluate λ="L_bytes_size" by="morph" at="Φ.a🌵1">
          <dataize meta="𝛿1·2">𝜎7</dataize>
          <minted symbol="𝜎135">𝜎7</minted>
        </evaluate>
        <evaluate λ="L_bytes_eq" by="morph" at="Φ.a🌵1">
          <dataize meta="𝛿1·3">𝜎135</dataize>
          <evaluate λ="L_bytes_size" by="morph" at="Φ.a🌵4">
            <dataize meta="𝛿1·4">𝜎8</dataize>
            <minted symbol="𝜎136">𝜎8</minted>
          </evaluate>
          <dataize meta="𝛿2·3">𝜎136</dataize>
          <minted symbol="𝜎137">𝜎135 𝜎136</minted>
        </evaluate>
        <evaluate λ="L_bytes_or" by="morph" at="Φ.a🌵1.left">
          <dataize meta="𝛿1·5">𝜎7</dataize>
          <dataize meta="𝛿2·5">𝜎8</dataize>
          <minted symbol="𝜎138">𝜎7 𝜎8</minted>
          <applied meta="𝑛·5·4" by="morph" at="𝑛·5·3" of="Φ.bytes"><attr name="φ">𝜎138</attr></applied>
        </evaluate>
        <evaluate λ="L_fork" by="morph" at="Φ.a🌵1">
          <dataize meta="𝛿1·6">𝜎137</dataize>
          <applied meta="𝑛·6·2" by="morph" at="Φ.a🌵10.message" of="Φ.bytes"><attr name="φ">62-79-74-65-73-2E-78-6F-72-20-72-65-71-75-69-72-65-73-20-6F-70-65-72-61-6E-64-73-20-6F-66-20-74-68-65-20-73-61-6D-65-20-6C-65-6E-67-74-68-2C-20-67-6F-74-20-25-64</attr></applied>
          <evaluate λ="L_fork" by="morph" at="Φ.a🌵874">
            <known symbol="𝜎651">40-20-00-00-00-00-00-00</known>
            <stuck λ="L_fork"/>
          </evaluate>
          <applied meta="𝑛·6·377" by="morph" at="Φ.a🌵10.message" of="Φ.string"><attr name="φ">𝑛·6·2</attr></applied>
          <applied meta="𝑛·6·378" by="morph" at="Φ.a🌵10.message" of="𝑛·6·377.printf"><attr name="args">𝑛·6·376</attr></applied>
          <terminate symbol="𝜎137" branch="right" message="𝑛·6·378"/>
          <answer meta="𝑛·6·380">𝑛·5·4</answer>
        </evaluate>
        <bind meta="𝑛1·1">𝑛·5·4</bind>
      </evaluate>
      <evaluate λ="L_root" by="morph" at="Φ.l/.e7">
        <dataize meta="𝛿1·7">𝜎138</dataize>
      </evaluate>
    </morph>
    <msec>28</msec>
    <firings>7</firings>
    <fps>250</fps>
  </protocol>
