---
# Two firings minted the same symbol for two different values, so the root
# that reads it may mean either one, and no Java can tell which.
locator: Φ.number.neg
number: 217
taint: >-
  The symbol 𝜎752 of the entry 217 is defined 2 times,
  while phino mints every symbol once
eo:
  number.eo: |
    [] > number
      [] > neg
        ^.times -1 > @
voids:
  - "𝜎200\t217\tρ\tnumber"
protocol: |
  <protocol>
    <morph at="Φ.l🌵.e217">
      <evaluate λ="L_entry" by="morph" at="Φ.l🌵.e217">
        <evaluate λ="L_number_gt" by="morph" at="Φ.a🌵3">
          <dataize meta="𝛿1.2">𝜎200:λ</dataize>
          <bind meta="𝛿2.2">40-20-00-00-00-00-00-00</bind>
          <minted symbol="𝜎752">𝜎200 40-20-00-00-00-00-00-00</minted>
        </evaluate>
        <evaluate λ="L_number_times" by="morph" at="Φ.a🌵1">
          <dataize meta="𝛿1.3">𝜎200:λ</dataize>
          <bind meta="𝛿2.3">BF-F0-00-00-00-00-00-00</bind>
          <minted symbol="𝜎752">𝜎200 BF-F0-00-00-00-00-00-00</minted>
        </evaluate>
      </evaluate>
      <evaluate λ="L_root" by="morph" at="Φ.l🌵.e217">
        <dataize meta="𝛿1.4">𝜎752:λ</dataize>
      </evaluate>
    </morph>
    <msec>103</msec>
    <firings>3</firings>
    <fps>29</fps>
  </protocol>
