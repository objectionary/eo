---
# Two firings minted the same symbol for two different values, so the root
# that reads it may mean either one, and no Java can tell which.
locator: Φ.number.neg
number: 217
taint: >-
  The symbol 𝜎752 of the entry 217 is defined 2 times,
  while phino mints every symbol once
eo:
  number.eo: |
    [] > number
      [] > neg
        ^.times -1 > @
voids:
  - "𝜎200\t217\tρ\tnumber"
protocol: |
  <protocol>
    <dataize at="Φ.l🌵.e217">
      <evaluate λ="L_number_gt" by="morph" at="Φ.a🌵3">
        <dataize at="Φ.a🌵4">
          <manufactured meta="𝛿·2·1">𝜎200</manufactured>
        </dataize>
        <bound meta="𝛿1·2">𝛿·2·1</bound>
        <dataize at="Φ.a🌵5">
          <dataized meta="𝛿·2·2">40-20-00-00-00-00-00-00</dataized>
        </dataize>
        <bound meta="𝛿2·2">𝛿·2·2</bound>
        <minted symbol="𝜎752">𝜎200 40-20-00-00-00-00-00-00</minted>
      </evaluate>
      <evaluate λ="L_number_times" by="morph" at="Φ.a🌵1">
        <dataize at="Φ.a🌵6">
          <manufactured meta="𝛿·3·1">𝜎200</manufactured>
        </dataize>
        <bound meta="𝛿1·3">𝛿·3·1</bound>
        <dataize at="Φ.a🌵7">
          <dataized meta="𝛿·3·2">BF-F0-00-00-00-00-00-00</dataized>
        </dataize>
        <bound meta="𝛿2·3">𝛿·3·2</bound>
        <minted symbol="𝜎752">𝜎200 BF-F0-00-00-00-00-00-00</minted>
      </evaluate>
      <manufactured meta="𝛿·4·1">𝜎752</manufactured>
    </dataize>
    <msec>103</msec>
    <firings>2</firings>
    <fps>29</fps>
  </protocol>
