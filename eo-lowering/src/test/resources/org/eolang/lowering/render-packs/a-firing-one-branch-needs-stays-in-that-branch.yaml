java:
  - "        final double s1 = new Dataized(this.take(\"ρ\").take(\"t\")).asNumber();\n        final boolean s2 = s1 > Double.longBitsToDouble(0x0000000000000000L);\n        final double s5;\n        if (s2) {\n            final double s3 = s1 + Double.longBitsToDouble(0x3FF0000000000000L);\n            s5 = s3;\n        } else {\n            final double s4 = s1 + Double.longBitsToDouble(0x4000000000000000L);\n            s5 = s4;\n        }\n        final double s6 = s1 + Double.longBitsToDouble(0x3FF0000000000000L);\n        final double s7 = s5 + s6;\n        return new Data.ToPhi(s7);\n"
