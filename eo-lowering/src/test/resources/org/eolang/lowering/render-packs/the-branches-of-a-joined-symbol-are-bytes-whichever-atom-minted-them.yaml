# yamllint disable rule:line-length
# phino joined the sides of the if into one symbol, while one side is a
# number a plus minted and the other one is bytes an or minted. Every
# symbol is data, so both branches are bytes, whichever atom minted them,
# and the plus writes its double back into eight bytes.
locator: Φ.pick
number: 1
eo:
  pick.eo: |
    [x b] > pick
      if. > @
        x.gt 0
        x.plus 1
        b.or 01-
  number.eo: |
    [@] > number
      [] > gt /Q.bool
        ? > ^
        ? > b /Q.number
      [] > plus /Q.number
        ? > ^
        ? > b /Q.number
  bytes.eo: |
    [@] > bytes
      [] > or /Q.number
        ? > ^
        ? > b
  app.eo: |
    [] > app
      pick 5 0F- > used
voids:
  - "𝜎1\t1\tx\tnumber"
  - "𝜎2\t1\tb\tbytes"
protocol: |
  <protocol>
    <dataize at="Φ.l🌵.e1">
      <evaluate λ="L_number_gt" by="morph" at="Φ.a🌵1">
        <minted symbol="𝜎3">𝜎1 00-00-00-00-00-00-00-00</minted>
      </evaluate>
      <evaluate λ="L_fork" by="dataize" at="Φ.a🌵2">
        <dataize at="Φ.a🌵6">
          <manufactured meta="𝛿·3·1">𝜎3</manufactured>
        </dataize>
        <bound meta="𝛿1·3">𝛿·3·1</bound>
        <evaluate λ="L_number_plus" by="morph" at="Φ.a🌵3">
          <minted symbol="𝜎4">𝜎1 3F-F0-00-00-00-00-00-00</minted>
        </evaluate>
        <evaluate λ="L_bytes_or" by="morph" at="Φ.a🌵4">
          <minted symbol="𝜎5">𝜎2 01-</minted>
        </evaluate>
        <joined symbol="𝜎6" on="𝛿1·3" left="𝜎4" right="𝜎5"/>
        <answered meta="𝑛·3·3">𝑛·3·2</answered>
      </evaluate>
      <manufactured meta="𝛿·2·1">𝜎6</manufactured>
    </dataize>
    <msec>30</msec>
    <firings>4</firings>
    <fps>166</fps>
  </protocol>
