---
# The root reads a symbol no firing minted and no void is, so there is no
# Java to compute it with.
locator: Φ.number.neg
number: 217
taint: The symbol 𝜎200 of the entry 217 is read, while nothing defines it
eo:
  number.eo: |
    [] > number
      [] > neg
        ^.times -1 > @
protocol: |
  <morph at="Φ.l🌵.e217">
    <evaluate λ="L_entry" by="morph" at="Φ.l🌵.e217">
      <evaluate λ="L_number_times" by="morph" at="Φ.a🌵1">
        <minted symbol="𝜎752">𝜎200 BF-F0-00-00-00-00-00-00</minted>
      </evaluate>
    </evaluate>
    <evaluate λ="L_root" by="morph" at="Φ.l🌵.e217">
      <dataize meta="𝛿1.3">𝜎752:λ</dataize>
    </evaluate>
  </morph>
