# The body adds the seconds and the micros of one moment. The posix
# gettimeofday answers a record of three fields, and its one firing mints a
# symbol for each of them. The atom asks the C library once, keeps the
# record in one local of its lambda, and gives that local to every method
# that reads a field of it, directly or through another symbol, so that the
# seconds and the micros come from the same moment. Nobody reads the code
# of the record, so it gets no method.
