---
# phino left the fork of the body unfinished, with no step it got no answer
# for, so the root firing never came.
locator: Φ.flag.both
number: 1
taint: phino left L_fork unfinished
eo:
  flag.eo: |
    [] > flag
      [] > both
        ^.at > @
protocol: |
  <morph at="Φ.l🌵.e1">
    <evaluate λ="L_entry" by="morph" at="Φ.l🌵.e1">
      <answer meta="𝑛.1.2">⟦ λ ⤍ L_root, +1 ⟧</answer>
    </evaluate>
    <evaluate λ="L_root" by="morph" at="Φ.l🌵.e1">
      <evaluate λ="L_fork" by="dataize" at="Φ.a🌵5">
        <known symbol="𝜎84">00-</known>
        <unfinished λ="L_fork"/>
      </evaluate>
      <unfinished λ="L_fork"/>
    </evaluate>
  </morph>
