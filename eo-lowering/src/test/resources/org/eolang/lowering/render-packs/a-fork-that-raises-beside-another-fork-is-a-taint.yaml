---
# yamllint disable rule:line-length
# The fork that raises gives the body, but its branch holds a fork that
# joins. The protocol does not say which branch of which fork a record sits
# in, so the atom cannot be sure that no fork that raises sits inside the
# branch of another one.
locator: Φ.bytes.xor
number: 7
taint: raises when 𝜎137 is false, while it forks on other conditions too
eo:
  bytes.eo: |
    [] > bytes
      [b] > xor
        if. > @
          ^.size.as-bytes.eq b.size.as-bytes
          if.
            ^.size.as-bytes.eq 00-00-00-00-00-00-00-00
            ^.or b
            ^.and b
          T "bytes.xor requires operands of the same length"
voids:
  - "𝜎7\t7\tρ\tbytes"
  - "𝜎8\t7\tb\tbytes"
protocol: |
  <protocol>
    <morph at="Φ.l/.e7">
      <evaluate λ="L_entry" by="morph" at="Φ.l/.e7">
        <evaluate λ="L_bytes_size" by="morph" at="Φ.a🌵1">
          <dataize meta="𝛿1·2">𝜎7</dataize>
          <minted symbol="𝜎135">𝜎7</minted>
        </evaluate>
        <evaluate λ="L_bytes_eq" by="morph" at="Φ.a🌵1">
          <dataize meta="𝛿1·3">𝜎135</dataize>
          <evaluate λ="L_bytes_size" by="morph" at="Φ.a🌵4">
            <dataize meta="𝛿1·4">𝜎8</dataize>
            <minted symbol="𝜎136">𝜎8</minted>
          </evaluate>
          <dataize meta="𝛿2·3">𝜎136</dataize>
          <minted symbol="𝜎137">𝜎135 𝜎136</minted>
        </evaluate>
        <evaluate λ="L_bytes_size" by="morph" at="Φ.a🌵1.left"/>
        <evaluate λ="L_bytes_eq" by="morph" at="Φ.a🌵1.left">
          <dataize meta="𝛿1·6">𝜎135</dataize>
          <minted symbol="𝜎138">𝜎135 00-00-00-00-00-00-00-00</minted>
        </evaluate>
        <evaluate λ="L_bytes_or" by="morph" at="Φ.a🌵1.left">
          <dataize meta="𝛿1·7">𝜎7</dataize>
          <dataize meta="𝛿2·7">𝜎8</dataize>
          <minted symbol="𝜎139">𝜎7 𝜎8</minted>
        </evaluate>
        <evaluate λ="L_bytes_and" by="morph" at="Φ.a🌵1.left">
          <dataize meta="𝛿1·8">𝜎7</dataize>
          <dataize meta="𝛿2·8">𝜎8</dataize>
          <minted symbol="𝜎140">𝜎7 𝜎8</minted>
        </evaluate>
        <evaluate λ="L_fork" by="morph" at="Φ.a🌵1.left">
          <dataize meta="𝛿1·9">𝜎138</dataize>
          <joined symbol="𝜎141">𝜎139 𝜎140</joined>
          <formed meta="𝑛·9·1" of="Φ.bytes"><attr name="φ">𝜎141</attr></formed>
          <answer meta="𝑛·9·2">𝑛·9·1</answer>
        </evaluate>
        <evaluate λ="L_fork" by="morph" at="Φ.a🌵1">
          <dataize meta="𝛿1·10">𝜎137</dataize>
          <applied meta="𝑛·10·2" by="morph" at="Φ.a🌵17.message" of="Φ.bytes"><attr name="φ">62-79-74-65-73-2E-78-6F-72-20-72-65-71-75-69-72-65-73-20-6F-70-65-72-61-6E-64-73-20-6F-66-20-74-68-65-20-73-61-6D-65-20-6C-65-6E-67-74-68</attr></applied>
          <applied meta="𝑛·10·3" by="morph" at="Φ.a🌵17.message" of="Φ.string"><attr name="φ">𝑛·10·2</attr></applied>
          <terminate symbol="𝜎137" branch="right" message="𝑛·10·3"/>
          <answer meta="𝑛·10·5">𝑛·9·1</answer>
        </evaluate>
        <bind meta="𝑛1·1">𝑛·9·1</bind>
      </evaluate>
      <evaluate λ="L_root" by="morph" at="Φ.l/.e7">
        <dataize meta="𝛿1·11">𝜎141</dataize>
      </evaluate>
    </morph>
    <msec>41</msec>
    <firings>11</firings>
    <fps>268</fps>
  </protocol>
