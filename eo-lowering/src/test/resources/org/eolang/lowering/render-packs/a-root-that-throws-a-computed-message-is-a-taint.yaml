---
# yamllint disable rule:line-length
# The root throws, but its message is not a string literal: the protocol
# applies "Φ.string" to a void, and not to literal bytes, so the atom would
# have to compute the message, and such an atom is not written yet.
locator: Φ.blob
number: 3
taint: its message 𝑛·1·3 is not a string literal
eo:
  blob.eo: |
    [b] > blob
      T (string b) > @
voids:
  - "𝜎1\t3\tb\tbytes"
protocol: |
  <protocol>
    <morph at="Φ.l/.e3">
      <evaluate λ="L_entry" by="morph" at="Φ.l/.e3">
        <morph at="Φ.a🌵1">
          <applied meta="𝑛·1·3" of="Φ.string"><attr name="φ">𝜎1</attr></applied>
          <applied meta="𝑛·1·4" by="morph" at="Φ.a🌵1" of="Φ.l/.throw"><attr name="message">𝑛·1·3</attr></applied>
        </morph>
        <bind meta="𝑛1·1">𝑛·1·4</bind>
        <applied meta="𝑛·1·5" of="Φ.l/.root"><attr name="α0">𝑛·1·4</attr></applied>
        <built meta="𝑛·1·6">𝑛·1·5</built>
        <morph at="𝑛·1·6">
          <applied meta="𝑛·1·7" by="morph" at="𝑛·1·6" of="Φ.l/.root"><attr name="v">𝑛·1·4</attr></applied>
        </morph>
        <answer meta="𝑛·1·8">𝑛·1·7</answer>
      </evaluate>
      <evaluate λ="L_root" by="morph" at="Φ.l/.e3">
        <dataize at="Φ.a🌵2">
          <unanswered λ="L_throw" by="dataize">𝑛·1·4</unanswered>
        </dataize>
        <stuck λ="L_throw"/>
      </evaluate>
    </morph>
    <msec>1</msec>
    <firings>2</firings>
    <fps>2000</fps>
  </protocol>
