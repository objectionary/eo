---
# yamllint disable rule:line-length
# The root throws, but phino writes its message as an object and not as a
# string literal, here since its bytes are no text in UTF-8, so the atom
# would have to compute the message, and such an atom is not written yet.
locator: Φ.blob
number: 3
taint: its message Φ.string( φ ↦ Φ.bytes( φ ↦ FF-FE:Δ ) ) is not a string literal
eo:
  blob.eo: |
    [] > blob
      T (string FF-FE) > @
protocol: |
  <protocol>
    <morph at="Φ.l/.e3">
      <evaluate λ="L_entry" by="morph" at="Φ.l/.e3">
        <applied meta="𝑛.1.3" by="morph" at="Φ.a🌵1" of="⟦ message ↦ ∅, λ ⤍ L_throw ⟧"><attr name="message">Φ.string( φ ↦ Φ.bytes( φ ↦ FF-FE:Δ ) )</attr></applied>
        <bind meta="𝑛1.1">𝑛.1.3</bind>
        <built meta="𝑛.1.6">Φ.l/.root( 𝑛.1.3 )</built>
        <answer meta="𝑛.1.8">𝑛.1.7</answer>
      </evaluate>
      <evaluate λ="L_root" by="morph" at="Φ.l/.e3">
        <unanswered λ="L_throw" by="dataize">𝑛.1.3</unanswered>
        <unfinished λ="L_throw"/>
      </evaluate>
    </morph>
    <msec>1</msec>
    <firings>2</firings>
    <fps>2000</fps>
  </protocol>
