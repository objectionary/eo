---
# yamllint disable rule:line-length
# The root throws, but its message is not a string literal: the protocol
# applies "Φ.string" to a void, and not to literal bytes, so the atom would
# have to compute the message, and such an atom is not written yet.
locator: Φ.blob
number: 3
taint: its message 𝑛·1·3 is not a string literal
eo:
  blob.eo: |
    [b] > blob
      T (string b) > @
voids:
  - "𝜎1\t3\tb\tbytes"
protocol: |
  <protocol>
    <morph at="Φ.l/.e3">
      <evaluate λ="L_entry" by="morph" at="Φ.l/.e3">
        <morph at="Φ.a🌵1">
          <applied meta="𝑛·1·3" of="Φ.string"><symbol attr="φ">𝜎1</symbol></applied>
          <applied meta="𝑛·1·4" by="morph" at="Φ.a🌵1" of="Φ.l/.throw"><meta attr="message">𝑛·1·3</meta></applied>
        </morph>
        <bound meta="𝑛1·1">𝑛·1·4</bound>
        <dataize at="Φ.a🌵2">
          <unanswered λ="L_throw" by="dataize">𝑛·1·4</unanswered>
        </dataize>
        <stuck λ="L_throw"/>
      </evaluate>
    </morph>
    <msec>1</msec>
    <firings>1</firings>
    <fps>2000</fps>
  </protocol>
