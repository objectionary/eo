---
# yamllint disable rule:line-length
# phino joined the sides of the if into one symbol, while one side is a
# number a plus minted and the other one is bytes an or minted, so the
# blank final of the joined symbol has no one Java type to be declared
# with: the entry stays in EO.
locator: Φ.pick
number: 1
taint: The branches of the joined symbol 𝜎5 of the entry 1 are double and byte[]
eo:
  pick.eo: |
    [x b] > pick
      if. > @
        x.gt 0
        x.plus 1
        b.or 01-
voids:
  - "𝜎1\t1\tx\tnumber"
  - "𝜎2\t1\tb\tbytes"
links: |
  <links>
    <type id="Φ.pick.φ">
      <ref loc="Φ.number"/>
    </type>
  </links>
protocol: |
  <protocol>
    <morph at="Φ.l/.e1">
      <evaluate λ="L_entry" by="morph" at="Φ.l/.e1">
        <evaluate λ="L_number_gt" by="morph" at="Φ.a🌵1">
          <minted symbol="𝜎3">𝜎1 00-00-00-00-00-00-00-00</minted>
        </evaluate>
        <dataize at="Φ.a🌵2">
          <evaluate λ="L_fork" by="dataize" at="Φ.a🌵2">
            <dataize at="Φ.a🌵6">
              <manufactured meta="𝛿·3·1">𝜎3</manufactured>
            </dataize>
            <bound meta="𝛿1·3">𝛿·3·1</bound>
            <evaluate λ="L_number_plus" by="morph" at="Φ.a🌵3">
              <minted symbol="𝜎4">𝜎1 3F-F0-00-00-00-00-00-00</minted>
            </evaluate>
            <evaluate λ="L_bytes_or" by="morph" at="Φ.a🌵4">
              <minted symbol="𝜎6">𝜎2 01-</minted>
            </evaluate>
            <joined symbol="𝜎5" left="𝜎4" right="𝜎6">𝜎3</joined>
            <answered meta="𝑛·3·3">𝑛·3·2</answered>
          </evaluate>
          <manufactured meta="𝛿·2·1">𝜎5</manufactured>
        </dataize>
        <bound meta="𝛿1·2">𝛿·2·1</bound>
      </evaluate>
    </morph>
    <msec>30</msec>
    <firings>4</firings>
    <fps>166</fps>
  </protocol>
