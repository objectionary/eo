---
# yamllint disable rule:line-length
# One argument of the copy is no symbol, so the atom has nothing to bind it
# to, and a copy with a void left unset would fail when it runs.
locator: Φ.joined
number: 54
taint: The deferred symbol 𝜎134 of the entry 54 has the argument acc, which is no symbol
eo:
  joined.eo: |
    [items] > joined
      if. > @
        items.length.eq 0
        --
        with-delimiter items.head items.tail
      [acc tup] > with-delimiter
        acc > @
voids:
  - "𝜎53\t54\titems.length\tnumber"
  - "𝜎54\t54\titems.head\tobject"
  - "𝜎55\t54\titems.tail\ttuple"
protocol: |
  <protocol>
    <morph at="Φ.l🌵.e54">
      <evaluate λ="L_entry" by="morph" at="Φ.l🌵.e54">
        <evaluate λ="L_bytes_eq" by="morph" at="Φ.a🌵1">
          <dataize meta="𝛿1.2">𝜎53:λ</dataize>
          <bind meta="𝛿2.2">00-00-00-00-00-00-00-00</bind>
          <minted symbol="𝜎133">𝜎53 00-00-00-00-00-00-00-00</minted>
        </evaluate>
        <deferred symbol="𝜎134" by="morph" at="Φ.a🌵1.φ" of="Φ.joined.with-delimiter" with="acc:? tup:𝜎55">⟦ φ ↦ acc, +2 ⟧</deferred>
      </evaluate>
      <evaluate λ="L_root" by="morph" at="Φ.l🌵.e54">
        <evaluate λ="L_fork" by="dataize" at="Φ.a🌵4">
          <dataize meta="𝛿1.4">𝜎133:λ</dataize>
          <known symbol="𝜎135">--</known>
          <joined symbol="𝜎136">𝜎135 𝜎134</joined>
        </evaluate>
        <dataize meta="𝛿1.5">𝜎136:λ</dataize>
      </evaluate>
    </morph>
    <msec>400</msec>
    <firings>5</firings>
    <fps>12</fps>
  </protocol>
