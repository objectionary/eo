---
# yamllint disable rule:line-length
# phino joins a side it takes for the terminator without naming the copy
# of "throw" it raised, so there is no message to throw on that side, and
# the entry is a taint.
locator: Φ.bytes.xor
number: 7
eo:
  bytes.eo: |
    [@] > bytes
      [^ b] > xor
        if. > @
          ^.size.as-bytes.eq b.size.as-bytes
          ^.or b
          T "bytes.xor requires operands of the same length"
      [] > and /Q.bytes
        ? > ^
        ? > b /Q.bytes
      [] > eq /Q.bool
        ? > ^
        ? > b
      [] > or /Q.bytes
        ? > ^
        ? > b /Q.bytes
      [] > size /Q.number
        ? > ^
  number.eo: |
    [@] > number
      [] > as-bytes /Q.bytes
        ? > ^
voids:
  - "𝜎7\t7\tρ\tbytes"
  - "𝜎8\t7\tv🌵b\tbytes"
