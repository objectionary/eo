    [items] > joined
      if. > @
        items.length.eq 0
        --
        with-delimiter items.head items.tail
      [acc tup] > with-delimiter
        acc > @
  number.eo: |
    [@] > number
      [] > eq /Q.bool
        ? > ^
        ? > b
  tuple.eo: |
    [tail head length] > tuple
  app.eo: |
    [] > app
      joined (tuple (tuple 0 0 0) 01- 1) > used
