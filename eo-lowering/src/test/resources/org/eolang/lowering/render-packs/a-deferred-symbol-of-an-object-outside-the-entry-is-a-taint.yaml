# yamllint disable rule:line-length
# The copy is of a formation outside the entry, which the atom cannot
# reach from the object it lives in.
locator: Φ.joined
number: 54
taint: The deferred symbol 𝜎134 of the entry 54 copies Φ.other.with-delimiter, which is not inside Φ.joined
eo:
