---
# yamllint disable rule:line-length
# The root throws, and phino writes its message as a dispatch, since the
# object it reads sits inside the formation and phino never reached it.
# This module never parses a phi-expression, so the atom has nothing to
# build the message from, and the entry stays a taint.
locator: Φ.rude
number: 5
taint: always throws the message ξ.complaint, which is no object of the world applied to its φ
eo:
  rude.eo: |
    [] > rude
      T complaint > @
      "oops" > complaint
protocol: |
  <protocol>
    <morph at="Φ.l/.e5">
      <evaluate λ="L_entry" by="morph" at="Φ.l/.e5">
        <applied meta="𝑛·1·3" by="morph" at="Φ.a🌵1" of="⟦ message ↦ ∅, λ ⤍ L_throw ⟧"><attr name="message">ξ.complaint</attr></applied>
        <bind meta="𝑛1·1">𝑛·1·3</bind>
        <built meta="𝑛·1·6">Φ.l/.root( 𝑛·1·3 )</built>
        <answer meta="𝑛·1·8">𝑛·1·7</answer>
      </evaluate>
      <evaluate λ="L_root" by="morph" at="Φ.l/.e5">
        <unanswered λ="L_throw" by="dataize">𝑛·1·3</unanswered>
        <unfinished λ="L_throw"/>
      </evaluate>
    </morph>
    <msec>1</msec>
    <firings>2</firings>
    <fps>2000</fps>
  </protocol>
