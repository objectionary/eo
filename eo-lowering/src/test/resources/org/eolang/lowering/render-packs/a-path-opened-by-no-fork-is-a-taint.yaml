---
# yamllint disable rule:line-length
# The protocol holds two paths, while the first one takes the left side of
# no fork, so no fork opened the second one, and the tree of ifs has no
# place for it: the entry stays in EO.
locator: Φ.pick
number: 1
taint: The path 2 of the entry 1 was opened by no fork, while phino opens a path for every fork a path meets afresh
eo:
  pick.eo: |
    [x] > pick
      if. > @
        x.gt 0
        x.plus 1
        x.plus 2
voids:
  - "𝜎1\t1\tx\tnumber"
links: |
  <links>
    <type id="Φ.pick.φ">
      <ref loc="Φ.number"/>
    </type>
  </links>
protocol: |
  <protocol>
    <path>
      <morph at="Φ.l/.e1">
        <evaluate λ="L_entry" by="morph" at="Φ.l/.e1">
          <evaluate λ="L_number_gt" by="morph" at="Φ.a🌵1">
            <minted symbol="𝜎2">𝜎1 00-00-00-00-00-00-00-00</minted>
          </evaluate>
        </evaluate>
        <evaluate λ="L_root" by="morph" at="Φ.l/.e1">
          <dataize at="Φ.a🌵2">
            <evaluate λ="L_fork" by="dataize" at="Φ.a🌵2">
              <dataize at="Φ.a🌵6">
                <manufactured meta="𝛿·3·1">𝜎2</manufactured>
              </dataize>
              <bound meta="𝛿1·3">𝛿·3·1</bound>
              <evaluate λ="L_number_plus" by="morph" at="Φ.a🌵3">
                <minted symbol="𝜎3">𝜎1 3F-F0-00-00-00-00-00-00</minted>
              </evaluate>
              <evaluate λ="L_number_plus" by="morph" at="Φ.a🌵4">
                <minted symbol="𝜎4">𝜎1 40-00-00-00-00-00-00-00</minted>
              </evaluate>
              <answered meta="𝑛·3·3">𝑛·3·2</answered>
            </evaluate>
            <manufactured meta="𝛿·2·1">𝜎3</manufactured>
          </dataize>
          <bound meta="𝛿1·2">𝛿·2·1</bound>
        </evaluate>
      </morph>
    </path>
    <path>
      <morph at="Φ.l/.e1">
        <evaluate λ="L_root" by="morph" at="Φ.l/.e1">
          <dataize at="Φ.a🌵2">
            <evaluate λ="L_fork" by="dataize" at="Φ.a🌵2">
              <forked side="right">𝜎2</forked>
              <answered meta="𝑛·5·3">𝑛·5·2</answered>
            </evaluate>
            <manufactured meta="𝛿·4·1">𝜎4</manufactured>
          </dataize>
          <bound meta="𝛿1·4">𝛿·4·1</bound>
        </evaluate>
      </morph>
    </path>
    <msec>30</msec>
    <firings>6</firings>
    <fps>200</fps>
  </protocol>
