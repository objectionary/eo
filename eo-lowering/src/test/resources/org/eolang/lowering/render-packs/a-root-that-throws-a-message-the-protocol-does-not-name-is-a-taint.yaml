---
# yamllint disable rule:line-length
# The root throws, but phino stopped at the λ of "throw" for an expression
# it named and spelled out in no record, so no record of the protocol
# applies "throw" to a message. The atom cannot tell what to throw, so the
# entry is a taint.
locator: Φ.lost
number: 4
taint: phino stopped at L_throw for 𝑒1, while no record of its protocol gives the message
eo:
  lost.eo: |
    [] > lost
      T "oops" > @
protocol: |
  <protocol>
    <path>
      <morph at="Φ.l/.e4">
        <evaluate λ="L_entry" by="morph" at="Φ.l/.e4">
          <bound meta="𝑛1·1">𝑒1</bound>
          <applied meta="𝑛·1·2" of="Φ.l/.root"><meta name="α0">𝑒1</meta></applied>
          <built meta="𝑛·1·3">𝑛·1·2</built>
          <morph at="𝑛·1·3">
            <applied meta="𝑛·1·4" by="morph" at="𝑛·1·3" of="Φ.l/.root"><meta name="v">𝑒1</meta></applied>
          </morph>
          <answered meta="𝑛·1·5">𝑛·1·4</answered>
        </evaluate>
        <evaluate λ="L_root" by="morph" at="Φ.l/.e4">
          <dataize at="Φ.a🌵2">
            <unanswered λ="L_throw" by="dataize">𝑒1</unanswered>
          </dataize>
          <stuck λ="L_throw"/>
        </evaluate>
      </morph>
    </path>
    <msec>1</msec>
    <firings>2</firings>
    <fps>2000</fps>
  </protocol>
