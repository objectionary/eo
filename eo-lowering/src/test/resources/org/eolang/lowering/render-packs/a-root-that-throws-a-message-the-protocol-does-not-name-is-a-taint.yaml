---
# yamllint disable rule:line-length
# The root throws, but no record of the protocol applies "throw" to the
# message under the name phino stopped at, as with a phino older than
# 0.0.150, which wrote the whole copy there instead. The atom cannot tell
# what to throw, so the entry is a taint.
locator: Φ.lost
number: 4
taint: phino stopped at L_throw for ⟦ message ↦ "oops", λ ⤍ L_throw ⟧, while no record of its protocol gives the message
eo:
  lost.eo: |
    [] > lost
      T "oops" > @
protocol: |
  <protocol>
    <morph at="Φ.l/.e4">
      <evaluate λ="L_entry" by="morph" at="Φ.l/.e4">
        <bind meta="𝑛1·1">⟦ message ↦ "oops", λ ⤍ L_throw ⟧</bind>
        <built meta="𝑛·1·1">Φ.l/.root( ⟦ message ↦ "oops", λ ⤍ L_throw ⟧ )</built>
        <answer meta="𝑛·1·2">⟦ v ↦ ⟦ message ↦ "oops", λ ⤍ L_throw ⟧, λ ⤍ L_root ⟧</answer>
      </evaluate>
      <evaluate λ="L_root" by="morph" at="Φ.l/.e4">
        <unanswered λ="L_throw" by="dataize">⟦ message ↦ "oops", λ ⤍ L_throw ⟧</unanswered>
        <unfinished λ="L_throw"/>
      </evaluate>
    </morph>
    <msec>1</msec>
    <firings>2</firings>
    <fps>2000</fps>
  </protocol>
