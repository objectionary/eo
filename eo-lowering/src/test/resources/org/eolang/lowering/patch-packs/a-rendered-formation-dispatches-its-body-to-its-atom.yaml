---
# The body of gap was rendered as the atom of the entry 1, so its φ becomes a
# dispatch to that atom, the atom is one attribute more of gap, and the voids
# stay where they were.
eo:
  gap.eo: |
    [a b] > gap
      a.plus b > @
rendered:
  - "1\tΦ.gap"
patched:
  gap.xmir:
    - "/object/o[@name='gap']/o[@name='φ' and @base='ξ.l🌵1' and not(*)]"
    - "/object/o[@name='gap']/o[@name='l🌵1' and not(@base) and @loc='Φ.gap.l🌵1']/o[@name='λ' and @loc='Φ.gap.l🌵1.λ']"
    - "/object/o[@name='gap']/o[1][@name='a' and @base='∅']"
    - "/object/o[@name='gap']/o[2][@name='b' and @base='∅']"
    - "/object/o[@name='gap'][count(o)=4]"
    - "/object[not(//o[@base='.plus'])]"
