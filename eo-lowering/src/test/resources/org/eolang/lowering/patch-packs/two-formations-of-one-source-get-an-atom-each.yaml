---
# Both methods of one object were rendered, so each of them gets its own atom,
# named after its own entry, and the object gets none.
eo:
  pair.eo: |
    [] > pair
      [x] > twice
        x.times 2 > @
      [x] > thrice
        x.times 3 > @
rendered:
  - "4\tΦ.pair.twice"
  - "5\tΦ.pair.thrice"
patched:
  pair.xmir:
    - "/object/o[@name='pair']/o[@name='twice']/o[@name='φ' and @base='ξ.l🌵4']"
    - "/object/o[@name='pair']/o[@name='thrice']/o[@name='φ' and @base='ξ.l🌵5']"
    - "/object/o[@name='pair'][not(o[starts-with(@name, 'l🌵')])]"
