---
# Only the body of a rendered formation changes. Its φ becomes the atom in the
# same place among the bindings, and the nested formation and the test beside
# it stay as they were written.
eo:
  box.eo: |
    [x] > box
      x.times 2 > @
      [] > inner
        42 > @
      eq. ++> keeps-the-inner-one
        box.inner
        42
rendered:
  - "7\tΦ.box"
patched:
  box.xmir:
    - "/object/o[@name='box']/o[2][@name='φ' and not(@base)]/o[@name='λ']"
    - "/object/o[@name='box']/o[3][@name='inner']\
      /o[@name='φ' and @base='Φ.number']"
    - "/object/o[@name='box']/o[starts-with(@name, 'p🌵')]"
    - "/object/o[@name='box'][count(o[@name='φ'])=1]"
