---
# yamllint disable rule:line-length
# The atom `gt` says it returns `true` or `false`, a union of the two, and
# either of them is a bool, so the row answers the same fork as for an atom
# that returns `bool`. The engine names the atom in the row of the body only
# when the program has neither `true` nor `false`, so the tables are written
# here by hand.
eo:
  is-positive.eo: |
    +package number

    [^] > is-positive
      ^.gt 0 > @
facts: |
  <?xml version="1.0" encoding="UTF-8"?>
  <facts>
     <objects>
        <type bare="true" complete="false" id="Φ.number.is-positive">
           <attr name="ρ" rho="Φ.number" type="Φ.number.is-positive.ρ" void="true"/>
           <attr name="φ" type="Φ.number.is-positive.φ"/>
        </type>
        <type bare="true" complete="false" id="Φ.number.gt" returns="Φ.true|Φ.false">
           <attr name="ρ" rho="Φ.number" type="Φ.number.gt.ρ" void="true"/>
           <attr holds="Φ.number" name="b" type="Φ.number.gt.b" void="true"/>
        </type>
     </objects>
  </facts>
answers: |
  <?xml version="1.0" encoding="UTF-8"?>
  <answers>
    <o loc="Φ.number.is-positive.φ" copies="1">
      <is loc="Φ.number.gt"/>
    </o>
  </answers>
copies:
  - "//o[@loc='Φ.number.is-positive']/o[@name='λ' and text()='L_number_is_positive']"
rows:
  - "L_number_is_positive\tΦ.number.is-positive\tΦ.number.is-positive\tρ:number"
table:
  - "- λ: L_number_is_positive"
  - "    𝛿1: $.ρ"
  - "  𝑛: ⟦ φ ↦ Φ.bool( v🌵fork ↦ ⟦ λ ⤍ L_fork, left ↦ ∅, right ↦ ∅, on🌵 ↦ ⟦ λ ⤍ 𝜎 ⟧, left🌵 ↦ ξ.left, right🌵 ↦ ξ.right ⟧ ) ⟧"
