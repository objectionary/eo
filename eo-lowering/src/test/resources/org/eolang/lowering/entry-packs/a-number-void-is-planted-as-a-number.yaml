---
# A void the tables say holds a number is planted as the formation of `number`
# with the symbol where the bytes of a literal would be. The symbol is not
# planted bare, because a formation holding nothing but a lambda carries no
# attribute, and the body of this formation dispatches `plus` off its input.
# `app` hands `gap` two numbers, so the engine says that `a` and `b` hold
# numbers.
eo:
  gap.eo: |
    [a b] > gap
      a.plus b > @
  app.eo: |
    [] > app
      gap 1 2 > used
xmir:
  - "//o[@name='e1']/o[@as='a' and @base='Φ.number']\
    /o[@as='φ' and @base='Φ.bytes']/o[@as='φ']/o[@name='λ' and text()='𝜎1']"
voids:
  - "𝜎1\t1\ta\tnumber"
