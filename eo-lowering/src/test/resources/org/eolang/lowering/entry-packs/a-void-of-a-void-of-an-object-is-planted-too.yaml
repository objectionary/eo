---
# An object planted in a void is planted over its own voids by the same rules,
# as deep as the types go, so a void of a void of an object gets its symbol
# too, and the table of voids says the whole path to it.
eo:
  uses.eo: |
    [p] > uses
      p.q.n > @
provides: |
  <provides>
    <type id="Φ.uses">
      <attr name="p" type="Φ.uses.p" void="true" holds="Φ.outer"/>
    </type>
    <type id="Φ.outer">
      <attr name="q" type="Φ.outer.q" void="true" holds="Φ.inner"/>
    </type>
    <type id="Φ.inner">
      <attr name="n" type="Φ.inner.n" void="true" holds="Φ.number"/>
    </type>
  </provides>
links: |
  <links>
    <type id="Φ.uses.φ">
      <ref loc="Φ.number"/>
    </type>
  </links>
xmir:
  - "//o[@name='e1']/o[@as='v']/o[@as='p' and @base='Φ.outer']\
    /o[@as='q' and @base='Φ.inner']/o[@as='n' and @base='Φ.number']\
    /o[@as='φ']/o[@as='φ']/o[@name='λ' and text()='𝜎1']"
voids:
  - "𝜎1\t1\tp.q.n\tnumber"
