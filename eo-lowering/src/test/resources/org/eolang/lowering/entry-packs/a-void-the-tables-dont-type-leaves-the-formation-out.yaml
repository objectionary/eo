---
# A void the tables say nothing about cannot be planted with nothing in it.
# The calculus cuts a branch that reaches the bottom there and keeps only the
# condition under which the run would end, so the atom would lose that branch,
# the way `bytes.as-i64` once lost its `cant-convert`. The formation gets no
# entry and stays in EO as its author wrote it.
eo:
  gap.eo: |
    [a b] > gap
      a.plus b > @
provides: |
  <provides>
    <type id="Φ.gap">
      <attr name="a" type="Φ.gap.a" void="true" holds="Φ.number"/>
      <attr name="b" type="Φ.gap.b" void="true"/>
    </type>
  </provides>
xmir:
  - "/object/o[@name='l/'][not(o[starts-with(@name, 'e')])]"
