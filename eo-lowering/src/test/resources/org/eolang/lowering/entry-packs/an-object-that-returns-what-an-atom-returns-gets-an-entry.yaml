---
# When the body of an object is an atom, the object returns what the atom
# returns, and "atoms.xml" tells what that is.
eo:
  sum.eo: |
    [m n] > sum
      m.plus n > @
links: |
  <links>
    <type id="Φ.sum.φ">
      <ref loc="Φ.number.plus"/>
    </type>
  </links>
atoms: |
  <atoms>
    <atom forma="Φ.number" loc="Φ.number.plus"/>
  </atoms>
entries:
  - "1\tΦ.sum"
