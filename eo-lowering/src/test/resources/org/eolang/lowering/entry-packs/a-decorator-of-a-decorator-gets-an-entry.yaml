# The body of `answer` is a formation with a body of its own, so both are
# formations the calculus can be asked about, and each gets an entry, the
# outer one first.
eo:
  answer.eo: |
    [] > answer
      [] > @
        42 > @
entries:
  - "1\tΦ.answer"
  - "2\tΦ.answer.φ"
