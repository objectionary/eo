---
# yamllint disable rule:line-length
# A void that holds `true` or `false`, a union of the two, holds a bool
# either way, so it is planted around a fork as a bool void is. The
# tables are written here by hand, since only an atom gives its voids a
# type, and an atom gets no entry.
eo:
  both.eo: |
    [a] > both
      a.and a > @
facts: |
  <?xml version="1.0" encoding="UTF-8"?>
  <facts>
     <objects>
        <type bare="true" complete="false" id="Φ.both">
           <attr holds="Φ.true|Φ.false" name="v🌵a" type="Φ.both.v🌵a" void="true"/>
           <attr name="φ" type="Φ.both.φ"/>
        </type>
     </objects>
  </facts>
answers: |
  <?xml version="1.0" encoding="UTF-8"?>
  <answers>
    <o loc="Φ.both.φ" copies="1">
      <is loc="Φ.bool"/>
    </o>
  </answers>
xmir:
  - "//o[@as='v🌵a' and @base='Φ.bool']/o[@as='v🌵fork']\
    /o[@name='λ' and text()='L_fork']"
voids:
  - "𝜎1\t1\tv🌵a\tbool"
