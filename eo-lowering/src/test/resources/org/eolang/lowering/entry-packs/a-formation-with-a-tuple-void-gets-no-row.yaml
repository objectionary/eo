---
# A formation with a tuple among its voids gets an entry but no row: a row
# dataizes every void it takes, and a tuple is three attributes that no one
# dataization carries.
# `app` hands `count` a tuple, so the engine says that `t` holds one and that
# the body is a number.
eo:
  count.eo: |
    [t] > count
      t.length > @
  tuple.eo: |
    [tail head length] > tuple
  app.eo: |
    [] > app
      count (tuple (tuple 0 0 0) 1 1) > used
xmir:
  - "//o[@name='e1' and @base='Φ.count'][not(o[@name='φ'])]"
copies:
  - "//o[@loc='Φ.count'][not(o[@name='λ'])]/o[@name='φ']"
