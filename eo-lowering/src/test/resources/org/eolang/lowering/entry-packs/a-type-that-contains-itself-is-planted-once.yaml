---
# A type with a void of its own type is planted once on the way down, and
# that void is left unfilled, so the plan stays finite.
eo:
  uses.eo: |
    [p] > uses
      p.v > @
provides: |
  <provides>
    <type id="Φ.uses">
      <attr name="p" type="Φ.uses.p" void="true" holds="Φ.node"/>
    </type>
    <type id="Φ.node">
      <attr name="v" type="Φ.node.v" void="true" holds="Φ.number"/>
      <attr name="next" type="Φ.node.next" void="true" holds="Φ.node"/>
    </type>
  </provides>
links: |
  <links>
    <type id="Φ.uses.φ">
      <ref loc="Φ.number"/>
    </type>
  </links>
xmir:
  - "//o[@name='e1']/o[@as='v']/o[@as='p' and @base='Φ.node']\
    /o[@as='v' and @base='Φ.number']"
  - "//o[@as='p'][not(o[@as='next'])]"
voids:
  - "𝜎1\t1\tp.v\tnumber"
