---
# A tuple is three voids, and each of them is worth a symbol of its own: the
# count is a number, the last item is whatever the tuple holds, and the prior
# part is another tuple. The planting binds them by their hidden names, while
# the symbols are reached through `length`, `head` and `tail`, the attributes
# that give those voids. A renderer that knew only that "this is a tuple"
# could say nothing in Java about what is inside it.
# `app` hands `first` a tuple, so the engine says that `t` holds one.
eo:
  first.eo: |
    [t] > first
      t.head > @
  tuple.eo: |
    [prior last count] > tuple
      last > head
      count > length
      prior > tail
  app.eo: |
    [] > app
      first (tuple (tuple 0 0 0) 2 1) > used
xmir:
  - "//o[@as='v🌵t' and @base='Φ.tuple']/o[@as='v🌵count' and @base='Φ.number']\
    /o[@as='φ']/o[@as='φ']/o[@name='λ' and text()='𝜎1']"
  - "//o[@as='v🌵t' and @base='Φ.tuple']/o[@as='v🌵last']\
    /o[@name='λ' and text()='𝜎2']"
  - "//o[@as='v🌵t' and @base='Φ.tuple']/o[@as='v🌵prior']\
    /o[@name='λ' and text()='𝜎3']"
voids:
  - "𝜎1\t1\tv🌵t.length\tnumber"
  - "𝜎2\t1\tv🌵t.head\tobject"
  - "𝜎3\t1\tv🌵t.tail\ttuple"
