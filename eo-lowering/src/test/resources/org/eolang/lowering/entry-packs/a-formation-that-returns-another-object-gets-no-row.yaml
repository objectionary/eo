---
# A formation whose body the tables say is anything but a number, a
# string, a bool or bytes gets an entry but no row: a row answers a fresh
# symbol wrapped as data, and the body of this one gives back an object
# with attributes of its own, a `pair`. The copy keeps its `φ` and gets no
# λ, and the entry applies the formation as it is. `app` hands `twin` a
# number, so the engine says that `x` holds one.
eo:
  twin.eo: |
    [x] > twin
      pair x x > @
  pair.eo: |
    [a b] > pair
  app.eo: |
    [] > app
      twin 7 > used
xmir:
  - "//o[@name='e1' and @base='Φ.twin'][not(o[@name='φ'])]"
copies:
  - "//o[@loc='Φ.twin'][not(o[@name='λ'])]/o[@name='φ']"
entries:
  - "1\tΦ.twin"
