---
# The entries and the symbols are numbered across the whole world and not
# within a file, because by the time the calculus sees them the files are one
# document. So the second file carries on from where the first one stopped, and
# the order of the files is fixed by whoever hands them over.
# `app` hands `one` and `two` a number each, so the engine says that `a` and
# `c` hold numbers, and it gets no entry itself, having no body.
eo:
  one.eo: |
    [a] > one
      a.plus 1 > @
  two.eo: |
    [c] > two
      c.plus 3 > @
  app.eo: |
    [] > app
      one 1 > first
      two 2 > second
xmir:
  - "//o[@name='e1' and @base='Φ.one']/o[@as='a']/\
    /o[@name='λ' and text()='𝜎1']"
  - "//o[@name='e2' and @base='Φ.two']/o[@as='c']/\
    /o[@name='λ' and text()='𝜎2']"
entries:
  - "1\tΦ.one"
  - "2\tΦ.two"
voids:
  - "𝜎1\t1\ta\tnumber"
  - "𝜎2\t2\tc\tnumber"
