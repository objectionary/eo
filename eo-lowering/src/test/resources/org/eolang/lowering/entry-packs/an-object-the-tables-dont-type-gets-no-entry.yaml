---
# When eo:inference says nothing about the body of an object, nobody knows
# what that body is, and the object stays in EO.
eo:
  vague.eo: |
    [k] > vague
      k.plus 7 > @
xmir:
  - "/object/o[@name='l/'][not(o[starts-with(@name, 'e')])]"
