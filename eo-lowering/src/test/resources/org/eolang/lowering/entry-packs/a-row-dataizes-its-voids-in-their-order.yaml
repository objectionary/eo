---
# A row dataizes every void of its formation, in the order they are
# declared, so that the operands of the symbol it mints stand in that
# order too, and the rendering binds each of them to the void it fills. A
# formation with no `ρ` is reached by its path alone, and a body the
# tables say is bytes answers bytes around the fresh symbol.
eo:
  glued.eo: |
    [a b] > glued
      a.as-bytes.concat b > @
provides: |
  <provides>
    <type id="Φ.glued" reduced="Φ.bytes">
      <attr name="a" type="Φ.glued.a" void="true" holds="Φ.string"/>
      <attr name="b" type="Φ.glued.b" void="true" holds="Φ.bytes"/>
      <attr name="φ" type="Φ.glued.φ"/>
    </type>
  </provides>
xmir:
  - "//o[@name='e1']/o[@name='φ' and @base='.body🌵']/o[@base='Φ.glued']\
    /o[@as='a' and @base='Φ.string']"
rows:
  - "L_glued\tΦ.glued\tΦ.glued\ta:string\tb:bytes"
table:
  - "- λ: L_glued"
  - "    𝛿1: $.a"
  - "    𝛿2: $.b"
  - "  𝑛: Φ.bytes( φ ↦ ⟦ λ ⤍ 𝜎 ⟧ )"
