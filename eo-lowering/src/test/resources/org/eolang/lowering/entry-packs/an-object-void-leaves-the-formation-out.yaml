---
# A void the tables type as an object other than a number, a string, a bool,
# bytes or a tuple leaves the formation out. Planting it as the formation the
# tables name would fold the attributes of that formation into the atom,
# whatever object a caller passes, so the formation gets no entry and stays in
# EO as its author wrote it.
eo:
  uses.eo: |
    [p] > uses
      p.fmt > @
provides: |
  <provides>
    <type id="Φ.uses">
      <attr name="p" type="Φ.uses.p" void="true" holds="Φ.string.printf"/>
    </type>
    <type id="Φ.string.printf">
      <attr name="fmt" type="Φ.string.printf.fmt" void="true" holds="Φ.string"/>
    </type>
  </provides>
xmir:
  - "/object/o[@name='l🌵'][not(o[starts-with(@name, 'e')])]"
