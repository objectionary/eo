---
# A void the tables say holds an object other than a number, a string, a bool,
# bytes or a tuple leaves the formation out. Planting it as the formation the
# tables name would fold the attributes of that formation into the atom,
# whatever object a caller passes, so the formation gets no entry and stays in
# EO as its author wrote it. `app` hands `uses` a `printf`, so the engine says
# that `p` holds one.
eo:
  uses.eo: |
    [p] > uses
      p.fmt > @
  printf.eo: |
    [fmt] > printf
  app.eo: |
    [] > app
      uses (printf "%d") > used
xmir:
  - "/object/o[@name='l🌵'][not(o[starts-with(@name, 'e')])]"
