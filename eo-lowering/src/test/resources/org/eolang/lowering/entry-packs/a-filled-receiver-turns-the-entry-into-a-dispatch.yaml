---
# The `ρ` a formation declares is a void like the others, which holds the
# formation it is written in, here the package `number`, but XMIR has no `as`
# of `ρ`. So a formation whose `ρ` is filled is written as a dispatch off the
# planted object, which binds the same thing the way the calculus itself
# does. `app` hands `twice` a number, so the engine says that `x` holds one.
eo:
  twice.eo: |
    +package number

    [^ x] > twice
      ^.plus x > @
  app.eo: |
    [] > app
      5.twice 3 > used
xmir:
  - "//o[@name='e1' and @base='.twice']"
  - "//o[@name='e1']/o[1][@base='Φ.number' and not(@as)]/\
    /o[@name='λ' and text()='𝜎1']"
voids:
  - "𝜎1\t1\tρ\tnumber"
entries:
  - "1\tΦ.number.twice"
