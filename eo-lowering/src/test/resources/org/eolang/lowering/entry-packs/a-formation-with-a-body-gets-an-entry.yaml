# A formation with a body is a computation the calculus can be asked about, so
# it gets an entry: the formation applied to a symbol for each of its voids,
# under the number the whole build knows it by, which phino dataizes as it
# is. This one has no voids, so the entry is the formation alone.
eo:
  three.eo: |
    [] > three
      1.plus 2 > @
xmir:
  - "/object/o[@name='l🌵'][not(o[@name='mark'])]"
  - "/object/o[@name='l🌵']/o[@name='e1' and @base='Φ.three'][not(o)]"
entries:
  - "1\tΦ.three"
