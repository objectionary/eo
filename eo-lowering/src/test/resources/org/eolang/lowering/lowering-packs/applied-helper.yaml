---
# yamllint disable rule:line-length
# A private formation applied twice in the body is entered as a box: the
# atom applies it through PhApplication and adds the answers. Each nested
# formation is lowered on its own into an atom over the formation it
# applies and the values it reads.
input: |
  [] > foo
    [x] > bump
      [^ i] >> scaled
        [^ k] >> shifted
          k.plus ^.^.x > @
        shifted (^.x.times i) > @
      (scaled 2).plus (scaled 3) > @
    bump 5 > @
prelude:
  number.eo: |
    [@] > number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
      [] > times /Q.number
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
lowered: |
  [] > foo
    bump 5 > @
    [x] > bump
      l🌵9a0bafa89fae > @
        [^ i] >>
          l🌵707e027b92b1 > @
            [^ k] >>
              l🌵3eeff0d5c6c9 k ^.^.x > @
              [] > l🌵3eeff0d5c6c9 /Q.number
                ? > v0 /Q.number
                ? > v1 /Q.number
            ^.x
            i
          [] > l🌵707e027b92b1 /Q.number
            ? > v0
            ? > v1 /Q.number
            ? > v2 /Q.number
      [] > l🌵9a0bafa89fae /Q.number
        ? > v0
java: |
  final double s2 = new Dataized(new PhApplication(this.take("v0"), new Bind("i", new Data.ToPhi(Double.longBitsToDouble(0x4000000000000000L))))).asNumber();
  final double s5 = new Dataized(new PhApplication(this.take("v0"), new Bind("i", new Data.ToPhi(Double.longBitsToDouble(0x4008000000000000L))))).asNumber();
  final double s6 = s2 + s5;
  return new Data.ToPhi(s6);
