---
# An if on a bool void lowers into a Java branch: each arm is computed
# inside its own branch and the answer is assigned once.
input: |
  [] > foo
    [flag x] > pick
      if. > @
        flag
        x.plus 1
        x.times 2
    pick true 5 > @
prelude:
  number.eo: |
    [@] > number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
      [] > times /Q.number
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
  bool.eo: |
    [if] > bool
      if > @
        FF-
        00-
  true.eo: |
    [^] > true
      bool > @
        [^]
          ? >> left
          ? >> right
          left > @
lowered: |
  [] > foo
    pick > @
      true
      5
    [] > pick /Q.number
      ? > flag /Q.bool
      ? > x /Q.number
java: |
  final boolean v0 = new Dataized(this.take("flag")).asBool();
  final double v1 = new Dataized(this.take("x")).asNumber();
  final double s6;
  if (v0) {
      final double s4 = v1 + Double.longBitsToDouble(0x3FF0000000000000L);
      s6 = s4;
  } else {
      final double s5 = v1 * Double.longBitsToDouble(0x4000000000000000L);
      s6 = s5;
  }
  return new Data.ToPhi(s6);
