---
# A string void is bytes to the engine: its size is the length of the
# bytes and the comparison on it answers a bool.
input: |
  [] > foo
    [t] > wide
      t.size.gt 3 > @
    wide "hello" > @
prelude:
  number.eo: |
    [@] > number
      [] > gt /Q.bool
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
      [] > size /Q.number
        ? > ^
  string.eo: |
    [@] > string
  bool.eo: |
    [if] > bool
      if > @
        FF-
        00-
lowered: |
  [] > foo
    wide "hello" > @
    [] > wide /Q.bool
      ? > t /Q.string
java: |
  final byte[] v0 = new Dataized(this.take("t")).take();
  final double s2 = v0.length;
  final boolean s3 = s2 > Double.longBitsToDouble(0x4008000000000000L);
  return new Data.ToPhi(s3);
