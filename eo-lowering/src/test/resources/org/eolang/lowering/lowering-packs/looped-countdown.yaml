---
# yamllint disable rule:line-length
# Tail recursion with an accumulator lowers into an atom that enters the
# formation again through PhApplication; the accumulator arm witnesses
# the carrier of the recursive answer.
input: |
  [] > foo
    [^ n acc] > down
      if. > @
        n.eq 0
        acc
        ^.down
          n.plus -1
          acc.times n
    down 5 1 > @
prelude:
  number.eo: |
    [@] > number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
      [] > times /Q.number
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
      [] > eq /Q.bool
        ? > ^
        ? > b
  bool.eo: |
    [if] > bool
      if > @
        FF-
        00-
lowered: |
  [] > foo
    down > @
      5
      1
    [^ n acc] > down
      l🌵92bbd44b5add > @
        n
        acc
        ^.down
      [] > l🌵92bbd44b5add /Q.number
        ? > v0 /Q.number
        ? > v1 /Q.number
        ? > v2
java: |
  final double v0 = new Dataized(this.take("v0")).asNumber();
  final double v1 = new Dataized(this.take("v1")).asNumber();
  final boolean s3 = v0 == Double.longBitsToDouble(0x0000000000000000L);
  final double s13;
  if (s3) {
      s13 = v1;
  } else {
      final double s5 = v0 + Double.longBitsToDouble(0xBFF0000000000000L);
      final double s6 = v1 * v0;
      final double s12 = new Dataized(new PhApplication(this.take("v2"), new Bind("n", new Data.ToPhi(s5)), new Bind("acc", new Data.ToPhi(s6)))).asNumber();
      s13 = s12;
  }
  return new Data.ToPhi(s13);
