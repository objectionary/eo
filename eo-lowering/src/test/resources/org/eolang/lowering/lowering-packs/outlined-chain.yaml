---
# Two public bindings of one formation lower into two sibling atoms, one
# per binding, each called at its site.
input: |
  [] > foo
    [x] > calc
      x.plus 1 > incr
      (x.times x).plus 2 > @
    calc 5 > @
prelude:
  number.eo: |
    [@] > number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
      [] > times /Q.number
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
lowered: |
  [] > foo
    calc 5 > @
    [x] > calc
      l🌵9523a3863bfb x > @
      l🌵4049d975e7b9 x > incr
      [] > l🌵4049d975e7b9 /Q.number
        ? > v0 /Q.number
      [] > l🌵9523a3863bfb /Q.number
        ? > v0 /Q.number
java: |
  final double v0 = new Dataized(this.take("v0")).asNumber();
  final double s3 = v0 * v0;
  final double s4 = s3 + Double.longBitsToDouble(0x4000000000000000L);
  return new Data.ToPhi(s4);
