---
# Equality of two number voids goes through bytes, as in the runtime,
# and lowers into a comparison of doubles.
input: |
  [] > foo
    [x y] > same
      x.eq y > @
    same 2 3 > @
prelude:
  number.eo: |
    [@] > number
  bytes.eo: |
    [@] > bytes
      [] > eq /Q.bool
        ? > ^
        ? > b
  bool.eo: |
    [if] > bool
      if > @
        FF-
        00-
lowered: |
  [] > foo
    same > @
      2
      3
    [] > same /Q.bool
      ? > x /Q.number
      ? > y /Q.number
java: |
  final double v0 = new Dataized(this.take("x")).asNumber();
  final double v1 = new Dataized(this.take("y")).asNumber();
  final boolean s4 = v0 == v1;
  return new Data.ToPhi(s4);
