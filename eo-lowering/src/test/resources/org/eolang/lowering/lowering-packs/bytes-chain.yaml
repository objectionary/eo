---
# yamllint disable rule:line-length
# A chain of bytes operations ending in a comparison lowers whole into
# an atom over a bytes void that answers a bool.
input: |
  [] > foo
    [b] > wide
      (b.and 1F-).size.gt 2 > @
    wide 2A-2B > @
prelude:
  number.eo: |
    [@] > number
      [] > gt /Q.bool
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
      [] > and /Q.bytes
        ? > ^
        ? > b /Q.bytes
      [] > size /Q.number
        ? > ^
  bool.eo: |
    [if] > bool
      if > @
        FF-
        00-
lowered: |
  [] > foo
    wide 2A-2B > @
    [] > wide /Q.bool
      ? > b /Q.bytes
java: |
  final byte[] v0 = new Dataized(this.take("b")).take();
  final byte[] s2 = new BytesOf(v0).and(new BytesOf(new byte[] {(byte) 0x1F})).take();
  final double s3 = s2.length;
  final boolean s4 = s3 > Double.longBitsToDouble(0x4000000000000000L);
  return new Data.ToPhi(s4);
