---
# An argument made of literals only is folded by phino before the engine
# sees it, so the atom adds the folded constant.
input: |
  [] > foo
    [x] > calc
      x.plus (2.times 3) > @
    calc 5 > @
prelude:
  number.eo: |
    [@] > number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
      [] > times /Q.number
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
lowered: |
  [] > foo
    calc 5 > @
    [] > calc /Q.number
      ? > x /Q.number
java: |
  final double v0 = new Dataized(this.take("x")).asNumber();
  final double s2 = v0 + Double.longBitsToDouble(0x4018000000000000L);
  return new Data.ToPhi(s2);
