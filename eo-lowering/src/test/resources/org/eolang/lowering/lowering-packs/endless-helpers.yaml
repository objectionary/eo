---
# Two private formations calling each other without a base case never
# reduce: the body comes back as the bare answer of the box of the first
# helper, an object no atom can hand over as data, so the formation
# stays as written.
input: |
  [] > foo
    [x] > bounce
      [^ i] >> ping
        pong (i.plus 1) > @
      [^ j] >> pong
        ping (j.times 2) > @
      ping x > @
    bounce 5 > @
prelude:
  number.eo: |
    [@] > number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
      [] > times /Q.number
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
lowered: |
  [] > foo
    bounce 5 > @
    [x] > bounce
      ping x > @
      pong > [^ i] >> ping
        i.plus 1
      ping > [^ j] >> pong
        j.times 2
