---
# A comparison comes back with one of the two constants of `bool`, and the
# tables say so by naming that very constant. Both of them, and `Φ.bool`
# itself, are the same carrier here, because Java has one boolean and knows
# nothing of which of the two objects the answer was.
eo:
  same.eo: |
    [a b] > same
      a.eq b > @
provides: |
  <provides>
    <type id="Φ.same" reduced="Φ.true"/>
  </provides>
xmir:
  same.xmir:
    - "/object/o[@name='same']/o[@name='λ' and text()='L_box_1_bool']"
