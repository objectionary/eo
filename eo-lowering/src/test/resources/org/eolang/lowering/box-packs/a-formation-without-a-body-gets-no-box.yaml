---
# A formation with no `φ` at all is a bag of attributes, the shape a package
# object has after the merge. Evaluating it gives back the formation itself,
# so a box would stand in front of nothing.
eo:
  holder.eo: |
    [] > holder
      42 > kid
xmir:
  holder.xmir:
    - "/object/o[@name='holder' and not(o[@name='φ'])]"
    - "/object[not(//o[@name='λ'])]"
