---
# A formation with a body is a computation the calculus can be asked about, so
# it gets a box: one `λ` element whose name carries the number of the formation
# and the kind of data the formation comes back with. The tables here know
# nothing about this object, and what nobody wrote down is an `object`, since a
# narrower carrier on a guess is a lie the rest of the pipeline stands on.
eo:
  gap.eo: |
    [a b] > gap
      a.plus b > @
xmir:
  gap.xmir:
    - "/object/o[@name='gap']/o[@name='λ' and text()='L_box_1_object']"
