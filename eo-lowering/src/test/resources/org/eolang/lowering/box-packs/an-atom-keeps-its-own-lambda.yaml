---
# An atom already asks the outside world to do its work, and the `λ` it was
# written with is the only thing that says what that work is. A box on top of
# it would shadow that name and the build would lose it, so an atom is left
# exactly as the parser wrote it.
eo:
  plus.eo: |
    [] > plus /Q.number
      ? > ^
      ? > x
xmir:
  plus.xmir:
    - "/object/o[@name='plus']/o[@name='λ' and @atom='Φ.number']"
    - "/object[not(//o[@name='λ'][starts-with(text(), 'L_box_')])]"
