---
# A unit test is an attribute of the object it is written in, and a test with a
# body is a formation like any other. An object and what is said about it are
# one document in this compiler, so the tests go into the world with everything
# else and are boxed by the same rule.
eo:
  foo.eo: |
    [] > foo
      42 > @

      ++> can-be-one
        1.eq 1 > @
xmir:
  foo.xmir:
    - "/object/o[@name='foo']/o[@name='λ' and text()='L_box_1_object']"
    - "//o[@name='p🌵can-be-one']/o[@name='λ' and text()='L_box_2_object']"
