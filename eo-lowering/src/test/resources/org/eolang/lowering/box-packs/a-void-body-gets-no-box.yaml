---
# A formation whose `φ` is void holds no computation of its own: what it comes
# back with is whatever a caller puts into that void. There is nothing to ask
# the calculus about, so there is nothing to box.
eo:
  holder.eo: |
    [@] > holder
      42 > kid
xmir:
  holder.xmir:
    - "/object/o[@name='holder']/o[@name='φ' and @base='∅']"
    - "/object[not(//o[@name='λ'])]"
