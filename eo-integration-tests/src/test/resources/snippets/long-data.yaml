---
# yamllint disable rule:line-length
out:
  - ".*10000 bytes.*"
file: snippets/long-data.eo
args: ["snippets.long-data"]
eo: |
  +package snippets

  [] > long-data
    "\"\\\nй" > text
    stdout > @
      "%d bytes\n".printf
        *
          text.size
