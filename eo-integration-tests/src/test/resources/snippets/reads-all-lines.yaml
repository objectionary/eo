---
# yamllint disable rule:line-length
out:
  - ".*one\ntwo\nthree.*"
file: snippets/reads-all-lines.eo
args: ["snippets.reads-all-lines"]
stdin: |
  one
  two
  three
eo: |
  +package snippets

  [] > reads-all-lines
    stdout > @
      stdin.all-lines
