---
# yamllint disable rule:line-length
out:
  - ".*Hello, Jeff!.*"
file: snippets/printf-string.eo
args: ["snippets.printf-string"]
eo: |
  +package snippets

  [] > printf-string
    stdout > @
      "Hello, %s!\n".printf
        * "Jeff"
