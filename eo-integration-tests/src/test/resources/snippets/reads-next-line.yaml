---
out:
  - '.*<первая>.*'
file: snippets/reads-next-line.eo
args: ["snippets.reads-next-line"]
stdin: |
  первая
  вторая
  третья
eo: |
  +package snippets

  [] > reads-next-line
    stdout > @
      "<".concat
        stdin.next-line.concat ">"
