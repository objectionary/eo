# yamllint disable rule:line-length
# An atom's own return signature (`/Q.chunk`) must be probed too, the same
# way a void's callback arg-types annotation (`/{Q.chunk}`) already is
# (#6174). See #6212.
probes:
  - 'chunk'
eo: |
  +package custom
  +version 0.0.0

  [] > foo /Q.chunk
