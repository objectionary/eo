---
# yamllint disable rule:line-length
# A type may be a union of two, split by a bar, and both sides must be
# probed, in the return of an atom, in the own type of a void, with or
# without the trailing question mark, and in a member of a callback list.
probes:
  - 'true'
  - 'false'
  - 'number'
  - 'string'
  - 'chunk'
  - 'bytes'
eo: |
  +package custom
  +version 0.0.0

  [] > foo /Q.true|Q.false
    ? > size /Q.number|Q.string?
    ? > scope /{Q.chunk(Q.number)|Q.bytes}
