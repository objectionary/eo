# D
input: |
  [] > foo
    [m] > probe
      m.and 0F-0F-0F-0F-0F-0F-0F-0F >> masked!
      masked.eq 00-00-00-00-00-00-00-00 > @
    probe 43-30-00-00-00-00-00-00 > @
prelude:
  bytes.eo: |
    [@] > bytes
      [] > and /Q.bytes
        ? > ^
        ? > b /Q.bytes
      [] > eq /Q.bool
        ? > ^
        ? > b
  bool.eo: |
    [if] > bool
      if > @
        FF-
        00-
  dataized.eo: |
    [] > dataized /Q.bytes
      ? > target
lowered: |
  [] > foo
    [m] > probe
      m.and 0F-0F-0F-0F-0F-0F-0F-0F >> masked!
      masked.eq 00-00-00-00-00-00-00-00 > @
    probe 43-30-00-00-00-00-00-00 > @
