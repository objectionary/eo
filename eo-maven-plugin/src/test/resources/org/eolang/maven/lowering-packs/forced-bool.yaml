---
# D
input: |
  [] > foo
    [x] > raw
      x.gt 1 >> flag!
      flag > @
    raw 2 > @
prelude:
  number.eo: |
    [@] > number
      [] > gt /Q.bool
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
  bool.eo: |
    [if] > bool
      if > @
        FF-
        00-
  dataized.eo: |
    [] > dataized /Q.bytes
      ? > target
lowered: |
  [] > foo
    [x] > raw
      x.gt 1 >> flag!
      flag > @
    raw 2 > @
