---
# A void of the outer object is applied to the inner one without a
# literal in sight, so nothing witnesses its forma and the formation
# stays as written.
input: |
  [q] > foo
    [x] > bump
      x.plus 2 > @
    bump q > @
prelude:
  number.eo: |
    [@] > number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
      [] > times /Q.number
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
lowered: |
  [q] > foo
    bump q > @
    x.plus 2 > [x] > bump
