---
# A comparison on a number void lowers whole into an atom that answers a
# bool.
input: |
  [] > foo
    [x] > check
      x.gt 3 > @
    check 7 > @
prelude:
  number.eo: |
    [@] > number
      [] > gt /Q.bool
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
  bool.eo: |
    [if] > bool
      if > @
        FF-
        00-
lowered: |
  [] > foo
    check 7 > @
    [] > check /Q.bool
      ? > x /Q.number
java: |
  final double v0 = new Dataized(this.take("x")).asNumber();
  final boolean s2 = v0 > Double.longBitsToDouble(0x4008000000000000L);
  return new Data.ToPhi(s2);
