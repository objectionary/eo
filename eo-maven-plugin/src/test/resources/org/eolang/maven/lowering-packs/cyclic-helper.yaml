---
# A helper that reads itself never reduces, so the formation stays as
# written.
input: |
  [] > foo
    [x] > spin
      more.plus x >> more
      more.times 2 > @
    spin 5 > @
prelude:
  number.eo: |
    [@] > number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
      [] > times /Q.number
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
lowered: |
  [] > foo
    spin 5 > @
    [x] > spin
      times. > @
        v3_4.plus x >> more
        2
