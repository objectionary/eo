---
# A body that raises an error reaches the terminator, so the formation
# stays as written.
input: |
  [] > foo
    [x] > boom
      T "boom" > @
    boom 5 > @
prelude:
  number.eo: |
    [@] > number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
      [] > times /Q.number
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
lowered: |
  [] > foo
    boom 5 > @
    T "boom" > [x] > boom
