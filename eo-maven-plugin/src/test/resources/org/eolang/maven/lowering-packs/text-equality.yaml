---
# Equality of a string void with a string literal lowers into a
# comparison of byte arrays.
input: |
  [] > foo
    [t] > greets
      t.eq "h" > @
    greets "h" > @
prelude:
  bytes.eo: |
    [@] > bytes
      [] > eq /Q.bool
        ? > ^
        ? > b
  string.eo: |
    [@] > string
  bool.eo: |
    [if] > bool
      if > @
        FF-
        00-
lowered: |
  [] > foo
    greets "h" > @
    [] > greets /Q.bool
      ? > t /Q.string
java: |
  final byte[] v0 = new Dataized(this.take("t")).take();
  final boolean s2 = java.util.Arrays.equals(v0, new byte[] {(byte) 0x68});
  return new Data.ToPhi(s2);
