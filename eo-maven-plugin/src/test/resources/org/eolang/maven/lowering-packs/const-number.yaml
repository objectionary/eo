---
# D
input: |
  [] > foo
    [x] > same
      x.times x >> square!
      square.eq (x.plus x) > @
    same 2 > @
prelude:
  number.eo: |
    [@] > number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
      [] > times /Q.number
        ? > ^
        ? > x /Q.number
      [] > eq /Q.bool
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
  bool.eo: |
    [if] > bool
      if > @
        FF-
        00-
  dataized.eo: |
    [] > dataized /Q.bytes
      ? > target
lowered: |
  [] > foo
    [x] > same
      x.times x >> square!
      square.eq (x.plus x) > @
    same 2 > @
