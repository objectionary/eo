---
# A private helper read twice by the body is folded into it, so the
# formation lowers whole and the helper disappears.
input: |
  [] > foo
    [x] > bump
      x.times x >> square
      square.plus square > @
    bump 5 > @
prelude:
  number.eo: |
    [@] > number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
      [] > times /Q.number
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
lowered: |
  [] > foo
    bump 5 > @
    [] > bump /Q.number
      ? > x /Q.number
java: |
  final double v0 = new Dataized(this.take("x")).asNumber();
  final double s3 = v0 * v0;
  final double s4 = s3 + s3;
  return new Data.ToPhi(s4);
