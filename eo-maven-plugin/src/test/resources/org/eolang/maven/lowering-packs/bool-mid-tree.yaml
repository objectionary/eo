# D
input: |
  [] > foo
    [n] > cool
      eq. > @
        n.gt 10
        false
    cool 42 > @
prelude:
  number.eo: |
    [@] > number
      [] > gt /Q.bool
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
      [] > eq /Q.bool
        ? > ^
        ? > b
  bool.eo: |
    [if] > bool
      if > @
        FF-
        00-
  false.eo: |
    [^] > false
      bool > @
        [^]
          ? >> left
          ? >> right
          right > @
lowered: |
  [] > foo
    [n] > cool
      eq. > @
        n.gt 10
        false
    cool 42 > @
