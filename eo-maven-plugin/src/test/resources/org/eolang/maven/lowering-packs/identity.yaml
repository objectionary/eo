---
# A formation that answers its void as is stays as written: its φ
# reduces to the number formation the void stands for, with the marker
# of the void as its own φ, and there is no computation in it for an
# atom to carry. The printer spells the body as the identity.
input: |
  [] > foo
    [x] > same
      x > @
    same 5 > @
prelude:
  number.eo: |
    [@] > number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
      [] > times /Q.number
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
lowered: |
  [] > foo
    same 5 > @
    I > same
