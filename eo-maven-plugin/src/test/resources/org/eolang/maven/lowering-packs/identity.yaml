---
# A fragment answering its own void needs no computation: the protocol
# has no steps, and the printer spells the formation with the identity
# glyph.
input: |
  [x] > foo
    x > @
voids:
  x: number
lowered: |
  I > foo
protocol: |
  answer sym:v0 number
