---
# The length of a tuple void is not an operation the engine computes, so
# the atom dispatches length on the tuple at run time and adds to what
# it answers; the tuple void stays untyped.
input: |
  [] > foo
    [items] > count
      items.length.plus 1 > @
    count (* 7 8 9) > @
prelude:
  number.eo: |
    [@] > number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
  tuple.eo: |
    [tail head length] > tuple
      [^ i] > at
        ^.head > @
lowered: |
  [] > foo
    count * > @
      7
      8
      9
    [] > count /Q.number
      ? > items
java: |
  final double s2 = new Dataized(new PhDispatch(this.take("items"), "length")).asNumber();
  final double s5 = s2 + Double.longBitsToDouble(0x3FF0000000000000L);
  return new Data.ToPhi(s5);
