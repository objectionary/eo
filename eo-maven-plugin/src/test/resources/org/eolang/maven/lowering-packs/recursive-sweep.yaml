---
# D
input: |
  [] > foo
    [^ h k left acc] > sweep
      if. > @
        k.gt 0
        ^.sweep
          h
          k.plus -1
          left.plus h
          plus.
            acc
            ^.panel
              h
              ^.curve left
              ^.curve
                left.plus
                  h.div 2
              ^.curve
                left.plus h
        acc
    [w a b c] > panel
      times. > @
        div.
          w
          6
        plus.
          plus.
            a
            times.
              b
              4
          c
    [t] > curve
      div. > @
        t
        plus.
          times.
            t
            t
          1
    sweep 0.25 4 0 0 > @
prelude:
  number.eo: |
    [@] > number
      [] > div /Q.number
        ? > ^
        ? > x /Q.number
      [] > gt /Q.bool
        ? > ^
        ? > x /Q.number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
      [] > times /Q.number
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
  bool.eo: |
    [if] > bool
      if > @
        FF-
        00-
