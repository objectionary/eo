---
# Formations nested at several depths lower whole one by one, each into
# an atom with typed voids, while the applications in the outer object
# stay as written.
input: |
  [] > foo
    [n g] > heron
      (g.plus (n.div g)).div 2 > @
    [] > cubic
      [t] > pow3
        (t.times t).times t > @
      [] > horner
        [a b c d t] > poly
          (((((a.times t).plus b).times t).plus c).times t).plus d > @
        [t] > sample
          (t.times t).plus (t.times 6) > @
    (heron 2 1.5).plus (cubic.horner.poly 1 2 3 4 5) > sum
    (cubic.pow3 3).plus (cubic.horner.sample 4) > rest
    sum.plus rest > @
prelude:
  number.eo: |
    [@] > number
      [] > div /Q.number
        ? > ^
        ? > x /Q.number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
      [] > times /Q.number
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
lowered: |
  [] > foo
    sum.plus rest > @
    [] > cubic
      [] > horner
        [] > poly /Q.number
          ? > a /Q.number
          ? > b /Q.number
          ? > c /Q.number
          ? > d /Q.number
          ? > t /Q.number
        [] > sample /Q.number
          ? > t /Q.number
      [] > pow3 /Q.number
        ? > t /Q.number
    [] > heron /Q.number
      ? > n /Q.number
      ? > g /Q.number
    plus. > rest
      cubic.pow3 3
      cubic.horner.sample 4
    plus. > sum
      heron
        2
        1.5
      cubic.horner.poly
        1
        2
        3
        4
        5
java: |
  final double v0 = new Dataized(this.take("g")).asNumber();
  final double v1 = new Dataized(this.take("n")).asNumber();
  final double s3 = v1 / v0;
  final double s4 = v0 + s3;
  final double s5 = s4 / Double.longBitsToDouble(0x4000000000000000L);
  return new Data.ToPhi(s5);
