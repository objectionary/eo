---
# D
input: |
  [] > foo
    [n g] > heron
      (g.plus (n.div g)).div 2 > @
    [] > cubic
      [t] > pow3
        (t.times t).times t > @
      [] > horner
        [a b c d t] > poly
          (((((a.times t).plus b).times t).plus c).times t).plus d > @
        [t] > sample
          (t.times t).plus (t.times 6) > @
    (heron 2 1.5).plus (cubic.horner.poly 1 2 3 4 5) > sum
    (cubic.pow3 3).plus (cubic.horner.sample 4) > rest
    sum.plus rest > @
prelude:
  number.eo: |
    [@] > number
      [] > div /Q.number
        ? > ^
        ? > x /Q.number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
      [] > times /Q.number
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
