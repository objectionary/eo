---
# D
input: |
  [] > foo
    [^ n acc] > down
      if. > @
        n.eq 0
        acc
        ^.down
          n.plus -1
          acc.times n
    down 5 1 > @
prelude:
  number.eo: |
    [@] > number
      [] > eq /Q.bool
        ? > ^
        ? > x /Q.number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
      [] > times /Q.number
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
  bool.eo: |
    [if] > bool
      if > @
        FF-
        00-
lowered: |
  [] > foo
    [^ n acc] > down
      if. > @
        n.eq 0
        acc
        ^.down
          n.plus -1
          acc.times n
    down 5 1 > @
