---
# An arm that raises an error reaches the terminator, so the formation
# stays as written.
input: |
  [] > foo
    [x] > guard
      if. > @
        x.gt 0
        x.plus 1
        T "the number is not positive"
    guard 5 > @
prelude:
  number.eo: |
    [@] > number
      [] > gt /Q.bool
        ? > ^
        ? > x /Q.number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
  bool.eo: |
    [if] > bool
      if > @
        FF-
        00-
lowered: |
  [] > foo
    guard 5 > @
    if. > [x] > guard
      x.gt 0
      x.plus 1
      T
        "the number is not positive"
