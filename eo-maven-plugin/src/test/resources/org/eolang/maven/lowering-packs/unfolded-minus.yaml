---
# A method that is a formation is entered as a box: the atom dispatches
# minus on the void and adds to what it answers.
input: |
  [] > foo
    [x] > calc
      (x.minus 3).plus 2 > @
    calc 5 > @
prelude:
  number.eo: |
    [@] > number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
      [] > times /Q.number
        ? > ^
        ? > x /Q.number
      [^ x] > minus
        ^.plus x.neg > @
      [^] > neg
        ^.times -1 > @
  bytes.eo: |
    [@] > bytes
lowered: |
  [] > foo
    calc 5 > @
    [] > calc /Q.number
      ? > x /Q.number
java: |
  final double s2 = new Dataized(new PhApplication(new PhDispatch(this.take("x"), "minus"), new Bind("x", new Data.ToPhi(Double.longBitsToDouble(0x4008000000000000L))))).asNumber();
  final double s3 = s2 + Double.longBitsToDouble(0x4000000000000000L);
  return new Data.ToPhi(s3);
