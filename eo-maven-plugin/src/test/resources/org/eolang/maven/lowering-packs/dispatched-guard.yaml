# D
input: |
  [] > foo
    [x] > sign
      if. > @
        x.lt 0
        -1
        1
    sign 5 > @
prelude:
  number.eo: |
    [@] > number
      [] > gt /Q.bool
        ? > ^
        ? > x /Q.number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
      [] > times /Q.number
        ? > ^
        ? > x /Q.number
      [^ x] > minus
        ^.plus x.neg > @
      [^] > neg
        ^.times -1 > @
      [^ x] > lt
        0.gt (^.minus x) > @
  bytes.eo: |
    [@] > bytes
  bool.eo: |
    [if] > bool
      if > @
        FF-
        00-
lowered: |
  [] > foo
    [x] > sign
      if. > @
        x.lt 0
        -1
        1
    sign 5 > @
