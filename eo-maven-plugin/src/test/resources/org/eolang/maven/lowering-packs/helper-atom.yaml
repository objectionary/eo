---
# A helper attribute is part of the formation's interface, and deleting
# the body would delete it too, so the formation stays as written even
# though it is pure.
input: |
  [] > foo
    [x] > bump
      x.times x > square
      square.plus 1 > @
    bump 5 > @
lowered: |
  [] > foo
    bump 5 > @
    [x] > bump
      square.plus 1 > @
      x.times x > square
