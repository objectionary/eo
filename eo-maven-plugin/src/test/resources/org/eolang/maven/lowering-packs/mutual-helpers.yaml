---
# D
input: |
  [] > foo
    [x] > bounce
      [^ n acc] >> ping
        if. > @
          n.eq 0
          acc
          pong (n.plus -1) (acc.plus 1)
      [^ n acc] >> pong
        if. > @
          n.eq 0
          acc
          ping (n.plus -1) (acc.times 2)
      ping x 1 > @
    bounce 5 > @
prelude:
  number.eo: |
    [@] > number
      [] > eq /Q.bool
        ? > ^
        ? > x /Q.number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
      [] > times /Q.number
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
  bool.eo: |
    [if] > bool
      if > @
        FF-
        00-
lowered: |
  [] > foo
    [x] > bounce
      [^ n acc] >> ping
        if. > @
          n.eq 0
          acc
          pong (n.plus -1) (acc.plus 1)
      [^ n acc] >> pong
        if. > @
          n.eq 0
          acc
          ping (n.plus -1) (acc.times 2)
      ping x 1 > @
    bounce 5 > @
