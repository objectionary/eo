---
# D
input: |
  [] > foo
    [^ n] > fact
      if. > @
        n.gt 1
        n.times
          ^.fact
            n.plus -1
        1
    fact 5 > @
prelude:
  number.eo: |
    [@] > number
      [] > gt /Q.bool
        ? > ^
        ? > x /Q.number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
      [] > times /Q.number
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
  bool.eo: |
    [if] > bool
      if > @
        FF-
        00-
lowered: |
  [] > foo
    [^ n] > fact
      if. > @
        n.gt 1
        n.times
          ^.fact
            n.plus -1
        1
    fact 5 > @
