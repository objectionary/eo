# D
input: |
  [] > foo
    [^ n] > fib
      if. > @
        n.gt 1
        plus.
          ^.fib
            n.plus -1
          ^.fib
            n.plus -2
        n
    fib 10 > @
prelude:
  number.eo: |
    [@] > number
      [] > gt /Q.bool
        ? > ^
        ? > x /Q.number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
  bool.eo: |
    [if] > bool
      if > @
        FF-
        00-
