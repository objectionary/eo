---
# yamllint disable rule:line-length
# The classic Fibonacci, iterated with two accumulators: every round
# hands `b` on as the next `a` and `a.plus b` as the next `b`, until `n`
# runs out and `a` is the answer. The repeat hands a void on to another
# void, so the rebinding goes through a temporary: `b` is saved before
# `a` takes it, and `b` itself takes the sum afterwards, the way a swap
# would need too. The formation declares `^` for the call to itself
# alone, so it is lowered whole and the `^` leaves with the body.
input: |
  [] > foo
    [^ n a b] > fib
      if. > @
        n.eq 0
        a
        ^.fib
          n.plus -1
          b
          a.plus b
    fib 10 0 1 > @
prelude:
  number.eo: |
    [as-bytes] > number
      as-bytes > @
unit: fib
voids:
  n: number
  a: number
  b: number
lowered: |
  [] > foo
    fib > @
      10
      0
      1
    [] > fib /Q.number
      ? > n /Q.number
      ? > a /Q.number
      ? > b /Q.number
protocol: |
  loop v0 v1 v2
    s1 ← L_bytes_eq sym:v0 number:00-00-00-00-00-00-00-00
    s2 ← fork sym:s1 number
      then
        answer sym:v1 number
      else
        s3 ← L_number_plus sym:v0 number:BF-F0-00-00-00-00-00-00
        s4 ← L_number_plus sym:v1 sym:v2
        repeat sym:s3 sym:v2 sym:s4
    answer sym:s2 number
java: |
  double v0 = new Dataized(this.take("n")).asNumber();
  double v1 = new Dataized(this.take("a")).asNumber();
  double v2 = new Dataized(this.take("b")).asNumber();
  final double s2;
  while (true) {
      final boolean s1 = Double.doubleToRawLongBits(v0) == Double.doubleToRawLongBits(Double.longBitsToDouble(0x0000000000000000L));
      if (s1) {
          s2 = v1;
          break;
      } else {
          final double s3 = v0 + Double.longBitsToDouble(0xBFF0000000000000L);
          final double s4 = v1 + v2;
          final double r1 = v2;
          v0 = s3;
          v1 = r1;
          v2 = s4;
          continue;
      }
  }
  return new Data.ToPhi(s2);
