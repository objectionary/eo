# D
input: |
  [] > foo
    [x] > raw
      x.plus 1 >> sum!
      sum > @
    raw 2 > @
prelude:
  number.eo: |
    [@] > number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
  dataized.eo: |
    [] > dataized /Q.bytes
      ? > target
lowered: |
  [] > foo
    [x] > raw
      x.plus 1 >> sum!
      sum > @
    raw 2 > @
