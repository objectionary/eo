# D
input: |
  [] > foo
    [x] > bump
      [^ i] >> scaled
        [^ k] >> shifted
          k.plus ^.^.x > @
        shifted (^.x.times i) > @
      (scaled 2).plus (scaled 3) > @
    bump 5 > @
prelude:
  number.eo: |
    [@] > number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
      [] > times /Q.number
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
lowered: |
  [] > foo
    [x] > bump
      [^ i] >> scaled
        [^ k] >> shifted
          k.plus ^.^.x > @
        shifted (^.x.times i) > @
      (scaled 2).plus (scaled 3) > @
    bump 5 > @
