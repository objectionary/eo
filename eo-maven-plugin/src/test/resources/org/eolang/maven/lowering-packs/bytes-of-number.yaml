---
# The bytes of a number are a view of a double, so the fragment settles
# into a key whose local is a double while the formation answers bytes.
# That is no longer a refusal: the reduction settles, and the answer
# carries the bytes. The formation stays as written all the same, since
# the protocol has no step in it and an atom of no steps is worth
# nothing over the object it would replace.
input: |
  [] > foo
    [x] > raw
      x.as-bytes > @
    raw 5 > @
prelude:
  number.eo: |
    [as-bytes] > number
      as-bytes > @
unit: raw
voids:
  x: number
lowered: |
  [] > foo
    raw 5 > @
    x.as-bytes > [x] > raw
protocol: |
  answer sym:v0 bytes
