# D
input: |
  [] > foo
    [x] > bounce
      [^ i] >> ping
        pong (i.plus 1) > @
      [^ j] >> pong
        ping (j.times 2) > @
      ping x > @
    bounce 5 > @
prelude:
  number.eo: |
    [@] > number
      [] > plus /Q.number
        ? > ^
        ? > x /Q.number
      [] > times /Q.number
        ? > ^
        ? > x /Q.number
  bytes.eo: |
    [@] > bytes
lowered: |
  [] > foo
    [x] > bounce
      [^ i] >> ping
        pong (i.plus 1) > @
      [^ j] >> pong
        ping (j.times 2) > @
      ping x > @
    bounce 5 > @
