---
# An arm of a choice that reads a void only Java fills is still an arm. The
# `knob` is an atom that comes back with a `reply`, and nobody in the source
# ever puts anything in the `mode` of a `reply`, but the atom does on every
# run, since it is Java that makes the `reply` it hands back. So the `mode` is
# unknown, not empty, and `pick` is a `dial` or that `mode`, not a `dial`
# alone (#8981).
eo:
  choice.eo: |
    [pick] > choice
      pick > @
  yes.eo: |
    [^] > yes
      choice > @
        [^]
          ? >> left
          ? >> right
          left > @
  no.eo: |
    [^] > no
      choice > @
        [^]
          ? >> left
          ? >> right
          right > @
  dial.eo: |
    [^ sys] > dial
  reply.eo: |
    [code mode] > reply
  knob.eo: |
    [] > knob /Q.reply
  app.eo: |
    [] > app
      knob > got
      [^ flag] > pick
        flag.pick > @
          dial 03-
          ^.got.mode
      pick yes > first
      pick no > second
links:
  - "/links/type[@id='Φ.app.pick.φ']/ref/union/ref[@loc='Φ.dial']"
  - "/links/type[@id='Φ.app.pick.φ']/ref/union/ref[@loc='Φ.reply.mode']"
