---
# An arm of a choice that reads a void two atoms fill is still an arm. Nobody
# in the program puts anything in `m`, but the `grip` and the `grasp` are both
# handed `hold`, and their brace lists say one fills that `m` with an `oak`
# and the other with an `elm`. So `m` is filled, the census says so, and
# `pick` is a `dial` or whatever `m` holds, not a `dial` alone. With one atom
# the void is named before anyone asks whether it is filled, so only a second
# atom shows whether the rule reads the same list the census does (#9006).
eo:
  choice.eo: |
    [pick] > choice
      pick > @
  yes.eo: |
    [^] > yes
      choice > @
        [^]
          ? >> left
          ? >> right
          left > @
  no.eo: |
    [^] > no
      choice > @
        [^]
          ? >> left
          ? >> right
          right > @
  dial.eo: |
    [^ sys] > dial
  oak.eo: |
    [] > oak
  elm.eo: |
    [] > elm
  grip.eo: |
    [] > grip /Q.bytes
      ? > scope /{Q.oak}
  grasp.eo: |
    [] > grasp /Q.bytes
      ? > scope /{Q.elm}
  app.eo: |
    [] > app
      grip hold > one
      grasp hold > two
      [m] > hold
        [^ flag] > pick
          flag.pick > @
            dial 03-
            ^.m
        pick yes > first
        pick no > second
links:
  - "/links/type[@id='Φ.app.hold.pick.φ']/ref/union/ref[@loc='Φ.dial']"
  - "/links/type[@id='Φ.app.hold.pick.φ']/ref/union/ref[@loc='Φ.app.hold.m']"
