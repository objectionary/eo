---
# The same program with the name spelled the way `t` spells it. Nothing is
# reported, which is the answer this has to give about almost every dispatch
# of almost every program.
eo:
  app.eo: |
    [] > app
      t.next > @
  t.eo: |
    [] > t
      [] > next
problems:
  - "/problems[not(type)]"
