---
# An arm of a choice that reads a void only an atom fills is still an arm.
# Nobody in the program puts anything in `m`, but the `grip` is handed `hold`
# and its brace list says it fills that `m` with an `oak` on every run, so
# `pick` is a `dial` or an `oak` and not a `dial` alone (#8981).
eo:
  choice.eo: |
    [pick] > choice
      pick > @
  yes.eo: |
    [^] > yes
      choice > @
        [^]
          ? >> left
          ? >> right
          left > @
  no.eo: |
    [^] > no
      choice > @
        [^]
          ? >> left
          ? >> right
          right > @
  dial.eo: |
    [^ sys] > dial
  oak.eo: |
    [] > oak
  grip.eo: |
    [] > grip /Q.bytes
      ? > scope /{Q.oak}
  app.eo: |
    [] > app
      grip hold > @
      [m] > hold
        [^ flag] > pick
          flag.pick > @
            dial 03-
            ^.m
        pick yes > first
        pick no > second
links:
  - "/links/type[@id='Φ.app.hold.pick.φ']/ref/union/ref[@loc='Φ.dial']"
