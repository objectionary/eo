---
# `^` names the receiver a formation declares and not the object it happens to
# be written inside. `inner` says `[^]`, so `^.held` asks `held` of that void
# and the answer waits for whoever dispatches on `inner`. Since #6657 the void
# is declared, so the demand is written against the void and not against the
# `outer` the body happens to sit in. What the void will hold is declared as
# well, it is the `outer`, so the row that reads `^` says `outer` and does not
# call it witnessed, a declaration being true of every caller (#8979).
eo:
  outer.eo: |
    [] > outer
      [] > held
      [^] > inner
        ^.held > @
xmir:
  outer.eo:
    - "//o[@base='.held']/o[@base='ξ.ρ']"
needs:
  - "/needs/type[@id='Φ.outer.inner.φ.ρ']/attr[@name='held']"
provides:
  - "/provides/type[@id='Φ.outer.inner']/attr[@name='ρ' and @holds='Φ.outer']"
links:
  - "/links/type[@id='Φ.outer.inner.φ.ρ']/ref[@loc='Φ.outer'][not(@witnessed)]"
