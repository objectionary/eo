---
# Every object sits in something, and for a formation that says nothing about
# its receiver that is the only answer there is, so it is written down from
# the locator. A formation that declares one is different: what it sits in is
# whatever the caller dispatched on, and the guess must not be written over
# the top of the declaration.
eo:
  inc.eo: |
    [^ x] > inc
      x > @
  oak.eo: |
    [] > oak
provides:
  - "//type[@id='Φ.inc']/attr[@name='ρ'][@void='true'][@type='Φ.inc.ρ']"
  - "//type[@id='Φ.oak']/attr[@name='ρ'][not(@void)][@type='Φ']"
