---
# One object can be a dispatch and an application at once, and it gives a row
# to each table: `number.plus` asks the other file for `plus`, and the `5` has
# to fit into whatever that turns out to be. Both rows are about the same
# object, and only reading them together says whether the code holds.
eo:
  sum.eo: |
    [] > sum
      number.plus 5 > @
  number.eo: |
    [] > number
      [x] > plus
        x > @
checks:
  - "/checks/type[@id='Φ.sum.φ']/attr[@name='α0' and @type='Φ.sum.φ.α0']"
needs:
  - "/needs/type[@id='Φ.sum.φ.ρ']/attr[@name='plus' and @type='Φ.sum.φ']"
links:
  - "/links/type[@id='Φ.sum.φ.ρ' and @copy='Φ.number']"
provides:
  - "/provides/type[@id='Φ.number.plus']/attr[@name='x' and @void='true']"
