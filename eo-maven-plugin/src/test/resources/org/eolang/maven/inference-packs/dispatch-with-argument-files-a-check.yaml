---
# Applying the result of a dispatch files a check too: the `5` has to fit
# into whatever `x.plus` turns out to be. The dispatch itself is asked for
# `plus`, so one object here gives a row to two different tables.
eo: |
  [x] > sum
    x.plus 5 > @
checks:
  - "/checks/type[@id='Φ.sum.φ']/attr[@name='α0']"
needs:
  - "/needs/type[@id='Φ.sum.φ.ρ']/attr[@name='plus']"
