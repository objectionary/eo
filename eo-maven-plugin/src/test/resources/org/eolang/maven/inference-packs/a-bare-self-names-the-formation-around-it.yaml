---
# A bare `$` takes no attribute from anything, yet it still names an object:
# the one being formed around it. Without a row of its own every read through
# it was lost, while the same read written as `$.tree` worked.
eo:
  app.eo: |
    [] > app
      oak > tree
      $ > me
      me.tree > t
  oak.eo: |
    [] > oak
      [] > leaf
links:
  - "//type[@id='Φ.app.me']/ref[@loc='Φ.app']"
  - "//type[@id='Φ.app.t']/ref[@loc='Φ.app.tree']"
