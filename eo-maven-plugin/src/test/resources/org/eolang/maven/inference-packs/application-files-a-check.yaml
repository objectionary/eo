---
# Putting something into a copy of another object is a promise, and this row
# is where it is written down. The three files are the reason the row is
# worth anything: the check names the argument, the links say the copy is of
# `inc` and the argument is a `t`, and the provides say `inc` has one void to
# put it in. None of the three files knows that alone.
eo:
  app.eo: |
    [] > app
      inc t > @
  inc.eo: |
    [x] > inc
      x > @
  t.eo: |
    [] > t
      [] > next
checks:
  - "/checks/type[@id='Φ.app.φ']/attr[@name='α0' and @type='Φ.app.φ.α0']"
links:
  - "/links/type[@id='Φ.app.φ' and @copy='Φ.inc']"
  - "/links/type[@id='Φ.app.φ.α0' and @copy='Φ.t']"
provides:
  - "/provides/type[@id='Φ.inc']/attr[@name='x' and @void='true']"
