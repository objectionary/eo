---
# An `ends` is taken off a `rope` and off nothing else, so the `^` it declares
# holds a `rope`, and the source says so for every caller there will ever be.
# The one caller this program happens to have takes it off a `knot`, which
# makes the `knot` the whole census of that `^`. The census is the poorer fact
# of the two, so the row that reads `^` keeps naming the void, which a reader
# walks through on the `rope` it declares, and is never told that every `ends`
# hangs off a `knot` (#8960).
eo:
  rope.eo: |
    [] > rope
  ends.eo: |
    +package rope

    [^ tail] > ends
      tail.eq > @
        ^ >> me
  knot.eo: |
    [] > knot
      rope > @
  app.eo: |
    [] > app
      knot.ends 42 > @
provides:
  - "/provides/type[@id='Φ.rope.ends']/attr[@name='ρ' and @holds='Φ.rope']"
links:
  - "/links/type[starts-with(@id, 'Φ.rope.ends.a🌵')]/ref[@loc='Φ.rope.ends.ρ'][not(@witnessed)]"
  - "/links[not(type[starts-with(@id, 'Φ.rope.ends.')]/ref[@loc='Φ.knot'])]"
