# What `x` holds is decided by whoever fills it, so `x.next` is a different
# object for every caller. It is the same thing said of all of them, though —
# the `next` of whatever `x` holds — and the locator of the void is the name
# that says it. Nothing is claimed here about what that object has.
eo:
  inc.eo: |
    [x] > inc
      x.next > @
links:
  - "/links/type[@id='Φ.inc.φ']/ref[@loc='Φ.inc.x.next']"
