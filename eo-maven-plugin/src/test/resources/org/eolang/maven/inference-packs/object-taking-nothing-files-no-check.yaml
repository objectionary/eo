---
# Nothing is applied anywhere in this program, so there is nothing to check
# later and the table is empty. There is not a number in sight either, on
# purpose: a number is an application of its own, and would be a row.
eo:
  lone.eo: |
    [] > lone
      [] > inside
  quiet.eo: |
    [] > quiet
      [] > still
checks:
  - "/checks[not(type)]"
