---
# A reference takes no attribute from anything, so the splitting leaves it
# alone: one name after the head is not a dispatch.
eo:
  tap.eo: |
    [] > tap
      water > @
      [] > water
xmir:
  tap.eo:
    - "//o[@base='ξ.water']"
