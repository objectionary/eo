---
# The `wide` of a `num` comes back as a `big` or as whatever its `fail`
# holds, the way `as-u64` of `bytes` comes back as a `u64` or as its
# `cant-convert`. So `(num yes).wide.div (num no)` in `app` is the `div` of
# that `big` in the first arm, and the `num` it passes goes into the `b` of
# that `div`, the way every `x.as-u64.div y` of `u64/div.eo` fills the `b` of
# `u64.div`. It went nowhere, since the pair of the call is rooted at a void
# and nobody puts anything into the `div` of a void, and the `b` read as a
# void nothing in the program fills (#8883).
eo:
  choice.eo: |
    [pick] > choice
      pick > @
  yes.eo: |
    [^] > yes
      choice > @
        [^]
          ? >> left
          ? >> right
          left > @
  no.eo: |
    [^] > no
      choice > @
        [^]
          ? >> left
          ? >> right
          right > @
  num.eo: |
    [flag] > num
      [^ fail] > wide
        ^.flag.pick > @
          big ^
          fail
  big.eo: |
    [v] > big
      [^ b fail] > div
        b > @
  app.eo: |
    [] > app
      (num yes).wide.div (num no) > @
  other.eo: |
    [] > other
      num no > @
links:
  - "/links/type[@id='Φ.app.φ']/ref/bind[@void='Φ.big.div.b'][@witnessed]\
    /ref[@loc='Φ.app.φ.α0']"
provides:
  - "//type[@id='Φ.big.div']/attr[@name='b']/witnessed/ref[@loc='Φ.num']"
