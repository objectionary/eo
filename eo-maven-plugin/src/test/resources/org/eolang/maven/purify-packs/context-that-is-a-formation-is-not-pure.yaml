---
# A body that reads the object it is attached to, where that object is a
# formation and not data, depends on something no cache key can hold. Read
# from a number, the same body is marked.
eo:
  app.eo: |
    [] > app
      box.inner > @
      42.doubled > @
      [] > box
        7 > tag
        [] > inner
          ^.tag > @
  number.eo: |
    [as-bytes] > number
      as-bytes > @
      [x] > plus
        x > @
      [] > doubled
        ^.plus 0 > @
pure:
  - "//o[@name='inner' and not(@pure)]"
  - "//o[@name='doubled' and @pure='true']"
