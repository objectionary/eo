---
# The object a formation is attached to is an input like any other: a
# formation says so by declaring "^", and that "^" holds the formation it is
# written in. "halved" is written in "number", so a body reading "^" reads
# data and the formation is marked.
eo:
  app.eo: |
    [] > app
      42.halved > @
  number.eo: |
    [as-bytes] > number
      as-bytes > @
      [x] > div
        x > @
      [^] > halved
        ^.div 2 > @
  bytes.eo: |
    [@] > bytes
pure:
  - "//o[@name='halved' and @pure='true']"
