---
# The object a formation is attached to is an input like any other: a
# formation says so by declaring "^", and the table then says what callers
# put there. When that is a number, a body reading it reads data and the
# formation is marked.
eo:
  app.eo: |
    [] > app
      halved 42 > @
  halved.eo: |
    [^] > halved
      ^.div 2 > @
  number.eo: |
    [as-bytes] > number
      as-bytes > @
      [x] > div
        x > @
pure:
  - "//o[@name='halved' and @pure='true']"
