---
# A bytes object is decided by its bytes exactly like a number or a string is,
# so a void the program only ever fills with one is an input a cache key can
# be made of.
eo:
  app.eo: |
    [] > app
      shout 01-02 > @
      [x] > shout
        x > @
  bytes.eo: |
    [as-bytes] > bytes
      as-bytes > @
pure:
  - "//o[@name='shout' and @pure='true']"
