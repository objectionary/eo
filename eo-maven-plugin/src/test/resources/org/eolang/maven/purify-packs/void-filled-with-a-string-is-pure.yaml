---
# A string is data as much as a number is, and a void the program only ever
# fills with one is an input a cache key can be made of.
eo:
  app.eo: |
    [] > app
      shout "boom" > @
      [x] > shout
        x.as-bytes > @
  string.eo: |
    [as-bytes] > string
      as-bytes > @
pure:
  - "//o[@name='shout' and @pure='true']"
