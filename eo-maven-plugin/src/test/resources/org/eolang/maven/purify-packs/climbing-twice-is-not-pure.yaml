---
# The tables describe the first step out of a formation and say nothing about
# the next one, so a body that climbs twice is not marked, however its first
# step is typed. One step out of a number is fine.
eo:
  app.eo: |
    [] > app
      42.outer.inner > @
      42.doubled > @
  number.eo: |
    [as-bytes] > number
      as-bytes > @
      [x] > plus
        x > @
      [] > doubled
        ^.plus 0 > @
      [] > outer
        [] > inner
          ^.^.as-bytes > @
pure:
  - "//o[@name='inner' and not(@pure)]"
  - "//o[@name='doubled' and @pure='true']"
