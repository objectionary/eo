---
# A receiver has to be handed over for the table to have seen it, and nobody
# dispatches on this one: "halved" is written and never called, so the row
# for its "^" stays empty and the formation is left alone. The one that is
# dispatched on a number is marked.
eo:
  app.eo: |
    [] > app
      42.doubled > @
  number.eo: |
    [as-bytes] > number
      as-bytes > @
      [x] > plus
        x > @
      [^] > doubled
        ^.plus 0 > @
      [^] > halved
        ^.plus 0 > @
pure:
  - "//o[@name='halved' and not(@pure)]"
  - "//o[@name='doubled' and @pure='true']"
