---
# A declared "^" holds the formation it is written in, and "reads" is written
# at the top of its file, where "^" holds the package it was loaded from. That
# is no better than a void filled with a formation: the bytes of a formation
# are not what identifies it.
eo:
  app.eo: |
    [] > app
      reads box > @
      [] > box
        7 > tag
  reads.eo: |
    [^] > reads
      ^.tag > @
  number.eo: |
    [as-bytes] > number
      as-bytes > @
  bytes.eo: |
    [@] > bytes
pure:
  - "//o[@name='reads' and not(@pure)]"
