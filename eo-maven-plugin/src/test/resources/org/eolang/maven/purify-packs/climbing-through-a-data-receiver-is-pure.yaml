---
# Nothing has to be defended against a body climbing further out. Once the
# receiver is a number, "^.^" is an attribute of that number like any other,
# and what is taken from it is decided by the same bytes that already went
# into the cache key.
eo:
  app.eo: |
    [] > app
      deep 42 > @
  deep.eo: |
    [^] > deep
      ^.^.as-bytes > @
  number.eo: |
    [as-bytes] > number
      as-bytes > @
pure:
  - "//o[@name='deep' and @pure='true']"
