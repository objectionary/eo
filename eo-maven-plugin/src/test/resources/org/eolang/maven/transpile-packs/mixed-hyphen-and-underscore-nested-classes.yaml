---
# yamllint disable rule:line-length
# #9047: `_` mapped to `__` beside `-` to `_`, so `a-_b` and `a_-b` both came
# out as `a___b` and the two anonymous formations were declared twice under
# the same name in one file.
sheets:
  - /org/eolang/parser/parse/set-locators.xsl
  - /org/eolang/maven/transpile/set-original-names.xsl
  - /org/eolang/maven/transpile/classes.xsl
  - /org/eolang/maven/transpile/anonymous-to-nested.xsl
  - /org/eolang/maven/transpile/attrs.xsl
  - /org/eolang/maven/transpile/data.xsl
  - /org/eolang/maven/transpile/to-java.xsl
asserts:
  - /object[not(errors)]
  - /object/class/java[contains(text(), 'private static class EOΦ$main$a_$u00005Fb$φ$α0 extends PhDefault')]
  - /object/class/java[contains(text(), 'private static class EOΦ$main$a$u00005F_b$φ$α0 extends PhDefault')]
input: |
  [] > main
    [] > a-_b
      foo > @
        []
          42 > @
    [] > a_-b
      foo > @
        []
          43 > @
