---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/maven/transpile/recursion-to-cps.xsl
asserts:
  - /object[not(errors)]
  - //o[@name='f']/o[@name='φ' and @base='.if']/o[@as='α1' and @base='ξ.ρ.f']
  - /object[not(//o[@name='k🌵'])]
input: |
  [] > app
    f 2 > @
    [^ c] > w
      [^ a b] > if
        ^.c.if a b > @
    [^ n] > f
      if. > @
        ^.w (n.eq 0)
        0
        ^.f (n.minus 1)
