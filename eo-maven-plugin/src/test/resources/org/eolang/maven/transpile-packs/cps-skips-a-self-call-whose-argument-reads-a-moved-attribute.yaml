---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/maven/transpile/recursion-to-cps.xsl
asserts:
  - /object[not(errors)]
  - /object[not(//o[@name='k🌵'])]
input: |
  [] > main
    [i] > rec
      if. > @
        i.eq 0
        1
        cur.plus prev
      ^.rec (i.minus 1) > prev
      ^.rec (prev.minus 1) > cur
    rec 5 > @
