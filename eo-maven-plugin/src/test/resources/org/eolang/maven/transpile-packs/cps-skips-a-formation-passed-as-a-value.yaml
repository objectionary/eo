---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/maven/transpile/recursion-to-cps.xsl
asserts:
  - /object[not(errors)]
  - /object[not(//o[@name='k🌵'])]
input: |
  [] > main
    [i] > rec
      if. > @
        i.eq 0
        0
        (^.rec (i.minus 1)).plus 1
    rec.i > @
