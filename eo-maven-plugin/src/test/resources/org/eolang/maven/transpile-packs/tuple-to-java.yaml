---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/parser/parse/set-locators.xsl
  - /org/eolang/maven/transpile/set-original-names.xsl
  - /org/eolang/maven/transpile/classes.xsl
  - /org/eolang/maven/transpile/attrs.xsl
  - /org/eolang/maven/transpile/data.xsl
  - /org/eolang/maven/transpile/to-java.xsl
asserts:
  - /object[not(errors)]
  - //java[contains(text(), 'package org.eolang;')]
  - //java[contains(text(), 'Phi rr_1_1 = new PhDispatch(Phi.Φ, "tuple");')]
  - //java[contains(text(), 'new PhDispatch(rr_1_1_1, "empty");')]
  - //java[contains(text(), 'Phi rr_1_1_2 = new PhDispatch(Phi.Φ, "number");')]
  - //java[contains(text(), 'Phi rr_1_1_3 = new PhDispatch(Phi.Φ, "number");')]
  - //java[contains(text(), 'rr_1_1 = new PhApplication(rr_1_1, new Bind(0, rr_1_1_1)')]
  - //java[contains(text(), 'new Bind(1, rr_1_1_2)')]
  - //java[contains(text(), 'new Bind(2, rr_1_1_3)')]
input: |
  [] > tuples
    [] > foo
      * 1 2 (* 3 4) > @

    [] > bar
      zz 42 * > qux

    [] > baz
      """
      абвгд
      """ > @
