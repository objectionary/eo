---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/maven/transpile/recursion-to-cps.xsl
asserts:
  - /object[not(errors)]
  - //o[@name='rec']/o[@base='∅' and @name='k🌵']
  - //o[@name='rec']/o[@name='φ' and @base='.if']/o[@as='left' and @base='ξ.k🌵' and @again='true']
  - //o[@name='rec']/o[@name='φ']/o[@as='right' and @base='ξ.ρ.rec' and @again='true']
input: |
  [] > main
    [i] > rec
      if. > @
        i.eq 0
        0:left
        ((^.rec (i.minus 1)).plus 1):right
    rec 5 > @
