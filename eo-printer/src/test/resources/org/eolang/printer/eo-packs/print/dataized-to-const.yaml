---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/parser/parse/resolve-before-stars.xsl
  - /org/eolang/parser/parse/wrap-method-calls.xsl
  - /org/eolang/parser/parse/const-to-dataized.xsl
  - /org/eolang/parser/parse/stars-to-tuples.xsl
  - /org/eolang/parser/parse/vars-float-up.xsl
  - /org/eolang/parser/parse/build-fqns.xsl
  - /org/eolang/parser/parse/expand-aliases.xsl
  - /org/eolang/parser/parse/resolve-aliases.xsl
  - /org/eolang/parser/parse/add-default-package.xsl
  - /org/eolang/parser/parse/roll-bases.xsl
  - /org/eolang/printer/print/dataized-to-const.xsl
asserts:
  - //o[@base='Φ.x' and @const and @name='first']
  - //o[@base='Φ.dataized.as-bytes' and @name='second']
  - //o[@base='Φ.a' and @const and @name='third']/o[@base='Φ.b']
  # A const on a formation takes back the formation that "const-to-dataized"
  # floated beside it, and the floated sibling goes away with it (#9382).
  - //o[@name='fourth' and @const and not(@base) and not(o)]
  - /object[count(//o[@name='fourth-1' or @base='ξ.fourth-1'])=0]
  - //o[@base='Φ.number' and @name='fifths' and @const]/o[@base='Φ.bytes']/o[text()!='']
  - //o[@base='Φ.bytes' and @name='sixth' and @const]/o[text()='2A-']
  - //o[@base='ξ.third' and @const and not(@as)]
input: |
  [] > foo
    x > first!
    dataized.as-bytes > second
    a b > third!
    [] > fourth!
    5 > fifths!
    2A- > sixth!
    as-bytes. > seventh
      dataized
        third:0
