---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/parser/parse/resolve-before-stars.xsl
  - /org/eolang/parser/parse/wrap-method-calls.xsl
  - /org/eolang/parser/parse/const-to-dataized.xsl
  - /org/eolang/parser/parse/stars-to-tuples.xsl
  - /org/eolang/parser/parse/vars-float-up.xsl
  - /org/eolang/parser/parse/build-fqns.xsl
  - /org/eolang/parser/parse/expand-aliases.xsl
  - /org/eolang/parser/parse/resolve-aliases.xsl
  - /org/eolang/parser/parse/add-default-package.xsl
  - /org/eolang/parser/parse/roll-bases.xsl
  - /org/eolang/printer/print/dataized-to-const.xsl
asserts:
  # A literal carrying an argument folds into a const, and the two stay
  # separate nodes: the payload keeps its own element and the argument keeps
  # its own, with no node holding both texts joined together.
  - //o[@base='Φ.bytes' and @const and @name='first']
  - //o[@name='first']/o[text()='2A-']
  - //o[@name='first']/o[@base='Φ.number']/o[@base='Φ.bytes']/o[text()='40-14-00-00-00-00-00-00']
  - //o[@name='first' and not(text()[normalize-space()])]
  # A literal with a payload and no argument still folds, unchanged.
  - //o[@base='Φ.bytes' and @const and @name='second']/o[text()='2A-']
  # A wrapper the template does not match is copied through as it was.
  - //o[@base='Φ.dataized.as-bytes' and @name='third']
input: |
  [] > foo
    2A- 5 > first!
    2A- > second!
    dataized.as-bytes > third
