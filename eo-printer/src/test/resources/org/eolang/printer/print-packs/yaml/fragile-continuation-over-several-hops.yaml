---
# yamllint disable rule:line-length
# #7478: two continuation lines below the same object are one object by
# the time the printer sees them - ".y" and "?.q" under a "42 > z" parse
# into a single "ξ.z.y.q". R-6.2.2 puts the chain's naming line on the
# last link, so "?.q" carries "> w" while ".y" stays an intermediate hop
# and "z" stays the intermediate name of the head R-6.2.3 allows. The
# whole run then prints as one head line carrying its receiver, and the
# fragile marker of the run sits on the hop that dispatches fragilely,
# so the line reads back as this very object.
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [] > m
    42 > z
    .y
    ?.q > w

printed: |
  [] > m
    z.y?.q > w
    42 > z
