---
# yamllint disable rule:line-length
# The identity glyph takes no horizontal arguments (R-3.16.1), so a method
# called on it keeps its arguments on their own lines (#9169). Inlining them
# writes `I.eq foo`, which the parser refuses, and the next pass over the
# file drops the attribute it named.
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [] > app
    I.eq > x
      foo

