---
# A program that declares metas and no object at all: the schema allows it
# (`/object/o` is optional) and the parser reports no error for it. The blank
# line R-6.5.5 asks for separates the metas from what follows them, so with
# nothing following, the program ends at its last meta and the printed EO
# reparses to itself (#6713).
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  +package кактус.🌵
  +version 0.0.0

printed: |
  +package кактус.🌵
  +version 0.0.0
