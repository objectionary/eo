---
# A literal's own bytes are its a0, so an applied argument lands in a1 and
# prints as an explicit "5:1". Before #5721 the argument was lost entirely.
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [] > main
    42 5 > x
    "str" 5 > y

printed: |
  [] > main
    42 > x
      5:1
    "str" > y
      5:1
