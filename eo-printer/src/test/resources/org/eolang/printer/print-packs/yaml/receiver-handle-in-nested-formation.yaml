---
# yamllint disable rule:line-length
# A nested formation reaches the receiver handle of the formation around
# it through "^.s", the way it reaches any handle declared further out
# (#8227).
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [^s] > foo
    [] > bar
      s.baz > @

printed: |
  [^s] > foo
    ^.s.baz > [] > bar
