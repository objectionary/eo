---
# A const file-local handle (`a >> b!`, #5817) whose only reference lives inside
# a nested `>>` formation body. Folding the const into that reference would move
# its dataization into the nested formation, where it runs again in every copy
# of it, so the const stays standing in its owner (#9122). Nothing references
# `slice-byte` either, and it is kept as well, so neither declaration vanishes
# (#5914).
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [b] > array
    b.size >> len!
    [index] >> slice-byte
      index.lt len > @

printed: |
  [b] > array
    b.size >> len!
    index.lt len > [index] >> slice-byte
