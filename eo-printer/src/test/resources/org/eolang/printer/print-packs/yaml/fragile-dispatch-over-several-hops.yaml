---
# yamllint disable rule:line-length
# A dispatch onto a sibling of the formation carries the whole run of
# hops on one line, since R-6.2.2 (#8183) puts the chain's name on its
# last link and a line per hop would leave every earlier one unnamed.
# The object holds a single "@fragile" for the run, and a dispatch that
# follows a fragile one has to repeat the "?." itself, so the marker
# prints immediately before the hop it belongs to rather than at the
# head of the base.
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [] > m
    z.y?.q > w
    42 > z
