---
# A const read inside a deeper scope must go on meaning what it meant where it
# was written. Here `len` is `b.size` of the `b` that `array` declares, and the
# formation reading it declares a `b` of its own. The const stays standing in
# `array` rather than folding into that formation (#9122), so its `b` is still
# the one `array` was given, and the formation reads it back by its handle.
# Folded in without a hop, `slice-byte 1` would read `1.size` instead (#7095).
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [b] > array
    b.size >> len!
    [b] >> slice-byte
      b.plus len > @
    slice-byte 1 > @

printed: |
  [b] > array
    b.size >> len!
    b.plus len > [b] >>
    | 1 > @
