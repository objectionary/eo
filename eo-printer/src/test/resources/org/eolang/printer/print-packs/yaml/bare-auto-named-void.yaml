---
# A bare "? >>" void of an ordinary formation (R-3.4.7). The bracket head
# cannot hold it: a bracket param is a public name, and this void has none,
# so the printer keeps the vertical form. Before #9379 the void was folded
# into the head as "[v2_2]", which parses but turns an anonymous void into a
# public attribute.
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [] > foo
    ? >>
    1 > @
