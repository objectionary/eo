---
# yamllint disable rule:line-length
# The receiver is supplied by dispatch; R-3.12.2a forbids the old :^ binding.
# Keep the positional argument when printing the call vertically.
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [] > user
    y.lt x:0 > @

printed: |
  y.lt > [] > user
    x
