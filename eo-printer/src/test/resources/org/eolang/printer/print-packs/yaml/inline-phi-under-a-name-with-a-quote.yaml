---
# A body that is a bare reference to a name holding a quote. The printer
# folds it into the inline-phi form, as it does for any other name, and
# before #9378 the line it wrote was refused on the way back: the scans for
# the "> [" of an inline-phi read the quote inside the name as the start of
# a string literal.
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [] > foo
    a"b > @

printed: |
  a"b > [] > foo
