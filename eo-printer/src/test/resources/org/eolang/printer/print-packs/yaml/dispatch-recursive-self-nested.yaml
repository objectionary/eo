---
# yamllint disable rule:line-length
# A harder case of the recursive dispatch fold (#5848): the recursive
# "[buffer] &gt;&gt; bar" handle's dispatch use ("bar.read") is itself buried
# under a second dispatch ("... .test 66") that reaches it through its "r"
# handle. The parser hoists the "&gt;&gt; r" binding up to "foo", and the
# printer folds it back into the writer's nesting. The recursive handle still
# folds onto its "read" dispatch as a reversed-dispatch moniker and keeps its
# readable "&gt;&gt; bar" name so "bar chunk" reads by name. This confirms the
# fold survives when the dispatch use sits inside a larger expression, not
# just as a direct sibling of the handle.
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [] > foo
    test. > z
      read. >> r
        [buffer] >> bar
          bar chunk > x
      66
printed: |
  [] > foo
    test. > z
      read. >> r
        [buffer] >> bar
          ^.bar chunk > x
      66
