---
# A method bound to a void by name, whose receiver has no one-line spelling.
# The vertical head `plus.:z` does not parse and the suffix shape needs the
# receiver on one line, so the receiver gets a line of its own and the
# method follows it as a continuation with the binding after its name.
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [] > app
    if. >> n0
      foo 59 bar
      *
        false
    qux > @
      n0
      .plus:z

printed: |
  [] > app
    qux > @
      if.
        foo 59 bar
        * false
      .plus:z
