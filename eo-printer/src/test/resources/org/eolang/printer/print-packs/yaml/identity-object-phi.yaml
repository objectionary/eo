# yamllint disable rule:line-length
# An identity object standing as the sole φ of a formation (#6834) folds
# into the inline-phi form, just as a bare `T` decoratee does.
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [] > app
    m > [m] > @

printed: |
  I > [] > app
