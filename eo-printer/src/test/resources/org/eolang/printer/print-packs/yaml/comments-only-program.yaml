# A program that is nothing but its top comment block: the parser flushes the
# block at end of file and reports no error. The blank line R-6.5.2 asks for
# separates the block from the first meta or object, so with neither of them
# present the program ends at its last comment line and the printed EO
# reparses to itself (#6713).
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  # кактус 🌵 живёт
  # и не сдаётся

printed: |
  # кактус 🌵 живёт
  # и не сдаётся
