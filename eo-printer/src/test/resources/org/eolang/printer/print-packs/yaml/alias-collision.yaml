---
# yamllint disable rule:line-length
# A short name is introduced only when it cannot be misread on reparse (#6184).
# Here two distinct qualified names, `a.b.foo` and `c.d.foo`, both shorten to
# the same segment `foo`, so aliasing either would make the two collide;
# "restore-aliases" leaves both fully qualified and emits no alias, and each
# full form reads back unambiguously on its own.
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  +package sandbox

  [] > app
    a.b.foo > p
    a.b.foo > q
    c.d.foo > r
    c.d.foo > s

printed: |
  +package sandbox

  [] > app
    a.b.foo > p
    a.b.foo > q
    c.d.foo > r
    c.d.foo > s
