---
# yamllint disable rule:line-length
# Two anonymous pipes inside an argument print as one chain (#9298).
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [] > app
    foo > @
      [a] >>
        a > @
      | 2 >>
      |
        3
printed: |
  [] > app
    foo > @
      I >>
      | 2 >>
      | 3
