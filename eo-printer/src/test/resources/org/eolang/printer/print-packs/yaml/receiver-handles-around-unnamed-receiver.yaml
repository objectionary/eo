---
# yamllint disable rule:line-length
# A reference that climbs out of three nested formations takes the handle of
# each formation that names its receiver and a bare "^" for the one that
# does not, so "^.t.s" leaves "c" through "^", "b" through "t", and "a"
# through "s" (#9245).
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [^s] > a
    [^t] > b
      [] > c
        ^.t.s.foo > x
        ^.t.bar > y
