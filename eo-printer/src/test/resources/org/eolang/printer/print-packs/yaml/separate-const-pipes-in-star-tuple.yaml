---
# Each pipe keeps its own predecessor; neither predecessor is a tuple element.
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [] > app
    * > values
      0
      [x] >>!
      | 1 > first
      [y] >>!
      | 2 > second
      3

printed: |
  [] > app
    * > values
      0
      first
      second
      3
    [x] >>!
    | 1 > first
    [y] >>!
    | 2 > second
