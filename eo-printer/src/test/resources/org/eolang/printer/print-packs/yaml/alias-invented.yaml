---
# yamllint disable rule:line-length
# A qualified name referenced more than once earns a `+alias` even when the
# source never declared one (#6184): `org.eolang.io.stdout` is written out in
# full twice, so "restore-aliases" introduces the alias and shortens both
# references to `stdout`.
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  +package sandbox

  [] > app
    org.eolang.io.stdout > a
    org.eolang.io.stdout > b

printed: |
  +alias org.eolang.io.stdout
  +package sandbox

  [] > app
    stdout > a
    stdout > b
