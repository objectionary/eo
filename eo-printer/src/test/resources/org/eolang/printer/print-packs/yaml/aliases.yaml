---
# yamllint disable rule:line-length
# The parser resolves an aliased name to its fully-qualified form and drops the
# alias's role; "restore-aliases" (#6184) rebuilds the alias metas from usage.
# Here `os` is referenced once, so it prints fully qualified (`sm.os`) and its
# `+alias` is dropped rather than left dead, and the two aliases the source
# never used at all (`stdout`, `custom`) are dropped as well.
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  +package sandbox
  +alias sm.os
  +alias org.eolang.io.stdout
  +alias custom org.eolang.string.regex

  [] > app
    os > x

printed: |
  +package sandbox

  [] > app
    sm.os > x
