---
# yamllint disable rule:line-length
# #7218: the host must be "w", the one that prints first, not "z".
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [] > main
    [] >> h
      5 > y
    h.y > z
    h.y > w
printed: |
  [] > main
    y. > w
      [] >> h
        5 > y
    h.y > z
