---
# A test attribute whose body dispatches on a dataized value. The sheet
# `dataized-to-const` folds the `.as-bytes` over `Phi.dataized` into the const
# `5!`, and the whole body used to collapse onto one line as
# `eq. 5! 40-... ++> can-x`. An only-phi formation takes no reversed dispatch
# with horizontal arguments (R-3.10.6), so the parser turned that line down and
# the next pass of the format lost the test (#9446). A reversed dispatch over a
# const has no inline shape: its receiver cannot be glued in front of the dot,
# and its one-liner floats the const out into a handle of its own on the next
# parse. It is laid out vertically, where the const is written as the handle
# that parse makes of it.
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [] > foo

    eq. ++> can-x
      as-bytes.
        dataized 5
      40-14-00-00-00-00-00-00

printed: |
  [] > foo

    ++> can-x
      eq. > @
        5 >>!
        40-14-00-00-00-00-00-00
