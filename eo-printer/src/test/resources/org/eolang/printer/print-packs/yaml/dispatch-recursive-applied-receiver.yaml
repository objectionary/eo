---
# yamllint disable rule:line-length
# The recursive dispatch fold (#5848) when the "[buffer] >> input-block" handle
# is first APPLIED and then dispatched, buried under a further method call:
# "(input-block --).read" reached through "@". The applied handle folds into a
# moniker at its use site, its argument becoming a "| --" pipe continuation that
# binds the inlined formation (the recursive mirror of "inline-cactoos", #5844).
# The handle keeps its ">> input-block" name so "input-block chunk" reads by name.
# Without the fold the use prints as the parenthesised "(input-block --).read".
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [size] > read
    @. > @
      read.
        input-block --
        size
    [buffer] >> input-block
      buffer > @
      [size] > read
        seq * > @
          chunk
          input-block chunk
        output. > chunk!
          posix *1
            "read"
            posix.stdin
            size
printed: |
  [size] > read
    @. > @
      read.
        [buffer] >> input-block
          buffer > @
          [size] > read
            seq * > @
              chunk
              input-block chunk
            output. > chunk!
              posix *1
                "read"
                posix.stdin
                size
        | --
        size
