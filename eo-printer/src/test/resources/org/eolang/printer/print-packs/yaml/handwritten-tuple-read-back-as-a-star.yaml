---
# yamllint disable rule:line-length
# A `tuple` the author wrote by hand in exactly the shape `stars-to-tuples`
# builds, a nested tuple, one element and the length of the two together, is
# read back as the star it spells (#9165).
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [] > app
    tuple > @
      tuple.empty
      42
      1

printed: |
  * > [] > app
    42
