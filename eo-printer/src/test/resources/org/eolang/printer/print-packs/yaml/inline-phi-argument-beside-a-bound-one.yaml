---
# yamllint disable rule:line-length
# #9380: a formation argument that carries a binding prints as a vertical
# formation with the label on its bracket line ("[m]:y"), never collapsed
# into the inline-phi form with the label glued after the brackets
# ("q > [m]:y"), where no binding may stand ("unexpected content after name
# suffix" on reparse). Both arguments are bound by name, since R-6.6.2 lets
# one argument group bind only names, only slot numbers, or nothing (#9682).
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [] > foo
    c > @
      5:x
      [m]:y
        q > @
