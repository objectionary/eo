---
# A constant made of nothing but a bare "^" travels into a deeper scope when
# it is folded into its only reference, so it must climb one more formation
# to keep reading the receiver of "foo". Printed without the hop, "^!" inside
# "bar" dataizes "foo" itself instead of its receiver (#9106).
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [^] > foo
    ^ >> d!
    [x] > bar
      x.plus ^.d > @

printed: |
  [^] > foo
    x.plus ^.^! > [x] > bar
