---
# A handle that applies the formation handle right above it, read only by
# `> @`, is folded into that reader. The application then stands right
# under the anonymous formation and reads it as a pipe, not through a
# synthetic name nothing declares.
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [] > app
    [b] >> n0
      foo > @
    n0 42 >> n3
    n3 > @

printed: |
  [] > app
    foo > [b] >>
    | 42 > @
