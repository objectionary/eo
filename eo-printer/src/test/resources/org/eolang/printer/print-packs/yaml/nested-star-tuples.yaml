---
# yamllint disable rule:line-length
# The space inside "foo bar" is content, not an argument being applied, so
# that tuple stays on one line while the three-argument ones above and below
# it are split (#8949).
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [] > foo
    * abc 4.3 "test" > first
    * bar (* "foo bar") (* 1 3 4) > second
    * > third
      * 4 5 6 6
      test
        * 5 6 6

printed: |
  [] > foo
    * > first
      abc
      4.3
      "test"
    * > second
      bar
      * "foo bar"
      *
        1
        3
        4
    * > third
      *
        4
        5
        6
        6
      test *
        5
        6
        6
