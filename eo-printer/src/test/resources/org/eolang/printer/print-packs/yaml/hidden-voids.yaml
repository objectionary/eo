---
# yamllint disable rule:line-length
# The parser hides every void behind "v🌵" (#9788), together with its own
# reads and every named binding, and the printer takes the mark off, so the
# program prints back the way it was written.
penalties:
  INDENT: 3
  BRACKET: 7
  EXCESS: 1
  WIDTH: 80
  STEP: 2
  SPACE: 7
origin: |
  [x y] > foo
    bar > g
      5:x
      6:y
    bar.x > h
    [z] > inner
      ^.x.plus z > @
      me.z.plus w > [^me w] >> deep
    [@] > num
    y.plus x > sum
    x > value
