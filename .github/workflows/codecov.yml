---
# yamllint disable rule:line-length
name: codecov
'on':
  push:
    branches:
      - master
permissions:
  contents: read
concurrency:
  group: codecov-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codecov:
    # Forty-five minutes and not twenty-five: the first run after a bump of
    # the pinned phino version builds it from source, and only that run.
    timeout-minutes: 45
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21.0.12+101.0.LTS
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-
      # The `lower` goal needs the exact phino version pinned in the plugin,
      # and this job is the one that always builds with lowering on.
      # The binary is copied into a folder of its own, because cabal keeps
      # its files under `~/.local` and only symlinks the executable there,
      # so a cache of `~/.cabal` would save nothing and rebuild phino each run.
      - uses: actions/cache@v6
        with:
          path: ~/.phino
          key: phino-${{ hashFiles('eo-lowering/src/main/resources/org/eolang/lowering/phino-version.txt') }}
      - run: |
          ver=$(tr -d '[:space:]' < eo-lowering/src/main/resources/org/eolang/lowering/phino-version.txt)
          if ! "$HOME/.phino/phino" --version 2>/dev/null | grep -qx "${ver}"; then
            cabal update
            cabal install "phino-${ver}" --installdir="$HOME/.phino" --install-method=copy --overwrite-policy=always
          fi
          echo "$HOME/.phino" >> "$GITHUB_PATH"
      - run: mvn install '-Deo.coverageTracking=true' '-Deo.lowering=true'
      # The goal must have run, and a missing folder is how a silently
      # disabled lowering would look.
      - run: test -n "$(find eo-runtime/target/eo -maxdepth 1 -type d -name '[0-9][0-9]-lowering')"
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./eo-parser/target/site/jacoco/jacoco.xml,./eo-runtime/target/site/jacoco/jacoco.xml,./eo-maven-plugin/target/site/jacoco/jacoco.xml,./eo-runtime/target/coverage.info
          fail_ci_if_error: true
        if: github.ref == 'refs/heads/master'
  telegram:
    needs: codecov
    runs-on: ubuntu-26.04
    if: ${{ always() }}
    permissions:
      actions: read
    steps:
      - uses: yegor256/terald-action@0.1.0
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT }}
