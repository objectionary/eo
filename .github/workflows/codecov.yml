---
# yamllint disable rule:line-length
name: codecov
'on':
  push:
    branches:
      - master
concurrency:
  group: codecov-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codecov:
    # Forty-five minutes and not twenty-five: the first run after a bump of
    # the pinned phino version builds it from source, and only that run.
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-
      - uses: actions/cache@v6
        with:
          path: ~/.cabal
          key: phino-${{ hashFiles('eo-lowering/src/main/resources/org/eolang/lowering/phino-version.txt') }}
      - run: |
          ver=$(tr -d '[:space:]' < eo-lowering/src/main/resources/org/eolang/lowering/phino-version.txt)
          if ! "$HOME/.cabal/bin/phino" --version 2>/dev/null | grep -qx "${ver}"; then
            cabal update
            cabal install "phino-${ver}" --overwrite-policy=always
          fi
          echo "$HOME/.cabal/bin" >> "$GITHUB_PATH"
      - run: mvn install '-Deo.coverageTracking=true' '-Deo.loweringRequired=true'
      # Lowering must not only have run, it must have folded something:
      # a build where no fragment folds at all means the selection or the
      # phino dialect silently broke.
      - run: ls eo-runtime/target/eo/4-lower/*.xmir
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./eo-parser/target/site/jacoco/jacoco.xml,./eo-runtime/target/site/jacoco/jacoco.xml,./eo-maven-plugin/target/site/jacoco/jacoco.xml,./eo-runtime/target/coverage.info
          fail_ci_if_error: true
        if: github.ref == 'refs/heads/master'
  telegram:
    needs: codecov
    runs-on: ubuntu-24.04
    if: ${{ failure() }}
    permissions:
      actions: read
    steps:
      - id: elapsed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          seconds=$(gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '[ .jobs[] | select(.completed_at) ]
              | (map(.completed_at | fromdate) | max) - (map(.started_at | fromdate) | min)
              | [ ., 0 ] | max')
          echo "This run took ${seconds} seconds"
          echo "seconds=${seconds}" >> "${GITHUB_OUTPUT}"
      - uses: appleboy/telegram-action@master
        with:
          to: -1004371404002
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "⚠️ Code coverage of `${{ github.repository }}` just [failed](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) in ${{ steps.elapsed.outputs.seconds }}s."
          disable_web_page_preview: true
          format: markdown
  recovered:
    needs: codecov
    runs-on: ubuntu-24.04
    if: ${{ success() }}
    permissions:
      actions: read
    steps:
      - id: elapsed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          seconds=$(gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '[ .jobs[] | select(.completed_at) ]
              | (map(.completed_at | fromdate) | max) - (map(.started_at | fromdate) | min)
              | [ ., 0 ] | max')
          echo "This run took ${seconds} seconds"
          echo "seconds=${seconds}" >> "${GITHUB_OUTPUT}"
      - id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for _ in 1 2 3 4 5 6; do
            state=$(gh api "/repos/${{ github.repository }}/actions/workflows/codecov.yml/runs?branch=${{ github.ref_name }}&per_page=100" \
              --jq 'if any(.workflow_runs[]; .id == ${{ github.run_id }})
                then [ .workflow_runs[]
                  | select(.id < ${{ github.run_id }})
                  | select(.conclusion == "failure" or .conclusion == "success") ][0].conclusion // "none"
                else "stale" end')
            [ "${state}" = 'stale' ] || break
            sleep 10
          done
          echo "The previous run of this workflow: ${state}"
          if [ "${state}" = 'failure' ]; then
            echo 'broken=yes' >> "${GITHUB_OUTPUT}"
          fi
      - if: ${{ steps.previous.outputs.broken == 'yes' }}
        uses: appleboy/telegram-action@master
        with:
          to: -1004371404002
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "🍓 Code coverage of `${{ github.repository }}` just [recovered](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) in ${{ steps.elapsed.outputs.seconds }}s. The report is [here](https://app.codecov.io/gh/objectionary/eo)."
          disable_web_page_preview: true
          format: markdown
