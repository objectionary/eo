---
# yamllint disable rule:line-length
name: codecov
'on':
  push:
    branches:
      - master
concurrency:
  group: codecov-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codecov:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-
      - run: mvn install -Pjacoco -Deo.coverageTracking=true -Deo.minCoverage=55
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./eo-parser/target/site/jacoco/jacoco.xml,./eo-runtime/target/site/jacoco/jacoco.xml,./eo-maven-plugin/target/site/jacoco/jacoco.xml,./eo-runtime/target/coverage.info
          fail_ci_if_error: true
        if: github.ref == 'refs/heads/master'
  telegram:
    needs: codecov
    runs-on: ubuntu-24.04
    if: ${{ failure() }}
    steps:
      - uses: appleboy/telegram-action@master
        with:
          to: -1001381878846
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "⚠️ Failed to publish code coverage of ${{ github.repository }}, see [the log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          disable_web_page_preview: true
          format: markdown
