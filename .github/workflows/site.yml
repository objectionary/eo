---
# yamllint disable rule:line-length
name: site
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 26
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-jdk-26-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-jdk-26-maven-
      - uses: JesseTG/rm@v1.0.3
        with:
          path: ~/.m2/repository/org/eolang
      - run: mvn clean site -Psite
  telegram:
    needs: site
    runs-on: ubuntu-24.04
    if: ${{ failure() }}
    steps:
      - uses: appleboy/telegram-action@master
        with:
          to: -1004371404002
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "⚠️ Failed to builds Maven site of ${{ github.repository }}, see [the log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          disable_web_page_preview: true
          format: markdown
