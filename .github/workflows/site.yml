---
# yamllint disable rule:line-length
name: site
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 26
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-jdk-26-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-jdk-26-maven-
      - uses: JesseTG/rm@v1.0.3
        with:
          path: ~/.m2/repository/org/eolang
      - run: mvn clean site -Psite
  telegram:
    needs: site
    runs-on: ubuntu-24.04
    if: ${{ failure() }}
    permissions:
      actions: read
    steps:
      - id: elapsed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          seconds=$(gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '[ .jobs[] | select(.completed_at) ]
              | (map(.completed_at | fromdate) | max) - (map(.started_at | fromdate) | min)
              | [ ., 0 ] | max')
          echo "This run took ${seconds} seconds"
          echo "seconds=${seconds}" >> "${GITHUB_OUTPUT}"
      - uses: appleboy/telegram-action@master
        with:
          to: -1004371404002
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "⚠️ Maven site build of `${{ github.repository }}` just [failed](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) in ${{ steps.elapsed.outputs.seconds }}s."
          disable_web_page_preview: true
          format: markdown
  recovered:
    needs: site
    runs-on: ubuntu-24.04
    if: ${{ success() && github.ref == 'refs/heads/master' }}
    permissions:
      actions: read
    steps:
      - id: elapsed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          seconds=$(gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '[ .jobs[] | select(.completed_at) ]
              | (map(.completed_at | fromdate) | max) - (map(.started_at | fromdate) | min)
              | [ ., 0 ] | max')
          echo "This run took ${seconds} seconds"
          echo "seconds=${seconds}" >> "${GITHUB_OUTPUT}"
      - id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for _ in 1 2 3 4 5 6; do
            state=$(gh api "/repos/${{ github.repository }}/actions/workflows/site.yml/runs?branch=${{ github.ref_name }}&per_page=100" \
              --jq 'if any(.workflow_runs[]; .id == ${{ github.run_id }})
                then [ .workflow_runs[]
                  | select(.id < ${{ github.run_id }})
                  | select(.conclusion == "failure" or .conclusion == "success") ][0].conclusion // "none"
                else "stale" end')
            [ "${state}" = 'stale' ] || break
            sleep 10
          done
          echo "The previous run of this workflow: ${state}"
          if [ "${state}" = 'failure' ]; then
            echo 'broken=yes' >> "${GITHUB_OUTPUT}"
          fi
      - if: ${{ steps.previous.outputs.broken == 'yes' }}
        uses: appleboy/telegram-action@master
        with:
          to: -1004371404002
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "🍓 Maven site build of `${{ github.repository }}` just [recovered](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) in ${{ steps.elapsed.outputs.seconds }}s."
          disable_web_page_preview: true
          format: markdown
