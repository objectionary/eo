---
# yamllint disable rule:line-length
name: qulice
'on':
  pull_request:
    branches:
      - master
    paths:
      - '**.java'
      - '**/pom.xml'
      - '.github/workflows/qulice.yml'
permissions:
  contents: read
concurrency:
  group: qulice-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qulice:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 26
      # Restored, never saved: the `mvn` job saves this very key on master,
      # where every pull request can read it, while a cache saved here is
      # scoped to one pull request and pushes master's out of the quota.
      - uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-jdk-26-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-jdk-26-maven-
      - uses: JesseTG/rm@v1.0.3
        with:
          path: ~/.m2/repository/org/eolang
      - run: mvn -ntp -Pqulice --errors --batch-mode -Deo.skip clean process-classes qulice:check
