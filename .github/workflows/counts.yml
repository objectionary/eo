---
name: counts
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  counts:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Every metric must track exactly one pattern. Merging a few of them
        # into a single alternation hides movement: adding five `null` and
        # removing five `static` keeps the total intact, while the code gets
        # worse. Separate counters also tell us which particular smell grew,
        # instead of pointing at a vague bucket.
        include:
          - metric: suppressions
            files: '*.java'
            pattern: '@SuppressWarnings'
            count: 114
          - metric: checkstyles
            files: '*.java'
            pattern: '@checkstyle'
            count: 248
          - metric: statics
            files: '*.java'
            pattern: 'static'
            count: 599
          - metric: nulls
            files: '*.java'
            pattern: 'null'
            count: 251
          - metric: atoms
            files: '*.java'
            pattern: '@XmirObject'
            count: 26
          - metric: nodelists
            files: '*.java'
            pattern: 'org\.w3c\.dom\.NodeList'
            count: 0
          - metric: unlints
            files: '*.eo'
            pattern: '\+unlint'
            count: 86
          - metric: disabled
            files: '*.java'
            pattern: '@Disabled\b'
            count: 5
    steps:
      - uses: actions/checkout@v7
      - env:
          METRIC: ${{ matrix.metric }}
          FILES: ${{ matrix.files }}
          PATTERN: ${{ matrix.pattern }}
          COUNT: ${{ matrix.count }}
        run: |
          found=$(( $(git ls-files -z "${FILES}" \
            | xargs -0 grep -Eoh "${PATTERN}" \
            | wc -l) ))
          echo "Found ${found} ${METRIC}, expecting ${COUNT}"
          if [ "${found}" -ne "${COUNT}" ]; then
            echo "Expected ${COUNT} ${METRIC}, found ${found}"
            exit 1
          fi
