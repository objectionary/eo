---
# yamllint disable rule:line-length
name: mvn
'on':
  push:
    branches:
      - master
concurrency:
  group: mvn-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mvn:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel, macos-15]
        java: [26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-jdk-${{ matrix.java }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-jdk-${{ matrix.java }}-maven-
      - uses: JesseTG/rm@v1.0.3
        with:
          path: ~/.m2/repository/org/eolang
      # The `lower` goal needs the exact phino version pinned in
      # eo-lowering; the Linux leg installs it and demands lowering,
      # while Windows and macOS build without it, keeping the skip
      # path of the goal continuously covered.
      - if: ${{ matrix.os == 'ubuntu-24.04' }}
        uses: actions/cache@v6
        with:
          path: ~/.cabal
          key: phino-${{ hashFiles('eo-lowering/src/main/resources/org/eolang/lowering/phino-version.txt') }}
      - if: ${{ matrix.os == 'ubuntu-24.04' }}
        run: |
          ver=$(tr -d '[:space:]' < eo-lowering/src/main/resources/org/eolang/lowering/phino-version.txt)
          if ! "$HOME/.cabal/bin/phino" --version 2>/dev/null | grep -qx "${ver}"; then
            cabal update
            cabal install "phino-${ver}" --overwrite-policy=always
          fi
          echo "$HOME/.cabal/bin" >> "$GITHUB_PATH"
          echo "LOWERING=-Deo.loweringRequired=true" >> "$GITHUB_ENV"
      - run: mvn -ntp -PskipITs --errors --batch-mode '-Deo.coverageTracking=false' '-Deo.transpileTests=false' '-Deo.deadline=2' ${{ env.LOWERING }} clean install
  telegram:
    needs: mvn
    runs-on: ubuntu-24.04
    if: ${{ failure() }}
    permissions:
      actions: read
    steps:
      - id: elapsed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          seconds=$(gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '[ .jobs[] | select(.completed_at) ]
              | (map(.completed_at | fromdate) | max) - (map(.started_at | fromdate) | min)
              | [ ., 0 ] | max')
          echo "This run took ${seconds} seconds"
          echo "seconds=${seconds}" >> "${GITHUB_OUTPUT}"
      - uses: appleboy/telegram-action@master
        with:
          to: -1004371404002
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "⚠️ Maven build of `${{ github.repository }}` just [failed](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) in ${{ steps.elapsed.outputs.seconds }}s."
          disable_web_page_preview: true
          format: markdown
  recovered:
    needs: mvn
    runs-on: ubuntu-24.04
    if: ${{ success() }}
    permissions:
      actions: read
    steps:
      - id: elapsed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          seconds=$(gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '[ .jobs[] | select(.completed_at) ]
              | (map(.completed_at | fromdate) | max) - (map(.started_at | fromdate) | min)
              | [ ., 0 ] | max')
          echo "This run took ${seconds} seconds"
          echo "seconds=${seconds}" >> "${GITHUB_OUTPUT}"
      - id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for _ in 1 2 3 4 5 6; do
            state=$(gh api "/repos/${{ github.repository }}/actions/workflows/mvn.yml/runs?branch=${{ github.ref_name }}&per_page=100" \
              --jq 'if any(.workflow_runs[]; .id == ${{ github.run_id }})
                then [ .workflow_runs[]
                  | select(.id < ${{ github.run_id }})
                  | select(.conclusion == "failure" or .conclusion == "success") ][0].conclusion // "none"
                else "stale" end')
            [ "${state}" = 'stale' ] || break
            sleep 10
          done
          echo "The previous run of this workflow: ${state}"
          if [ "${state}" = 'failure' ]; then
            echo 'broken=yes' >> "${GITHUB_OUTPUT}"
          fi
      - if: ${{ steps.previous.outputs.broken == 'yes' }}
        uses: appleboy/telegram-action@master
        with:
          to: -1004371404002
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "🍓 Maven build of `${{ github.repository }}` just [recovered](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) in ${{ steps.elapsed.outputs.seconds }}s."
          disable_web_page_preview: true
          format: markdown
