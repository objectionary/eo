---
# yamllint disable rule:line-length
name: mvn
'on':
  push:
    branches:
      - master
permissions:
  contents: read
concurrency:
  group: mvn-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mvn:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel, macos-15]
        java: [26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-jdk-${{ matrix.java }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-jdk-${{ matrix.java }}-maven-
      - uses: JesseTG/rm@v1.0.3
        with:
          path: ~/.m2/repository/org/eolang
      # The `lower` goal is on by default and needs the exact phino version
      # pinned in the plugin. The Linux leg installs it, while Windows and
      # macOS build with lowering explicitly off, keeping the disabled path
      # of the goal continuously covered.
      - if: ${{ matrix.os == 'ubuntu-24.04' }}
        uses: objectionary/phino@965c7e0b8b66a28ec14731c52960ac4be63d6ae6  # master
        with:
          version: 0.0.164
      - if: ${{ matrix.os != 'ubuntu-24.04' }}
        run: echo "LOWERING=-Deo.lower.bypass=true" >> "$GITHUB_ENV"
      - run: mvn -ntp -PskipITs --errors --batch-mode '-Deo.transpile.coverage=false' '-Deo.transpile.tests=false' '-Deo.deadline=2' ${{ env.LOWERING }} clean install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  telegram:
    needs: mvn
    runs-on: ubuntu-26.04
    if: ${{ always() }}
    permissions:
      actions: read
    steps:
      - uses: yegor256/terald-action@0.1.0
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT }}
