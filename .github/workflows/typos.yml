---
# yamllint disable rule:line-length
name: typos
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
concurrency:
  group: typos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typos:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.50.1
        with:
          config: ./.github/typos.toml
