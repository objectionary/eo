---
# yamllint disable rule:line-length
name: titles
# The hourly schedule is the only trigger, on purpose. An `issues: opened`
# trigger runs with the repository's secrets, and anybody at all can open an
# issue, so that trigger handed `OPENAI_API_KEY` to a third-party action on
# text a stranger wrote (#8853). The schedule already looks back 180 days, so
# a title opened in between is still read, an hour later at the latest.
'on':
  schedule:
    - cron: '0 * * * *'
concurrency:
  group: titles
  cancel-in-progress: false
jobs:
  titles:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: horw/issue-title-ai@v0.1.8b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          days-to-scan: 180
          skip-label: 'good-title'
          auto-update: true
          max-issues: 10
          model: gpt-4
          verbose: true
          apply-to-closed: false
          required-labels: bug, enhancement
          quiet: true
          strip-characters: '"'
          style: offense
