---
# yamllint disable rule:line-length
name: snippets
'on':
  push:
    branches:
      - master
permissions:
  contents: read
concurrency:
  group: snippets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  snippets:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21.0.12+101.0.LTS
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ubuntu-qulice-jdk-21-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ubuntu-qulice-jdk-21-maven-
      - run: mvn clean install -ntp -Psnippets --errors --batch-mode
  telegram:
    needs: snippets
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    permissions:
      actions: read
    steps:
      - uses: yegor256/terald-action@6d5c4dab44d17afefa282df9bd7340185b8e93bc  # master
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat: -1004371404002
