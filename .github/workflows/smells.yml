---
name: smells
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
env:
  THRESHOLD: 855
jobs:
  smells:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          found=$(( $(git ls-files -z '*.java' \
            | xargs -0 grep -oh -e 'static' -e 'null' \
            | wc -l) ))
          echo "Found ${found} smells, threshold is ${THRESHOLD}"
          if [ "${found}" -ne "${THRESHOLD}" ]; then
            echo "Expected ${THRESHOLD} smells in Java, found ${found}"
            exit 1
          fi
