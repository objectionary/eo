---
# yamllint disable rule:line-length
name: daily
'on':
  schedule:
    # Run load testing at 01:30 UTC every day
    - cron: '30 1 * * *'
jobs:
  daily:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-jdk-21-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-jdk-21-maven-
      - run: .github/daily.sh ${{ github.workspace }}
  telegram:
    needs: daily
    runs-on: ubuntu-24.04
    if: ${{ failure() }}
    steps:
      - uses: appleboy/telegram-action@master
        with:
          to: -1004371404002
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "⚠️ Failed the daily build of ${{ github.repository }}, see [the log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          disable_web_page_preview: true
          format: markdown
