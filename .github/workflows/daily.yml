---
# yamllint disable rule:line-length
name: daily
'on':
  schedule:
    # Run load testing at 01:30 UTC every day
    - cron: '30 1 * * *'
jobs:
  daily:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-jdk-21-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-jdk-21-maven-
      - run: .github/daily.sh ${{ github.workspace }}
  telegram:
    needs: daily
    runs-on: ubuntu-24.04
    if: ${{ failure() }}
    steps:
      - uses: appleboy/telegram-action@master
        with:
          to: -1004371404002
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "⚠️ Daily build of ${{ github.repository }} [failed](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          disable_web_page_preview: true
          format: markdown
  recovered:
    needs: daily
    runs-on: ubuntu-24.04
    if: ${{ success() }}
    permissions:
      actions: read
    steps:
      - id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          latest() {
            gh api "/repos/${{ github.repository }}/actions/workflows/daily.yml/runs?branch=${{ github.ref_name }}&status=$1&per_page=1" \
              --jq '[ .workflow_runs[] | select(.id != ${{ github.run_id }}) | .id ][0] // 0'
          }
          if [ "$(latest failure)" -gt "$(latest success)" ]; then
            echo 'broken=yes' >> "${GITHUB_OUTPUT}"
          fi
      - if: ${{ steps.previous.outputs.broken == 'yes' }}
        uses: appleboy/telegram-action@master
        with:
          to: -1004371404002
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "👍🏻 Daily build of ${{ github.repository }} [recovered](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          disable_web_page_preview: true
          format: markdown
