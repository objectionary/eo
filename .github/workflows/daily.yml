---
# yamllint disable rule:line-length
name: daily
'on':
  schedule:
    # Run load testing at 01:30 UTC every day
    - cron: '30 1 * * *'
permissions:
  contents: read
concurrency:
  group: daily
  cancel-in-progress: false
jobs:
  daily:
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21.0.12+101.0.LTS
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-jdk-21-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-jdk-21-maven-
      - run: .github/daily.sh ${{ github.workspace }}
  telegram:
    needs: daily
    runs-on: ubuntu-24.04
    if: ${{ always() }}
    permissions:
      actions: read
    steps:
      - uses: yegor256/terald-action@6d5c4dab44d17afefa282df9bd7340185b8e93bc  # master
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          chat: ${{ secrets.TELEGRAM_CHAT }}
