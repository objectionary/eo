---
# yamllint disable rule:line-length
name: trufflehog-oss
'on':
  push:
    branches:
      - master
permissions:
  contents: read
concurrency:
  group: trufflehog-oss-${{ github.ref }}
  cancel-in-progress: false
jobs:
  trufflehog:
    timeout-minutes: 25
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      # Full history of `master` only: `fetch-depth: 0` would also pull
      # `gh-pages`, about three gigabytes of site snapshots, and the job
      # would time out before scanning a single commit.
      - name: Fetch history of master
        run: git fetch --unshallow --no-tags origin +refs/heads/master:refs/remotes/origin/master
      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@e28360875917c9c730f9c64aae29fb93aa6c359e # main
        with:
          extra_args: --only-verified
