---
# yamllint disable rule:line-length
name: trufflehog-oss
'on':
  push:
    branches:
      - master
permissions:
  contents: read
concurrency:
  group: trufflehog-oss-${{ github.ref }}
  cancel-in-progress: false
jobs:
  trufflehog:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@8135b80f84d134bc0abd4c2c4b3213d6f17694fb # main
        with:
          extra_args: --only-verified
