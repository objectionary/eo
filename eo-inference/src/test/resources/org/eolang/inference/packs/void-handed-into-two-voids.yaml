# yamllint disable rule:line-length
# Nobody calls shelf, so stuff is an open void, and shelf hands it on to book
# and to scale. Each call answers its head, book and scale, and pages and
# weight stay open.
sources:
  book.eo: |
    [pages] > book
      pages.size > @
  scale.eo: |
    [weight] > scale
      weight.mass > @
  shelf.eo: |
    [stuff] > shelf
      book stuff > a
      scale stuff > b
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
