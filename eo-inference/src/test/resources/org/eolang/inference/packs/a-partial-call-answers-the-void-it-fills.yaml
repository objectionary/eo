---
# yamllint disable rule:line-length
# pair 1 fills left and leaves right empty. The @ of pair is left, so half is a
# number. Nobody reads half, so that copy does not count, and pair is walked as
# written, with left and right both open.
sources:
  app.eo: |
    [] > app
      pair 1 > half
  pair.eo: |
    [left right] > pair
      left > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.app.half.α0' and @lands='left']/is[@loc='Φ.number']
  - /answers[not(o[@lands='right'])]
  - /answers/o[@loc='Φ.app.half']/is[@loc='Φ.number']
  - /answers[not(o[@loc='Φ.pair.left']/is[@loc='Φ.number'])]
  - /answers/o[@loc='Φ.pair' and @copies='1']/reduced/is[@loc='Φ.pair']
  - /answers/o[@loc='Φ.pair.left']/open
  - /answers/o[@loc='Φ.pair.right']/open
