---
# yamllint disable rule:line-length
# box grafted hands grafted on uncalled, so its x is still empty. A copy with
# an empty void that nobody reads from outside does not count, so it is not
# reduced: item holds grafted itself, not the oak its @ gives. Nobody calls
# grafted, so its copy as written is kept, where x is an open void.
sources:
  oak.eo: |
    [] > oak
      [] > leaf
  grafted.eo: |
    [x] > grafted
      oak > @
  box.eo: |
    [item] > box
  app.eo: |
    [] > app
      box grafted > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.box.item']/is[@loc='Φ.grafted']
  - /answers[not(o[@loc='Φ.box.item']/is[@loc='Φ.oak'])]
  - /answers/o[@loc='Φ.grafted' and @copies='1']
  - /answers/o[@loc='Φ.grafted.x']/open
