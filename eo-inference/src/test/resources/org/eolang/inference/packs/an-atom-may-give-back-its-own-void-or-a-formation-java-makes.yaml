---
# yamllint disable rule:line-length
# pick returns what goes into its value or an oak Java makes. app puts "x"
# into value, so app is a string or an oak.
sources:
  pick.eo: |
    [] > pick /A|Q.oak
      ? > value /A
  oak.eo: |
    [] > oak
  app.eo: |
    [] > app
      pick "x" > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
facts:
  - /facts/objects/type[@id='Φ.pick' and @returns='Φ.pick.v🌵value|Φ.oak']/return[@loc='Φ.pick.v🌵value']
answers:
  - /answers/o[@loc='Φ.pick.λ' and count(*)=2 and ./is[@loc='Φ.pick.v🌵value']]/is[@loc='Φ.oak']
  - /answers/o[@loc='Φ.app.φ' and count(*)=2 and ./is[@loc='Φ.string']]/is[@loc='Φ.oak']
