---
# yamllint disable rule:line-length
# Nobody calls helper, so a stop keeps its copy as written, where x is unknown.
# The @ of wrap is its void, so wrap x answers that unknown, and the call of box
# on it waits for a stop (rule b) and then answers box as it is. So the only
# copy of box is the one app makes, and its item holds a number alone.
sources:
  helper.eo: |
    [x] > helper
      box (wrap x) > @
  wrap.eo: |
    [a] > wrap
      a > @
  box.eo: |
    [item] > box
      item > @
      42 > size
  app.eo: |
    [] > app
      box 5 > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.helper.v🌵x']/unknown
  - /answers/o[@loc='Φ.helper.φ.α0' and @lands='v🌵item']/unknown
  - /answers/o[@loc='Φ.helper.φ']/is[@loc='Φ.box']
  - /answers/o[@loc='Φ.box' and @copies='1']
  - /answers/o[@loc='Φ.box.v🌵item' and @copies='1']/is[@loc='Φ.number']
