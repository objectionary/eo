---
# yamllint disable rule:line-length
# choice has a not besides its pick, as bool does, so yes and no go into the
# flag of num as a choice. ^.flag.pick in wide picks big ^ for yes and the
# fail that other hands in for no. So (num yes).wide.div in app is the div of
# a big, and the num handed to it goes into its b: b is a num, and so are the
# @ of div and the @ of app.
sources:
  choice.eo: |
    [pick] > choice
      pick > @
      [] > not
        ^.pick no yes > @
  yes.eo: |
    [^] > yes
      choice > @
        [^]
          ? >> left
          ? >> right
          left > @
  no.eo: |
    [^] > no
      choice > @
        [^]
          ? >> left
          ? >> right
          right > @
  num.eo: |
    [flag] > num
      [^ fail] > wide
        ^.flag.pick > @
          big ^
          fail
  big.eo: |
    [v] > big
      [^ b] > div
        b > @
  small.eo: |
    [v] > small
      [^ b] > div
        b > @
  app.eo: |
    [] > app
      (num yes).wide.div (num no) > @
  other.eo: |
    [] > other
      (num no).wide (small 0) > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.num.flag']/is[@loc='Φ.choice']
  - /answers/o[@loc='Φ.yes.φ.α0.φ']/is[@loc='Φ.big']
  - /answers/o[@loc='Φ.no.φ.α0.φ']/is[@loc='Φ.small']
  - /answers/o[@loc='Φ.app.φ.ρ']/is[@loc='Φ.big']
  - /answers/o[@loc='Φ.app.φ.α0' and @lands='b']/is[@loc='Φ.num']
  - /answers/o[@loc='Φ.big.div.b']/is[@loc='Φ.num']
  - /answers/o[@loc='Φ.big.div.φ']/is[@loc='Φ.num']
  - /answers/o[@loc='Φ.app.φ']/is[@loc='Φ.num']
