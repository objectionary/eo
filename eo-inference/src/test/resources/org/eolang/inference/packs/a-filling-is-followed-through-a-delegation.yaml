  one.eo: |
    [x] > one
      x > @
  two.eo: |
    [y] > two
      one y > @
  u.eo: |
    [] > u
      [] > next
  app.eo: |
    [] > app
      two u > held
      held.next > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
