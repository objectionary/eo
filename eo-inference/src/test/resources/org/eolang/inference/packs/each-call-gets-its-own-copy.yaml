# yamllint disable rule:line-length
# speak is called twice, once with a cat and once with a dog. Each call gets
# a copy of speak of its own, so kitten is only a string and puppy only a number.
sources:
  speak.eo: |
    [pet] > speak
      pet.voice > @
  cat.eo: |
    [] > cat
      "meow" > voice
  dog.eo: |
    [] > dog
      42 > voice
  home.eo: |
    [] > home
      speak cat > kitten
      speak dog > puppy
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
