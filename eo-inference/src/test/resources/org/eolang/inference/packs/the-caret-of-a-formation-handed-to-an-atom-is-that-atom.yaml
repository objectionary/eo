---
# yamllint disable rule:line-length
# The formation app writes as the argument of the atom run declares its ^, and
# it goes into the copy of run the call makes, so that copy is its ^. An atom
# is an object like any other here, and nothing is forbidden.
sources:
  jobs.eo: |
    [] > jobs
      [] > run /Q.number
        ? > job
  app.eo: |
    [] > app
      jobs.run > @
        [^]
          42 > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.app.φ.α0' and @lands='v🌵job']
  - /answers/o[@loc='Φ.app.φ.α0.ρ' and @copies='1' and count(*)=1]/is
  - /answers[not(//fails)]
