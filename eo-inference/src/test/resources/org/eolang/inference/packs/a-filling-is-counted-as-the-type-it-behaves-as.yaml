---
# yamllint disable rule:line-length
# alias is nothing but a @ that gives an oak, so it goes into x as an oak:
# both calls of inc fill x with an oak, and both get the leaf of oak back.
sources:
  app.eo: |
    [] > app
      inc oak > first
      inc alias > second
  inc.eo: |
    [x] > inc
      x.leaf > @
  oak.eo: |
    [] > oak
      [] > leaf
  alias.eo: |
    [] > alias
      oak > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
