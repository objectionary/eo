---
# yamllint disable rule:line-length
# grip calls arm with an oak, and arm calls the scope of its ^ with its m, so
# the oak reaches the k of hold and the j of pick. Both copies of grip make
# arm at one place, so they share one arm whose ^ holds both, and the @ of
# each grip is hold or pick.
sources:
  oak.eo: |
    [] > oak
  grip.eo: |
    [scope] > grip
      arm oak > @
      [^ m] > arm
        ^.scope m > @
  app.eo: |
    [] > app
      grip hold > @
      grip pick > twin
      [k] > hold
      [j] > pick
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
