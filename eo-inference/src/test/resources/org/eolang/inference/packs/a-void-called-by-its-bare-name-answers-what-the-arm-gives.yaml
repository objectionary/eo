---
# yamllint disable rule:line-length
# taken calls choose, a void of pick written alone, with two oaks. yes and no
# fill choose with an arm whose @ is one of its own voids, so the call answers
# what goes there: taken is an oak, and the grows app reads off it answers the
# bytes it is handed.
sources:
  pick.eo: |
    [choose] > pick
      choose > taken
        oak
        oak
  yes.eo: |
    [^] > yes
      pick > @
        [^]
          ? >> left
          ? >> right
          left > @
  no.eo: |
    [^] > no
      pick > @
        [^]
          ? >> left
          ? >> right
          right > @
  oak.eo: |
    [] > oak
      [^ tall] > grows
        tall > @
  app.eo: |
    [] > app
      yes.taken.grows > @
        03-
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
