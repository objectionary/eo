---
# yamllint disable rule:line-length
# pair has no void z, so pair 5:z fails the way a call with more arguments
# than voids does, and the @ of app is T.
sources:
  pair.eo: |
    [a b] > pair
      b > @
  app.eo: |
    [] > app
      pair 5:z > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers[not(o[@loc='Φ.app.φ.z' and @lands])]
  - /answers/o[@loc='Φ.app.φ']/terminator
