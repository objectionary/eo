---
# yamllint disable rule:line-length
# opened in shelf is kept.lid, and shelf reading its own opened puts nothing
# into the ^ of lid: in every copy that ^ holds a box, and opened, like the
# box.lid of cupboard, gives that box back.
sources:
  box.eo: |
    [] > box
      [^] > lid
        ^ > @
  shelf.eo: |
    [] > shelf
      box > kept
      kept.lid > opened
      opened > @
  cupboard.eo: |
    [] > cupboard
      box.lid > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
