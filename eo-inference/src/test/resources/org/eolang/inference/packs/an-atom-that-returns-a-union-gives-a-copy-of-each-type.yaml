---
# yamllint disable rule:line-length
# flag returns a true or a false, and Java makes a copy of each. So the if
# read off what flag returns is the if of both, and app, which calls it with
# "yes" and 42, is a string and a number, with no unknown next to them.
sources:
  flag.eo: |
    [] > flag /Q.true|Q.false
  app.eo: |
    [] > app
      flag.if "yes" 42 > @
  bool.eo: |
    [fork] > bool
      if > @
      fork > if
  true.eo: |
    [^] > true
      bool > @
        [^]
          ? >> left
          ? >> right
          left > @
  false.eo: |
    [^] > false
      bool > @
        [^]
          ? >> left
          ? >> right
          right > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.flag.λ' and count(*)=2 and ./is[@loc='Φ.true']]/is[@loc='Φ.false']
  - /answers/o[@loc='Φ.app.φ' and count(*)=2 and ./is[@loc='Φ.string']]/is[@loc='Φ.number']
  - /answers[not(o[starts-with(@loc, 'Φ.app') or starts-with(@loc, 'Φ.flag')]//unknown)]
