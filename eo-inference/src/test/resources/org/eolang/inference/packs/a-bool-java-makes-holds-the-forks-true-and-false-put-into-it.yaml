---
# yamllint disable rule:line-length
# flag returns a bool, a type with no brackets, so the fork of the bool Java
# makes holds what EO code puts there: the formations true and false hand to
# bool, and nothing else. So the if read off what flag returns is the if of
# both, and app, which calls it with "yes" and 42, is a string and a number,
# with no unknown next to them.
sources:
  flag.eo: |
    [] > flag /Q.bool
  app.eo: |
    [] > app
      flag.if "yes" 42 > @
  bool.eo: |
    [fork] > bool
      if > @
      fork > if
  true.eo: |
    [^] > true
      bool > @
        [^]
          ? >> left
          ? >> right
          left > @
  false.eo: |
    [^] > false
      bool > @
        [^]
          ? >> left
          ? >> right
          right > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.flag.λ']/is[@loc='Φ.bool']
  - /answers/o[@loc='Φ.app.φ' and count(*)=2 and ./is[@loc='Φ.string']]/is[@loc='Φ.number']
  - /answers[not(o[starts-with(@loc, 'Φ.app') or starts-with(@loc, 'Φ.flag') or @loc='Φ.bool.v🌵fork']//unknown)]
