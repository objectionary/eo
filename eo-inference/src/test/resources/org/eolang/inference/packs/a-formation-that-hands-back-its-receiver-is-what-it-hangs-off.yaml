---
# yamllint disable rule:line-length
# mine is walked where it is written, inside tree, so its ^ holds the tree.
# Its @ gives that ^ back, so mine reduces to tree.
sources:
  tree.eo: |
    [] > tree
      [^] > mine
        ^ > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
facts: |
  <?xml version="1.0" encoding="UTF-8"?>
  <facts>
     <objects>
        <type bare="true" complete="false" id="Φ.bytes">
           <attr name="φ" type="Φ.bytes.φ" void="true"/>
        </type>
        <type bare="true" complete="false" id="Φ.number">
           <attr name="φ" type="Φ.number.φ" void="true"/>
        </type>
        <type bare="true" complete="false" id="Φ.string">
           <attr name="φ" type="Φ.string.φ" void="true"/>
        </type>
        <type bare="false" complete="true" id="Φ.tree">
           <attr name="mine" type="Φ.tree.mine"/>
        </type>
        <type bare="true" complete="false" id="Φ.tree.mine">
           <attr name="ρ" rho="Φ.tree" type="Φ.tree.mine.ρ" void="true"/>
           <attr name="φ" type="Φ.tree.mine.φ"/>
        </type>
        <type bare="false" complete="true" id="Φ">
           <attr name="bytes" type="Φ.bytes"/>
           <attr name="number" type="Φ.number"/>
           <attr name="string" type="Φ.string"/>
           <attr name="tree" type="Φ.tree"/>
        </type>
     </objects>
     <reads>
        <read id="Φ.tree.mine.φ" name="ρ" of="Φ.tree.mine.φ.ρ"/>
     </reads>
     <heads>
        <type id="Φ.tree.mine.φ.ρ">
           <ref loc="Φ.tree.mine"/>
        </type>
     </heads>
     <calls/>
  </facts>
answers: |
  <?xml version="1.0" encoding="UTF-8"?>
  <answers>
    <o loc="Φ" copies="1">
      <is loc="Φ"/>
    </o>
    <o loc="Φ.bytes" copies="1">
      <is loc="Φ.bytes"/>
      <reduced copies="1">
        <is loc="Φ.bytes"/>
      </reduced>
    </o>
    <o loc="Φ.bytes.φ" copies="1">
      <data/>
    </o>
    <o loc="Φ.number" copies="1">
      <is loc="Φ.number"/>
    </o>
    <o loc="Φ.number.φ" copies="1">
      <is loc="Φ.bytes"/>
    </o>
    <o loc="Φ.string" copies="1">
      <is loc="Φ.string"/>
    </o>
    <o loc="Φ.string.φ" copies="1">
      <is loc="Φ.bytes"/>
    </o>
    <o loc="Φ.tree" copies="1">
      <is loc="Φ.tree"/>
      <reduced copies="1">
        <is loc="Φ.tree"/>
      </reduced>
    </o>
    <o loc="Φ.tree.mine" copies="1">
      <is loc="Φ.tree.mine"/>
      <reduced copies="1">
        <is loc="Φ.tree"/>
      </reduced>
    </o>
    <o loc="Φ.tree.mine.ρ" copies="1">
      <is loc="Φ.tree"/>
    </o>
    <o loc="Φ.tree.mine.φ" copies="1">
      <is loc="Φ.tree"/>
    </o>
    <o loc="Φ.tree.mine.φ.ρ" copies="1">
      <is loc="Φ.tree"/>
    </o>
  </answers>
