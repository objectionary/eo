---
# yamllint disable rule:line-length
# alias is nothing but a @ that gives an oak, so box alias reduces it before
# it goes into item: alias reduces to oak, and item holds an oak, not an
# alias.
sources:
  oak.eo: |
    [] > oak
      [] > leaf
  alias.eo: |
    [] > alias
      oak > @
  box.eo: |
    [item] > box
  app.eo: |
    [] > app
      box alias > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.alias.φ']/is[@loc='Φ.oak']
  - /answers/o[@loc='Φ.app.φ.α0' and @lands='item']/is[@loc='Φ.oak']
  - /answers/o[@loc='Φ.alias']/reduced/is[@loc='Φ.oak']
  - /answers/o[@loc='Φ.box.item']/is[@loc='Φ.oak']
  - /answers[not(o[@loc='Φ.box.item']//is[@loc='Φ.alias'])]
