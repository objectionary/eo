# yamllint disable rule:line-length
# next reads start off ^, the copy of counter it is an attribute of, so the
# start it adds one to is the number the call put into counter.
sources:
  counter.eo: |
    [start] > counter
      [] > next
        ^.start.plus 1 > @
  app.eo: |
    [] > app
      clock.next > @
      counter 5 > clock
  number.eo: |
    [@] > number
      [] > plus /Q.number
        ? > ^
        ? > b /Q.number
  bytes.eo: |
    [@] > bytes
  string.eo: |
    [@] > string
