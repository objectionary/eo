---
# yamllint disable rule:line-length
# The copy of inner made inside the copy of outer as written has that copy as
# its ^. That copy has an empty void and nobody uses it, so it does not count,
# and neither does inner there: only the inner of the called outer is
# answered.
sources:
  outer.eo: |
    [size] > outer
      [] > inner
        ^.size > @
  app.eo: |
    [] > app
      (outer 3).inner > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
