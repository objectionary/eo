---
# yamllint disable rule:line-length
# The program has no nope, so the call app makes on it is T and makes no
# copy. The formation written as its argument goes into no object, so its ^
# is a void nobody fills.
sources:
  app.eo: |
    [] > app
      nope > @
        [^]
          5 > y
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.app.φ' and count(*)=1]/terminator
  - /answers/o[@loc='Φ.app.φ.α0.ρ' and count(*)=1]/unknown[@kind='empty']
