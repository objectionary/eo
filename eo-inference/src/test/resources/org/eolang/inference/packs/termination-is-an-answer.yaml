---
# yamllint disable rule:line-length
# dead is T, an error, and its answer is T, with nothing to follow.
sources:
  app.eo: |
    [] > app
      T > dead
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.app.dead']/terminator
  - /answers[not(o[starts-with(@loc, 'Φ.app.dead.')])]
