# yamllint disable rule:line-length
# half and twice are atoms that say they give a number, so each of the two
# copies of inc gets a number in its x, and first and second are numbers. The
# oak handed to each atom lands in its y.
sources:
  app.eo: |
    [] > app
      inc (half oak) > first
      inc (twice oak) > second
  inc.eo: |
    [x] > inc
      x > @
  half.eo: |
    [] > half /Q.number
      ? > y
  twice.eo: |
    [] > twice /Q.number
      ? > y
  number.eo: |
    [@] > number
  oak.eo: |
    [] > oak
  bytes.eo: |
    [@] > bytes
  string.eo: |
    [@] > string
