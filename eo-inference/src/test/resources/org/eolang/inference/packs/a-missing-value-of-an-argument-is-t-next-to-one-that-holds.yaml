---
# yamllint disable rule:line-length
# check returns a status with no brackets, and one and two put a cat and a
# bag into its stuff, so the thing read off what check returns is a cat or a
# bag, and size read off it is T on the cat, which has no size, and the size
# of the bag. The argument of box holds
# both and goes into item as it is, so item is T or the size of bag.
sources:
  os.eo: |
    [] > os
      [] > check /Q.os.status
      [stuff] > status
        stuff > @
        stuff > thing
  cat.eo: |
    [] > cat
  bag.eo: |
    [] > bag
      [] > size
  one.eo: |
    [] > one
      os.status cat > @
  two.eo: |
    [] > two
      os.status bag > @
  box.eo: |
    [item] > box
      item > @
  app.eo: |
    [] > app
      box os.check.thing.size > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.one.φ.α0' and @lands='v🌵stuff']/is[@loc='Φ.cat']
  - /answers/o[@loc='Φ.two.φ.α0' and @lands='v🌵stuff']/is[@loc='Φ.bag']
  - /answers/o[@loc='Φ.app.φ.α0.ρ' and ./is[@loc='Φ.cat'] and ./is[@loc='Φ.bag']]
  - /answers/o[@loc='Φ.app.φ.α0' and @lands='v🌵item' and terminator and count(*)=2]/is[@loc='Φ.bag.size']
  - /answers[not(o//fails)]
  - /answers/o[@loc='Φ.box.v🌵item' and terminator and count(*)=2]/is[@loc='Φ.bag.size']
