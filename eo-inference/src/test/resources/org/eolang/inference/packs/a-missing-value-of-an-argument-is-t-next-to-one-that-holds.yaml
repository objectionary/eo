---
# yamllint disable rule:line-length
# check returns a status whose stuff is a cat or a bag, so the thing read off
# what check returns is a cat or a bag, and size read off it is T on the cat,
# which has no size, and the size of the bag. The argument of box holds both
# and goes into item as it is, so item is T or the size of bag.
sources:
  os.eo: |
    [] > os
      [] > check /Q.os.status(Q.cat|Q.bag)
      [stuff] > status
        stuff > @
        stuff > thing
  cat.eo: |
    [] > cat
  bag.eo: |
    [] > bag
      [] > size
  box.eo: |
    [item] > box
      item > @
  app.eo: |
    [] > app
      box os.check.thing.size > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.os.status.v🌵stuff' and count(*)=2 and ./is[@loc='Φ.cat']]/is[@loc='Φ.bag']
  - /answers/o[@loc='Φ.app.φ.α0.ρ' and is[@loc='Φ.cat'] and is[@loc='Φ.bag']]
  - /answers/o[@loc='Φ.app.φ.α0' and @lands='v🌵item' and terminator and count(*)=2]/is[@loc='Φ.bag.size']
  - /answers[not(o//fails)]
  - /answers/o[@loc='Φ.box.v🌵item' and terminator and count(*)=2]/is[@loc='Φ.bag.size']
