---
# yamllint disable rule:line-length
# box is only ever handed a bell, so its body is a bell. crate is handed a
# bell by two and a chime by three, and each call has a copy of its own, so
# one copy of crate is a bell and the other a chime.
sources:
  bell.eo: |
    [] > bell
      [^] > ring
        01- > @
  chime.eo: |
    [] > chime
      [^] > ring
        02- > @
  box.eo: |
    [item] > box
      item > @
  crate.eo: |
    [thing] > crate
      thing > @
  one.eo: |
    [] > one
      box bell > @
  two.eo: |
    [] > two
      crate bell > @
  three.eo: |
    [] > three
      crate chime > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
