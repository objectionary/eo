---
# yamllint disable rule:line-length
# A binding by slot number puts the argument into the void at that slot:
# pair 5:1 puts 5 into b, the @ of pair, so app is a number.
sources:
  pair.eo: |
    [a b] > pair
      b > @
  app.eo: |
    [] > app
      pair 5:1 > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.app.φ.α1' and @lands='b']/is[@loc='Φ.number']
  - /answers[not(o[@lands='a'])]
  - /answers/o[@loc='Φ.app.φ']/is[@loc='Φ.number']
