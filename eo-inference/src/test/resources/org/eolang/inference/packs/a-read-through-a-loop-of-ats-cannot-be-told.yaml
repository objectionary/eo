  app.eo: |
    [] > app
      one.nowhere > @
  one.eo: |
    [] > one
      two > @
  two.eo: |
    [] > two
      one > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
