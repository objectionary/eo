---
# yamllint disable rule:line-length
# The atom check returns a status with a number in its code and a string in
# its note. So the text read off what check returns is a string, and the @ of
# that status is a number, with no unknown next to them. report calls status
# with 0 and "ok" in a copy of its own.
sources:
  os.eo: |
    [] > os
      [] > check /Q.os.status(Q.number,Q.string)
      [code note] > status
        code > @
        note > text
  app.eo: |
    [] > app
      os.check.text > @
  report.eo: |
    [] > report
      os.status 0 "ok" > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
facts:
  - /facts/objects/type[@id='Φ.os.check' and @returns='Φ.os.status(Φ.number,Φ.string)']
answers:
  - /answers/o[@loc='Φ.os.check.λ']/is[@loc='Φ.os.status(Φ.number,Φ.string)']
  - /answers/o[@loc='Φ.report.φ.α1' and @lands='v🌵note']/is[@loc='Φ.string']
  - /answers/o[@loc='Φ.app.φ.ρ']/is[@loc='Φ.os.status']
  - /answers/o[@loc='Φ.app.φ' and count(*)=1]/is[@loc='Φ.string']
  - /answers/o[@loc='Φ.os.status.v🌵note' and count(*)=1]/is[@loc='Φ.string']
  - /answers/o[@loc='Φ.os.status.v🌵code' and count(*)=1]/is[@loc='Φ.number']
  - /answers/o[@loc='Φ.os.status.φ' and count(*)=1]/is[@loc='Φ.number']
  - /answers[not(//unknown)]
