---
# yamllint disable rule:line-length
# One call fills the void of box with a number and another with a string. The
# calls never mix, so each copy of box holds one of them, and the void is both.
sources:
  box.eo: |
    [item] > box
      item > @
  numbers.eo: |
    [] > numbers
      box 42 > @
  words.eo: |
    [] > words
      box "hello" > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.numbers.φ.α0' and @lands='item']/is[@loc='Φ.number']
  - /answers/o[@loc='Φ.words.φ.α0' and @lands='item']/is[@loc='Φ.string']
  - /answers[not(o[@loc='Φ.box.item']/set[is[@loc='Φ.number'] and is[@loc='Φ.string']])]
  - /answers/o[@loc='Φ.box.item' and @copies='2']/set[@copies='1']/is[@loc='Φ.number']
  - /answers/o[@loc='Φ.box.item' and @copies='2']/set[@copies='1']/is[@loc='Φ.string']
