    [item] > box
      item > @
  numbers.eo: |
    [] > numbers
      box 42 > @
  words.eo: |
    [] > words
      box "hello" > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
