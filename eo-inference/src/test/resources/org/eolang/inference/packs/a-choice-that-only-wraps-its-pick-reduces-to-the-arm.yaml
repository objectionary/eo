---
# yamllint disable rule:line-length
# This choice has nothing but pick and a @ that gives it, unlike the bool of
# eo-runtime, which has and, not and or next to its if. So choice is a
# decorator: yes and no reduce through it to the arm each hands in. The @ of
# that arm reads a void nobody fills, so the void and the @ are both unknown.
sources:
  choice.eo: |
    [pick] > choice
      pick > @
  yes.eo: |
    [^] > yes
      choice > @
        [^]
          ? > left
          ? > right
          left > @
  no.eo: |
    [^] > no
      choice > @
        [^]
          ? > left
          ? > right
          right > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.yes.φ']/is[@loc='Φ.yes.φ.α0']
  - /answers/o[@loc='Φ.no.φ']/is[@loc='Φ.no.φ.α0']
  - /answers/o[@loc='Φ.yes.φ.α0.v🌵left']/unknown
  - /answers/o[@loc='Φ.no.φ.α0.v🌵right']/unknown
  - /answers/o[@loc='Φ.choice']/reduced/set/is[@loc='Φ.yes.φ.α0']
  - /answers/o[@loc='Φ.choice']/reduced/set/is[@loc='Φ.no.φ.α0']
  - /answers/o[@loc='Φ.yes.φ.α0.φ']/unknown
  - /answers/o[@loc='Φ.no.φ.α0.φ']/unknown
