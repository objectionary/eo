---
# yamllint disable rule:line-length
# At first nothing calls status, so a stop decides Java alone fills its note.
# The text read off what check returns gives that note, so it is unknown,
# filled by Java.
# Nobody calls late, so a later stop keeps its copy as written, and its call
# of status puts "late" into the pool: the text is a string as well, next to
# that unknown.
sources:
  os.eo: |
    [] > os
      [] > check /Q.os.status
      [code note] > status
        code > @
        note > text
  app.eo: |
    [] > app
      os.check.text > @
  late.eo: |
    [x] > late
      os.status 0 "late" > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.os.status.v🌵note']/set[not(is)]/unknown[@kind='java']
  - /answers/o[@loc='Φ.app.φ.ρ']/is[@loc='Φ.os.status']
  - /answers/o[@loc='Φ.app.φ']/unknown[@kind='java']
  - /answers/o[@loc='Φ.late.φ.α1' and @lands='v🌵note']/is[@loc='Φ.string']
  - /answers/o[@loc='Φ.app.φ' and unknown[@kind='java']]/is[@loc='Φ.string']
