---
# yamllint disable rule:line-length
# grip calls hold back with an oak and grasp with an elm, each in a copy of
# its own, so m is an oak in one and an elm in the other. choice has a not
# besides its pick, as bool does, so first, with yes, picks dial 03-, and
# second, with no, picks the arm ^.m. Both copies of hold make pick at one
# place and share that copy, so second is an oak and an elm at once.
sources:
  choice.eo: |
    [pick] > choice
      pick > @
      [] > not
        ^.pick no yes > @
  yes.eo: |
    [^] > yes
      choice > @
        [^]
          ? >> left
          ? >> right
          left > @
  no.eo: |
    [^] > no
      choice > @
        [^]
          ? >> left
          ? >> right
          right > @
  dial.eo: |
    [^ sys] > dial
  oak.eo: |
    [] > oak
  elm.eo: |
    [] > elm
  grip.eo: |
    [] > grip /Q.bytes
      ? > scope /{Q.oak}
  grasp.eo: |
    [] > grasp /Q.bytes
      ? > scope /{Q.elm}
  app.eo: |
    [] > app
      grip hold > one
      grasp hold > two
      [m] > hold
        [^ flag] > pick
          flag.pick > @
            dial 03-
            ^.m
        pick yes > first
        pick no > second
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.app.hold' and @copies='2']
  - /answers/o[@loc='Φ.app.hold.m']/set[not(is[@loc='Φ.elm'])]/is[@loc='Φ.oak']
  - /answers/o[@loc='Φ.app.hold.m']/set[not(is[@loc='Φ.oak'])]/is[@loc='Φ.elm']
  - /answers/o[@loc='Φ.app.hold.first']/is[@loc='Φ.dial']
  - /answers/o[@loc='Φ.app.hold.pick' and @copies='2']
  - /answers/o[@loc='Φ.app.hold.second'][is[@loc='Φ.oak'] and is[@loc='Φ.elm']]
