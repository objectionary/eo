---
# yamllint disable rule:line-length
# alias is nothing but a @ that gives an oak, so it reduces to oak, and the @
# of second, which reads alias, is an oak too.
sources:
  oak.eo: |
    [] > oak
      [] > leaf
  alias.eo: |
    [] > alias
      oak > @
  second.eo: |
    [] > second
      alias > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
facts: |
  <?xml version="1.0" encoding="UTF-8"?>
  <facts>
     <objects>
        <type bare="true" complete="false" id="Φ.alias">
           <attr name="φ" type="Φ.alias.φ"/>
        </type>
        <type bare="true" complete="false" id="Φ.bytes">
           <attr name="φ" type="Φ.bytes.φ" void="true"/>
        </type>
        <type bare="true" complete="false" id="Φ.number">
           <attr name="φ" type="Φ.number.φ" void="true"/>
        </type>
        <type bare="false" complete="true" id="Φ.oak">
           <attr name="leaf" type="Φ.oak.leaf"/>
        </type>
        <type bare="true" complete="true" id="Φ.oak.leaf"/>
        <type bare="true" complete="false" id="Φ.second">
           <attr name="φ" type="Φ.second.φ"/>
        </type>
        <type bare="true" complete="false" id="Φ.string">
           <attr name="φ" type="Φ.string.φ" void="true"/>
        </type>
        <type bare="false" complete="true" id="Φ">
           <attr name="alias" type="Φ.alias"/>
           <attr name="bytes" type="Φ.bytes"/>
           <attr name="number" type="Φ.number"/>
           <attr name="oak" type="Φ.oak"/>
           <attr name="second" type="Φ.second"/>
           <attr name="string" type="Φ.string"/>
        </type>
     </objects>
     <reads>
        <read id="Φ.alias.φ" name="oak" of="Φ.alias.φ.ρ"/>
        <read id="Φ.second.φ" name="alias" of="Φ.second.φ.ρ"/>
     </reads>
     <heads>
        <type id="Φ.alias.φ.ρ">
           <ref loc="Φ"/>
        </type>
        <type id="Φ.second.φ.ρ">
           <ref loc="Φ"/>
        </type>
     </heads>
     <calls/>
  </facts>
answers: |
  <?xml version="1.0" encoding="UTF-8"?>
  <answers>
    <o loc="Φ" copies="1">
      <is loc="Φ"/>
    </o>
    <o loc="Φ.alias" copies="2">
      <is loc="Φ.alias"/>
      <reduced copies="1">
        <is loc="Φ.oak"/>
      </reduced>
    </o>
    <o loc="Φ.alias.φ" copies="2">
      <is loc="Φ.oak"/>
    </o>
    <o loc="Φ.alias.φ.ρ" copies="2">
      <is loc="Φ"/>
    </o>
    <o loc="Φ.bytes" copies="1">
      <is loc="Φ.bytes"/>
      <reduced copies="1">
        <is loc="Φ.bytes"/>
      </reduced>
    </o>
    <o loc="Φ.bytes.φ" copies="1">
      <data/>
    </o>
    <o loc="Φ.number" copies="1">
      <is loc="Φ.number"/>
    </o>
    <o loc="Φ.number.φ" copies="1">
      <is loc="Φ.bytes"/>
    </o>
    <o loc="Φ.oak" copies="2">
