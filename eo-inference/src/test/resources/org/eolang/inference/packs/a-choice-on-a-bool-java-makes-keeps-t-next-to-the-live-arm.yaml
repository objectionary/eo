---
# yamllint disable rule:line-length
# exists returns a true or a false, and Java makes a copy of each. So the if
# in temp reads both arms, leaf "tmp" and T, and temp is a leaf or T, with no
# unknown. So is the file of outer, which inner.temp fills, while the file of
# inner is the leaf "a" alone.
sources:
  leaf.eo: |
    [path] > leaf
      path > @
      [] > exists /Q.true|Q.false
        ? > ^
  dir.eo: |
    [file] > dir
      file > @
      file.exists > there
      [^] > temp
        ^.exists.if > @
          leaf "tmp"
          T
            "no such dir"
  app.eo: |
    [] > app
      outer.temp > @
      dir > outer
        inner.temp
      dir > inner
        leaf "a"
  bool.eo: |
    [fork] > bool
      if > @
      fork > if
      [] > not
        ^.if false true > @
  true.eo: |
    [^] > true
      bool > @
        [^]
          ? >> left
          ? >> right
          left > @
  false.eo: |
    [^] > false
      bool > @
        [^]
          ? >> left
          ? >> right
          right > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.leaf.exists.λ' and ./is[@loc='Φ.true']]/is[@loc='Φ.false']
  - /answers/o[@loc='Φ.dir.temp.φ' and terminator]/is[@loc='Φ.leaf']
  - /answers/o[@loc='Φ.dir.temp']/reduced[terminator]/is[@loc='Φ.leaf']
  - /answers/o[@loc='Φ.app.outer.α0' and @lands='v🌵file' and terminator]/is[@loc='Φ.leaf']
  - /answers/o[@loc='Φ.app.inner.α0' and @lands='v🌵file']/is[@loc='Φ.leaf']
  - /answers[not(o[@loc='Φ.app.inner.α0']/terminator)]
  - /answers[not(o[starts-with(@loc, 'Φ.dir') or starts-with(@loc, 'Φ.app')]//unknown)]
