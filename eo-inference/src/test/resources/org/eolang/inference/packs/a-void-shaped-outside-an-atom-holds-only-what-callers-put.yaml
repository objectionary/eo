---
# yamllint disable rule:line-length
# The fork of bool declares the shape of what fills it, Φ.bool.choice, while
# bool is no atom, so Java fills nothing there. The row keeps the type as the
# shape of the void, not as what it holds, and the walk answers the if read
# off true and false with what they put there, never with a copy of choice.
sources:
  app.eo: |
    [] > app
      true.if "yes" 42 > @
  bool.eo: |
    [] > bool
      ? > fork /Q.bool.choice
      if > @
      fork > if
      [left right] > choice
  true.eo: |
    [^] > true
      bool > @
        [^]
          ? > left
          ? > right
          left > @
  false.eo: |
    [^] > false
      bool > @
        [^]
          ? > left
          ? > right
          right > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
facts:
  - /facts/objects/type[@id='Φ.bool']/attr[@name='v🌵fork' and @shape='Φ.bool.choice' and not(@holds)]
answers:
  - /answers/o[@loc='Φ.app.φ' and count(*)=1]/is[@loc='Φ.string']
  - /answers/o[@loc='Φ.bool.if' and count(set)=2 and not(.//is[@loc='Φ.bool.choice'])]
