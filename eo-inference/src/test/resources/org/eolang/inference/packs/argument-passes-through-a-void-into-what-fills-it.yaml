---
# yamllint disable rule:line-length
# as-ascii calls its void cant-read with an oak. app fills cant-read with a
# formation whose void is message, so the oak lands in message, and as-ascii
# and the @ of app are the string that formation gives.
sources:
  as-ascii.eo: |
    [^ cant-read] > as-ascii
      cant-read oak > @
  oak.eo: |
    [] > oak
  app.eo: |
    [] > app
      as-ascii > @
        "bar" > [message]
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
