# yamllint disable rule:line-length
# inc is called with a t, so its x is a t and x.next is t.next. That next has
# nothing in it, so the foo read off it fails, and the @ of inc names the
# missing foo.
sources:
  app.eo: |
    [] > app
      inc t > @
      [] > t
        [] > next
      [x] > inc
        x.next.foo > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
