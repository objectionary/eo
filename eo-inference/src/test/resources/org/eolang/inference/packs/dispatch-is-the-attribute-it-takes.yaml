---
# yamllint disable rule:line-length
# outer has held, so the held read off outer is outer.held, and that is the @
# of app.
sources:
  app.eo: |
    [] > app
      outer.held > @
  outer.eo: |
    [] > outer
      [] > held
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.app.φ.ρ']/is[@loc='Φ.outer']
  - /answers/o[@loc='Φ.app.φ']/is[@loc='Φ.outer.held']
