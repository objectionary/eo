---
# yamllint disable rule:line-length
# The buffer of send declares no type, and the call hands it a string. The
# atom still says it gives a number, so after the const marker and as-number,
# eq is read off a number.
sources:
  posix.eo: |
    [name args] > posix
      [] > @ /Q.posix.return
        ? > ^
      [^ code output] > return
        output > @
      [] > send /Q.number
        ? > descriptor /Q.number
        ? > buffer
        ? > size /Q.number
        ? > flags /Q.number
  app.eo: |
    [] > app
      [] > sys
        posix.send > send
      as-number. > sent
        sys.send 3 "ab" 2 0 >>!
      sent.eq -1 > @
  dataized.eo: |
    [x] > dataized
      x > @
  number.eo: |
    [@] > number
      [] > as-bytes /Q.bytes
        ? > ^
      [b] > eq
  string.eo: |
    [@] > string
  bytes.eo: |
    [@] > bytes
      [] > as-number /Q.number
