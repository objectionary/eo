  app.eo: |
    [] > app
      reader.raw.eq > @
  reader.eo: |
    [] > reader /Q.bytes
      ? > code /Q.number
      ? > raw
  number.eo: |
    [@] > number
      [x] > eq
        x > @
  bytes.eo: |
    [@] > bytes
  string.eo: |
    [@] > string
