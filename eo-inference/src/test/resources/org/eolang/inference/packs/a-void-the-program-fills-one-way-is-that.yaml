---
# yamllint disable rule:line-length
# The only call of inc fills x with an oak, so x is an oak, and x.leaf, the @
# of inc and the @ of app are the leaf of an oak.
sources:
  app.eo: |
    [] > app
      inc oak > @
  inc.eo: |
    [x] > inc
      x.leaf > @
  oak.eo: |
    [] > oak
      [] > leaf
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
