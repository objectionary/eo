---
# yamllint disable rule:line-length
# trunk has a bark of its own next to the @ that gives an oak, so it is no
# decorator: box trunk puts trunk into item as itself, and trunk reduces to
# trunk.
sources:
  oak.eo: |
    [] > oak
      [] > leaf
  trunk.eo: |
    [] > trunk
      oak > @
      [] > bark
  box.eo: |
    [item] > box
  app.eo: |
    [] > app
      box trunk > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
