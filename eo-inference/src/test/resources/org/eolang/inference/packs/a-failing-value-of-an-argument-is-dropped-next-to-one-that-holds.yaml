---
# yamllint disable rule:line-length
# one and two put a cat and a bag into the pool of thing, so the thing read
# off what check returns is a cat or a bag, and size read off it fails on the
# cat and is the size of the bag. The argument of box holds both, and the
# failing one is dropped where it goes into item (rule 3), so item is the size
# of bag alone.
sources:
  os.eo: |
    [] > os
      [] > check /Q.os.status
      [thing] > status
        thing > @
  cat.eo: |
    [] > cat
  bag.eo: |
    [] > bag
      [] > size
  one.eo: |
    [] > one
      os.status cat > @
  two.eo: |
    [] > two
      os.status bag > @
  box.eo: |
    [item] > box
      item > @
  app.eo: |
    [] > app
      box os.check.thing.size > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
