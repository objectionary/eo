---
# yamllint disable rule:line-length
# one and two put a cat and a bag into the pool of thing, so the thing read
# off what check returns is a cat or a bag, and size read off it fails on the
# cat and is the size of the bag. The argument of box holds both, and the
# failing one is dropped where it goes into item (rule 3), so item is the size
# of bag alone.
sources:
  os.eo: |
    [] > os
      [] > check /Q.os.status
      [thing] > status
        thing > @
  cat.eo: |
    [] > cat
  bag.eo: |
    [] > bag
      [] > size
  one.eo: |
    [] > one
      os.status cat > @
  two.eo: |
    [] > two
      os.status bag > @
  box.eo: |
    [item] > box
      item > @
  app.eo: |
    [] > app
      box os.check.thing.size > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.one.φ.α0' and @lands='thing']/is[@loc='Φ.cat']
  - /answers/o[@loc='Φ.two.φ.α0' and @lands='thing']/is[@loc='Φ.bag']
  - /answers/o[@loc='Φ.app.φ.α0.ρ' and is[@loc='Φ.cat'] and is[@loc='Φ.bag']]
  - /answers/o[@loc='Φ.app.φ.α0']/fails[@name='Φ.cat.size']
  - /answers/o[@loc='Φ.app.φ.α0' and @lands='item']/is[@loc='Φ.bag.size']
  - /answers[not(o[@loc='Φ.box.item']/fails)]
  - /answers/o[@loc='Φ.box.item' and count(*)=1]/is[@loc='Φ.bag.size']
