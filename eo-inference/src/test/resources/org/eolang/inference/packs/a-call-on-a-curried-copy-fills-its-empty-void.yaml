---
# yamllint disable rule:line-length
# foo 1 fills x and leaves y empty, so f is a copy of foo: only the call that
# fills the last empty void answers what goes into x. f 2 is that call: it
# puts 2 into y and answers the 1 in x, so ff is a number.
# Nobody reads anything off f itself, so its copy, where y is still empty,
# does not count: foo has one copy, the one f 2 makes, y holds a number
# there, and f is named by its formation, Φ.foo.
sources:
  foo.eo: |
    [x y] > foo
      x > @
  bar.eo: |
    [] > bar
      foo 1 > f
      f 2 > ff
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.bar.f.α0' and @lands='v🌵x']/is[@loc='Φ.number']
  - /answers/o[@loc='Φ.bar.ff.α0' and @lands='v🌵y']/is[@loc='Φ.number']
  - /answers/o[@loc='Φ.bar.ff']/is[@loc='Φ.number']
  - /answers/o[@loc='Φ.bar.f']/is[@loc='Φ.foo']
  - /answers/o[@loc='Φ.foo' and @copies='1']
  - /answers/o[@loc='Φ.foo.v🌵y' and count(*)=1]/is[@loc='Φ.number']
