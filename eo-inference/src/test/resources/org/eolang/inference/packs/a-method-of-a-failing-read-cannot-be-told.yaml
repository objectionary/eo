---
# yamllint disable rule:line-length
# gauge declares no ^ and sits at the top, so ^.seconds is read off Φ and
# fails. times read off that cannot be told, and neither can the @ of gauge.
sources:
  gauge.eo: |
    [] > gauge
      times. > @
        ^.seconds
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers[not(o[@loc='Φ.gauge.ρ'])]
  - /answers/o[@loc='Φ.gauge.φ.ρ.ρ']/is[@loc='Φ']
  - /answers/o[@loc='Φ.gauge.φ.ρ']/fails[@name='Φ.seconds']
  - /answers/o[@loc='Φ.gauge.φ']/unknown
  - /answers[not(o[@loc='Φ.gauge.φ']/is)]
