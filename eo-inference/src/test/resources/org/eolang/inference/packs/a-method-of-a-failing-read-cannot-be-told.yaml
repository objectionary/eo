---
# yamllint disable rule:line-length
# The program has no nope, so nope read off Φ fails. times read off that
# cannot be told, and neither can the @ of app. Whether a method of a
# failing read should be T instead is still open (#9654).
sources:
  app.eo: |
    [] > app
      nope.times > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.app.φ.ρ.ρ']/is[@loc='Φ']
  - /answers/o[@loc='Φ.app.φ.ρ']/fails[@name='Φ.nope']
  - /answers/o[@loc='Φ.app.φ']/unknown
  - /answers[not(o[@loc='Φ.app.φ']/is)]
