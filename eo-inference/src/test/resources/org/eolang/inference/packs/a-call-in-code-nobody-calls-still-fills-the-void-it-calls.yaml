---
# yamllint disable rule:line-length
# Nobody calls helper, so a stop keeps its copy as written, with x unknown.
# Its call box 5 counts like any other call, so the copy of box it makes holds
# a number in item. Only helper calls box, so box waits until helper is
# walked, and by then it has that copy: its copy as written is not kept, and
# item is a number with nothing unknown.
sources:
  box.eo: |
    [item] > box
      item > @
  helper.eo: |
    [x] > helper
      box 5 > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.helper.v🌵x' and @copies='1']/unknown
  - /answers/o[@loc='Φ.helper.φ.α0' and @lands='v🌵item']/is[@loc='Φ.number']
  - /answers/o[@loc='Φ.box.v🌵item']/is[@loc='Φ.number']
  - /answers/o[@loc='Φ.box' and @copies='1']/reduced/is[@loc='Φ.number']
  - /answers[not(o[starts-with(@loc, 'Φ.box')]//unknown)]
