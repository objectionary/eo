---
# yamllint disable rule:line-length
# Nobody calls helper, so a stop keeps its copy as written, with x unknown.
# Its call box 5 counts like any other call, so the copy of box it makes holds
# a number in item. Nobody else calls box, so its copy as written is kept as
# well, and item is unknown there.
sources:
  box.eo: |
    [item] > box
      item > @
  helper.eo: |
    [x] > helper
      box 5 > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.helper.v🌵x' and @copies='1']/unknown
  - /answers/o[@loc='Φ.helper.φ.α0' and @lands='v🌵item']/is[@loc='Φ.number']
  - /answers/o[@loc='Φ.box.v🌵item']/set/is[@loc='Φ.number']
  - /answers/o[@loc='Φ.box' and @copies='2']/reduced/set/is[@loc='Φ.box']
  - /answers/o[@loc='Φ.box.v🌵item']/set/unknown
