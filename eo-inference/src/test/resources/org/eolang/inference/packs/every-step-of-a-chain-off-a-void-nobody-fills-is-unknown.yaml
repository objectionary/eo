---
# yamllint disable rule:line-length
# Nobody calls clock, so x is unknown, and each step of the chain read off it,
# seconds and then times, gets a place of its own and is unknown too.
sources:
  clock.eo: |
    [x] > clock
      x.seconds.times > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.clock.v🌵x']/unknown
  - /answers/o[@loc='Φ.clock.φ.ρ']/unknown
  - /answers/o[@loc='Φ.clock.φ']/unknown
