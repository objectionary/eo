---
# yamllint disable rule:line-length
# kettle and cup sit in two files and are answered together, each attribute
# under the object of its own file.
sources:
  kettle.eo: |
    [] > kettle
      [] > steam
  cup.eo: |
    [] > cup
      [] > handle
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.kettle.steam']/is[@loc='Φ.kettle.steam']
  - /answers/o[@loc='Φ.cup.handle']/is[@loc='Φ.cup.handle']
