# yamllint disable rule:line-length
# sum reads x and y off ^, the copy of point the call in app made, so both are
# numbers there and so is what plus gives.
sources:
  point.eo: |
    [x y] > point
      [] > sum
        ^.x.plus ^.y > @
  app.eo: |
    [] > app
      (point 1 2).sum > @
  number.eo: |
    [@] > number
      [] > plus /Q.number
        ? > ^
        ? > b /Q.number
  bytes.eo: |
    [@] > bytes
  string.eo: |
    [@] > string
