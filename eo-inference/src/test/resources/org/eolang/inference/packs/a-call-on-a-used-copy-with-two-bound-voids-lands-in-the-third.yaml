---
# The mark of foo 1 2 must keep the two bound voids. The next call fills z.
sources:
  foo.eo: |
    [x y z] > foo
      x > @
  fin.eo: |
    [f] > fin
      f 3 > @
      f.plus 0 > read
  app.eo: |
    [] > app
      fin (foo 1 2) > @
  number.eo: |
    [@] > number
      [^ item] > plus
        ^ > @
answers:
  - /answers/o[@loc='Φ.app.φ.α0.α0' and @lands='v🌵x']
  - /answers/o[@loc='Φ.app.φ.α0.α1' and @lands='v🌵y']
  - /answers/o[@loc='Φ.fin.φ.α0' and @lands='v🌵z']
  - /answers/o[@loc='Φ.foo.v🌵z']//is[@loc='Φ.number']
  - /answers/o[@loc='Φ.fin.φ']/is[@loc='Φ.number']
