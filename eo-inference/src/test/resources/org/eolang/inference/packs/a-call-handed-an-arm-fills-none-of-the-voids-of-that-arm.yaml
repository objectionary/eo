---
# yamllint disable rule:line-length
# Nobody calls both, so it is studied in each copy of choice, with x open.
# ^.grip x lands in the left of the arm yes or no puts into pick, T lands in
# its right, and only x lands in the size of grip. With yes, both cannot be
# told, since x is open; with no, it is T.
sources:
  choice.eo: |
    [pick] > choice
      [^ size] > grip
        size > @
      ^.pick > [^ x] > both
        ^.grip x
        T
          "cannot make a grip"
  yes.eo: |
    [^] > yes
      choice > @
        [^ left right]
          left > @
  no.eo: |
    [^] > no
      choice > @
        [^ left right]
          right > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
