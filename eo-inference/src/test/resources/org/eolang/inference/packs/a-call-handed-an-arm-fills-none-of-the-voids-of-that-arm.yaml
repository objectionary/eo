---
# yamllint disable rule:line-length
# Nobody calls both, so it is studied in each copy of choice, with x open.
# ^.grip x lands in the left of the arm yes or no puts into pick, T lands in
# its right, and only x lands in the size of grip. With yes, both cannot be
# told, since x is open; with no, it is T.
sources:
  choice.eo: |
    [pick] > choice
      [^ size] > grip
        size > @
      ^.pick > [^ x] > both
        ^.grip x
        T
          "cannot make a grip"
  yes.eo: |
    [^] > yes
      choice > @
        [^ left right]
          left > @
  no.eo: |
    [^] > no
      choice > @
        [^ left right]
          right > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.choice.both' and @copies='2']/is[@loc='Φ.choice.both']
  - /answers/o[@loc='Φ.choice.both.x']/open
  - /answers/o[@loc='Φ.choice.both.φ.α0' and @lands='left']
  - /answers/o[@loc='Φ.choice.both.φ.α1' and @lands='right']/terminator
  - /answers/o[@loc='Φ.choice.both.φ.α0.α0' and @lands='size']/open
  - /answers[not(o[@lands='size' and @loc!='Φ.choice.both.φ.α0.α0'])]
  - /answers/o[@loc='Φ.choice.both.φ']/set[@copies='1']/unknown
  - /answers/o[@loc='Φ.choice.both.φ']/set[@copies='1']/terminator
