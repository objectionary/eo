---
# yamllint disable rule:line-length
# pair "one":b 2:a names both voids out of their order, so the string goes
# into b and 2 into a. The @ of pair is b, so app is a string.
sources:
  pair.eo: |
    [a b] > pair
      b > @
  app.eo: |
    [] > app
      pair "one":b 2:a > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.app.φ.v🌵b' and @lands='v🌵b']/is[@loc='Φ.string']
  - /answers/o[@loc='Φ.app.φ.v🌵a' and @lands='v🌵a']/is[@loc='Φ.number']
  - /answers/o[@loc='Φ.pair.v🌵b']/is[@loc='Φ.string']
  - /answers/o[@loc='Φ.pair.v🌵a']/is[@loc='Φ.number']
  - /answers/o[@loc='Φ.app.φ']/is[@loc='Φ.string']
