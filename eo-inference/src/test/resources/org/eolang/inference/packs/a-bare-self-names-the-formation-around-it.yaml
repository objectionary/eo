    [] > app
      oak > tree
      $ > me
      me.tree > t
  oak.eo: |
    [] > oak
      [] > leaf
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
