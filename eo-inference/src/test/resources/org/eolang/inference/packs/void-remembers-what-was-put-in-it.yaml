---
# yamllint disable rule:line-length
# app hands inc an oak, so in the one copy of inc, x holds an oak, and so does
# its @.
sources:
  app.eo: |
    [] > app
      inc oak > @
  inc.eo: |
    [x] > inc
      x > @
  oak.eo: |
    [] > oak
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.app.φ.α0' and @lands='x']/is[@loc='Φ.oak']
  - /answers/o[@loc='Φ.inc.x' and @copies='1']/is[@loc='Φ.oak']
  - /answers/o[@loc='Φ.inc.φ' and @copies='1']/is[@loc='Φ.oak']
