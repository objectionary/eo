---
# yamllint disable rule:line-length
# lamp declares its ^, so the ^ holds the copy of shelf lamp sits in, and
# ^.wick is the wick of that shelf, a number.
sources:
  shelf.eo: |
    [] > shelf
      7 > wick
      [^] > lamp
        ^.wick > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.shelf.lamp.φ.ρ']/is[@loc='Φ.shelf']
  - /answers/o[@loc='Φ.shelf.lamp.φ']/is[@loc='Φ.number']
  - /answers[not(o[@loc='Φ.shelf.lamp.φ']//terminator)]
