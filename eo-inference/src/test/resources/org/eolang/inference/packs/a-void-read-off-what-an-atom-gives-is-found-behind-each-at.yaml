---
# yamllint disable rule:line-length
# hold is an atom that gives back its value or its alternative, so held is a
# step or a number. pick has same next to its @, so it is no bare wrapper, and
# pick 7 in maker is a pick whose m is 7. A step has no m, so m is read off
# its @, the pass of that maker, and gives the number in m. The alternative 0
# is a number, and m read off it fails.
sources:
  pick.eo: |
    [m] > pick
      m > @
      [] > same
        ^.m > @
  maker.eo: |
    [] > maker
      pick 7 > pass
  hold.eo: |
    [] > hold /A
      ? > value /A?
      ? > alternative /A
  step.eo: |
    [] > step
      hold > inner
        maker
        0
      inner.pass > @
  app.eo: |
    [] > app
      hold > held
        step
        0
      held.m > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
