---
# yamllint disable rule:line-length
# The atom half says it gives a number, so the plus read off half is
# number.plus, though half itself has no plus.
sources:
  app.eo: |
    [] > app
      half.plus > @
  half.eo: |
    [] > half /Q.number
      ? > x
  number.eo: |
    [@] > number
      [] > plus
  bytes.eo: |
    [@] > bytes
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.half.λ']/is[@loc='Φ.number']
  - /answers/o[@loc='Φ.app.φ']/is[@loc='Φ.number.plus']
  - /answers[not(o[@loc='Φ.half.plus'])]
