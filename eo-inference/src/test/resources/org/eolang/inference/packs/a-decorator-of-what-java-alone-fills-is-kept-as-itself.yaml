---
# yamllint disable rule:line-length
# Java makes wrapper, and the annotation of wrap does not type its v, so v
# reads the unknown only Java fills. The @ of wrapper then gives nothing typed,
# so it waits for a stop (rule e) and is kept as itself.
sources:
  os.eo: |
    [] > os
      [] > wrap /Q.os.wrapper
      [v] > wrapper
        v > @
  box.eo: |
    [item] > box
      item > @
  app.eo: |
    [] > app
      box (box os.wrap) > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.os.wrap.λ']/is[@loc='Φ.os.wrapper']
  - /answers[not(o[@lands='v🌵v'])]
  - /answers/o[@loc='Φ.os.wrapper.v🌵v']/unknown[@kind='java']
  - /answers/o[@loc='Φ.os.wrapper.φ']/unknown[@kind='java']
  - /answers/o[@loc='Φ.os.wrapper']/reduced/is[@loc='Φ.os.wrapper']
