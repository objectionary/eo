# yamllint disable rule:line-length
# Java makes wrapper, and nothing in EO puts anything into its v, so a stop
# decides Java alone fills it. The @ of wrapper then gives nothing typed, so
# it waits for one more stop (rule e) and is kept as itself.
sources:
  os.eo: |
    [] > os
      [] > wrap /Q.os.wrapper
      [v] > wrapper
        v > @
  box.eo: |
    [item] > box
      item > @
  app.eo: |
    [] > app
      box (box os.wrap) > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
