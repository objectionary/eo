        <type bare="true" complete="true" id="Φ.oak"/>
        <type bare="true" complete="false" id="Φ.string">
           <attr name="φ" type="Φ.string.φ" void="true"/>
        </type>
        <type bare="false" complete="true" id="Φ">
           <attr name="app" type="Φ.app"/>
           <attr name="bytes" type="Φ.bytes"/>
           <attr name="grip" type="Φ.grip"/>
           <attr name="number" type="Φ.number"/>
           <attr name="oak" type="Φ.oak"/>
           <attr name="string" type="Φ.string"/>
        </type>
     </objects>
     <reads>
        <read id="Φ.app.φ" name="grip" of="Φ.app.φ.ρ"/>
        <read id="Φ.app.φ.α0" name="hold" of="Φ.app.φ.α0.ρ"/>
        <read id="Φ.app.twin" name="grip" of="Φ.app.twin.ρ"/>
        <read id="Φ.app.twin.α0" name="pick" of="Φ.app.twin.α0.ρ"/>
        <read id="Φ.grip.φ" name="scope" of="Φ.grip.φ.ρ"/>
        <read id="Φ.grip.φ.α0" name="oak" of="Φ.grip.φ.α0.ρ"/>
     </reads>
     <heads>
        <type id="Φ.app.φ.ρ">
           <ref loc="Φ"/>
        </type>
        <type id="Φ.app.φ.α0.ρ">
           <ref loc="Φ.app"/>
        </type>
        <type id="Φ.app.twin.ρ">
           <ref loc="Φ"/>
        </type>
        <type id="Φ.app.twin.α0.ρ">
           <ref loc="Φ.app"/>
        </type>
        <type id="Φ.grip.φ.ρ">
           <ref loc="Φ.grip"/>
        </type>
        <type id="Φ.grip.φ.α0.ρ">
           <ref loc="Φ"/>
        </type>
     </heads>
     <calls>
