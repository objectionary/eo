---
# yamllint disable rule:line-length
# grip calls whatever is in its scope with an oak. app puts hold into one copy
# of grip and pick into another, so the oak lands in the k of hold and in the
# j of pick, and each grip is the hold or the pick it called.
sources:
  oak.eo: |
    [] > oak
  grip.eo: |
    [scope] > grip
      scope oak > @
  app.eo: |
    [] > app
      grip hold > @
      grip pick > twin
      [k] > hold
      [j] > pick
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
facts: |
  <?xml version="1.0" encoding="UTF-8"?>
  <facts>
     <objects>
        <type bare="false" complete="false" id="Φ.app">
           <attr name="φ" type="Φ.app.φ"/>
           <attr name="twin" type="Φ.app.twin"/>
           <attr name="hold" type="Φ.app.hold"/>
           <attr name="pick" type="Φ.app.pick"/>
        </type>
        <type bare="true" complete="true" id="Φ.app.hold">
           <attr name="k" type="Φ.app.hold.k" void="true"/>
        </type>
        <type bare="true" complete="true" id="Φ.app.pick">
           <attr name="j" type="Φ.app.pick.j" void="true"/>
        </type>
        <type bare="true" complete="false" id="Φ.bytes">
