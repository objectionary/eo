# yamllint disable rule:line-length
# first hands inc an oak and second an elm. Each call gets a copy of inc of its
# own, so x is an oak in one copy and an elm in the other, never both at once.
sources:
  first.eo: |
    [] > first
      inc oak > @
  second.eo: |
    [] > second
      inc elm > @
  inc.eo: |
    [x] > inc
      x > @
  oak.eo: |
    [] > oak
  elm.eo: |
    [] > elm
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
