---
# yamllint disable rule:line-length
# first hands inc an oak and second an elm. Each call gets a copy of inc of its
# own, so x is an oak in one copy and an elm in the other, never both at once.
sources:
  first.eo: |
    [] > first
      inc oak > @
  second.eo: |
    [] > second
      inc elm > @
  inc.eo: |
    [x] > inc
      x > @
  oak.eo: |
    [] > oak
  elm.eo: |
    [] > elm
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.first.φ.α0' and @lands='x']/is[@loc='Φ.oak']
  - /answers/o[@loc='Φ.second.φ.α0' and @lands='x']/is[@loc='Φ.elm']
  - /answers/o[@loc='Φ.inc' and @copies='2']
  - /answers/o[@loc='Φ.inc.x']/set[@copies='1']/is[@loc='Φ.oak']
  - /answers/o[@loc='Φ.inc.x']/set[@copies='1']/is[@loc='Φ.elm']
  - /answers[not(o[@loc='Φ.inc.x']/set[is[@loc='Φ.oak'] and is[@loc='Φ.elm']])]
