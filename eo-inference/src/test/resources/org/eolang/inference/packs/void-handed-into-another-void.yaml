---
# yamllint disable rule:line-length
# Nobody calls shelf, so stuff is an open void, and so is the weight read off
# it. shelf hands stuff on to book, whose pages stays open as well, and the call
# answers book.
sources:
  book.eo: |
    [pages] > book
      pages.size > @
  shelf.eo: |
    [stuff] > shelf
      stuff.weight > w
      book stuff > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.shelf.stuff']/open
  - /answers/o[@loc='Φ.shelf.w']/open
  - /answers/o[@loc='Φ.shelf.φ.α0' and @lands='pages']/open
  - /answers/o[@loc='Φ.book.pages']/open
  - /answers/o[@loc='Φ.shelf.φ']/is[@loc='Φ.book']
