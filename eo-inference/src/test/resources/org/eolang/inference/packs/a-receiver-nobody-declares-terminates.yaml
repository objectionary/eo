---
# yamllint disable rule:line-length
# gauge declares no ^, so its ^ is T, as the runtime terminates on it. The
# seconds read off that ^ is T, and so is the times read off seconds, which
# is the @ of gauge.
sources:
  gauge.eo: |
    [] > gauge
      times. > @
        ^.seconds
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.gauge.φ.ρ.ρ']/terminator
  - /answers/o[@loc='Φ.gauge.φ.ρ']/terminator
  - /answers/o[@loc='Φ.gauge.φ']/terminator
