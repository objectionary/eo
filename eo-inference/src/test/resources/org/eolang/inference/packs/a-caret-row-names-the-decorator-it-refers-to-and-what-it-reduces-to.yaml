---
# yamllint disable rule:line-length
# The formation with no name that app hands to foo declares ^ and goes into
# x of the copy of foo the call makes, so that copy is its ^. The ^ row names
# foo, the formation of that copy, and says that foo reduces to a number,
# since the @ of foo is the y read off the formation, 5. The @ of foo and of
# app are numbers.
sources:
  app.eo: |
    [] > app
      foo > @
        [^]
          5 > y
  foo.eo: |
    [x] > foo
      $.x.y > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.app.φ.α0' and @lands='v🌵x']
  - /answers/o[@loc='Φ.app.φ.α0.ρ' and @copies='1' and count(is)=1]/is[@loc='Φ.foo']
  - /answers/o[@loc='Φ.app.φ.α0.ρ' and count(reduced/*)=1]/reduced/is[@loc='Φ.number']
  - /answers/o[@loc='Φ.foo.φ']/is[@loc='Φ.number']
  - /answers/o[@loc='Φ.app.φ']/is[@loc='Φ.number']
