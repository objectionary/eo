---
# yamllint disable rule:line-length
# check returns one status Java types and one it does not, so the text read
# off what check returns is a string and an unknown only Java fills. d puts
# both into the a of a copy of first, with b empty. app reads off d, so that
# copy counts and reduces to what its @ gives: the string goes into the k of
# keep, and the unknown next to it is left out (rule e).
sources:
  os.eo: |
    [] > os
      [] > check /Q.os.status(Q.number,Q.string)|Q.os.status
      [code note] > status
        code > @
        note > text
  first.eo: |
    [a b] > first
      a > @
  keep.eo: |
    [k] > keep
      k > @
      42 > size
  app.eo: |
    [] > app
      first os.check.text > d
      d.length > n
      keep d > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.app.d.α0' and @lands='v🌵a' and unknown[@kind='java']]/is[@loc='Φ.string']
  - /answers/o[@loc='Φ.app.d' and count(*)=1]/is[@loc='Φ.string']
  - /answers/o[@loc='Φ.keep.v🌵k' and count(*)=1]/is[@loc='Φ.string']
  - /answers[not(o[@loc='Φ.keep.v🌵k']/unknown)]
