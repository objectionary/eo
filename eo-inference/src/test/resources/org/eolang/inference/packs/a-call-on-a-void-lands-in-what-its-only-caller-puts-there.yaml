---
# yamllint disable rule:line-length
# app puts loud into the fail of guard, so the call of fail puts "it broke"
# into the message of loud, and guard is the bytes the @ of loud gives. box,
# handed 42, is a number.
sources:
  guard.eo: |
    [fail] > guard
      fail > @
        "it broke"
  app.eo: |
    [] > app
      guard > @
        01- > [message] > loud
  box.eo: |
    [item] > box
      item > @
  held.eo: |
    [] > held
      box 42 > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
