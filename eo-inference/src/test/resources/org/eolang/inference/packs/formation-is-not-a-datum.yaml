---
# yamllint disable rule:line-length
# cup and lid are formations and no literal is written anywhere, so each is
# named by itself, and no place is data.
sources:
  cup.eo: |
    [] > cup
  lid.eo: |
    [] > lid
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.cup']/is[@loc='Φ.cup']
  - /answers/o[@loc='Φ.lid']/is[@loc='Φ.lid']
  - /answers[not(o[starts-with(@loc, 'Φ.cup') or starts-with(@loc, 'Φ.lid')]/data)]
