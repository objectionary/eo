---
# yamllint disable rule:line-length
# read returns a reply whose body is a number or a string. Java makes one copy
# of reply with both in its body, so the body read off what read returns is a
# number and a string.
sources:
  os.eo: |
    [] > os
      [] > read /Q.os.reply(Q.number|Q.string)
      [body] > reply
        body > got
  app.eo: |
    [] > app
      os.read.got > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.os.read.λ']/is[@loc='Φ.os.reply(Φ.number|Φ.string)']
  - /answers/o[@loc='Φ.os.reply' and @copies='1']
  - /answers/o[@loc='Φ.os.reply.v🌵body' and count(*)=2 and ./is[@loc='Φ.number']]/is[@loc='Φ.string']
  - /answers/o[@loc='Φ.app.φ' and count(*)=2 and ./is[@loc='Φ.number']]/is[@loc='Φ.string']
  - /answers[not(//unknown)]
