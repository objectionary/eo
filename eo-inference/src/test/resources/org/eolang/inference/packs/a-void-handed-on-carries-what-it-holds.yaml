---
# yamllint disable rule:line-length
# bee puts an oak into inc, and wrap hands on its own y, which app fills with
# an elm. Each call gets its own copy of inc, so x is an oak in one and an elm
# in the other.
sources:
  app.eo: |
    [] > app
      wrap elm > @
  wrap.eo: |
    [y] > wrap
      inc y > @
  bee.eo: |
    [] > bee
      inc oak > @
  inc.eo: |
    [x] > inc
      x > @
  oak.eo: |
    [] > oak
  elm.eo: |
    [] > elm
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
