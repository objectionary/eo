# yamllint disable rule:line-length
# pour calls cup at one place, so the two calls of pour make two copies of
# pour but one copy of cup, where the number and the string meet.
sources:
  cup.eo: |
    [drink] > cup
      drink > @
      drink > sip
  pour.eo: |
    [what] > pour
      (cup what).sip > @
  app.eo: |
    [] > app
      pour 1 > one
      pour "tea" > two
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
