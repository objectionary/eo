---
# yamllint disable rule:line-length
# Nobody calls inc, so it is walked once with x empty: x is an open void, and so
# is the @ of inc, which is x.
sources:
  inc.eo: |
    [x] > inc
      x > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.inc' and @copies='1']
  - /answers/o[@loc='Φ.inc.x' and @copies='1']/open
  - /answers/o[@loc='Φ.inc.φ']/open
