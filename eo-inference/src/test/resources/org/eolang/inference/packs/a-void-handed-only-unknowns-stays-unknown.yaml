---
# yamllint disable rule:line-length
# Nobody calls one, so its y is the void of an object nobody calls. The call
# inc y makes no copy of inc, so inc is studied too and its x is of that kind
# as well, and the unknown y stays of its kind in what the call hands to inc and
# in the @ of one.
sources:
  one.eo: |
    [y] > one
      inc y > @
  inc.eo: |
    [x] > inc
      x > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.one.v🌵y']/unknown[@kind='study']
  - /answers/o[@loc='Φ.inc' and @copies='1']
  - /answers/o[@loc='Φ.inc.v🌵x']/unknown[@kind='study']
  - /answers/o[@loc='Φ.inc.φ']/unknown[@kind='study']
  - /answers/o[@loc='Φ.one.φ.α0' and @lands='v🌵x']/unknown[@kind='study']
  - /answers/o[@loc='Φ.one.φ' and count(*)=1]/unknown[@kind='study']
