---
# yamllint disable rule:line-length
# Nobody calls one, so its y is a void nobody fills, and it is unknown. The call
# inc y makes no copy of inc, so the x of inc is unknown too, and so are what
# the call hands to inc and the @ of one.
sources:
  one.eo: |
    [y] > one
      inc y > @
  inc.eo: |
    [x] > inc
      x > @
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
answers:
  - /answers/o[@loc='Φ.one.v🌵y']/unknown
  - /answers/o[@loc='Φ.inc' and @copies='1']
  - /answers/o[@loc='Φ.inc.v🌵x']/unknown
  - /answers/o[@loc='Φ.inc.φ']/unknown
  - /answers/o[@loc='Φ.one.φ.α0' and @lands='v🌵x']/unknown
  - /answers/o[@loc='Φ.one.φ']/unknown
