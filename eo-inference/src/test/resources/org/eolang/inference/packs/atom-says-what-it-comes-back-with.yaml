---
# yamllint disable rule:line-length
# half says it gives a number, so its λ is a number. Nobody calls it and x
# declares nothing, so x stays an open void.
sources:
  half.eo: |
    [] > half /Q.number
      ? > x
  bytes.eo: |
    [@] > bytes
  number.eo: |
    [@] > number
  string.eo: |
    [@] > string
facts: |
  <?xml version="1.0" encoding="UTF-8"?>
  <facts>
     <objects>
        <type bare="true" complete="false" id="Φ.bytes">
           <attr name="φ" type="Φ.bytes.φ" void="true"/>
        </type>
        <type bare="true" complete="false" id="Φ.half" returns="Φ.number">
           <attr name="x" type="Φ.half.x" void="true"/>
        </type>
        <type bare="true" complete="false" id="Φ.number">
           <attr name="φ" type="Φ.number.φ" void="true"/>
        </type>
        <type bare="true" complete="false" id="Φ.string">
           <attr name="φ" type="Φ.string.φ" void="true"/>
        </type>
        <type bare="false" complete="true" id="Φ">
           <attr name="bytes" type="Φ.bytes"/>
           <attr name="half" type="Φ.half"/>
           <attr name="number" type="Φ.number"/>
           <attr name="string" type="Φ.string"/>
        </type>
     </objects>
     <reads/>
     <heads/>
     <calls/>
  </facts>
answers: |
  <?xml version="1.0" encoding="UTF-8"?>
  <answers>
    <o loc="Φ" copies="1">
      <is loc="Φ"/>
    </o>
    <o loc="Φ.bytes" copies="1">
      <is loc="Φ.bytes"/>
      <reduced copies="1">
        <is loc="Φ.bytes"/>
      </reduced>
    </o>
    <o loc="Φ.bytes.φ" copies="1">
      <data/>
    </o>
    <o loc="Φ.half" copies="1">
      <is loc="Φ.half"/>
    </o>
    <o loc="Φ.half.x" copies="1">
      <open/>
    </o>
    <o loc="Φ.half.λ" copies="1">
      <is loc="Φ.number"/>
    </o>
    <o loc="Φ.number" copies="1">
      <is loc="Φ.number"/>
    </o>
    <o loc="Φ.number.φ" copies="1">
      <is loc="Φ.bytes"/>
    </o>
    <o loc="Φ.string" copies="1">
      <is loc="Φ.string"/>
    </o>
    <o loc="Φ.string.φ" copies="1">
      <is loc="Φ.bytes"/>
    </o>
  </answers>
