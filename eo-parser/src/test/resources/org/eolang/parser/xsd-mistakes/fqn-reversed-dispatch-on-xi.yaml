# yamllint disable rule:line-length
# #7501: after a leading dot, the "fqn" pattern accepted "ρ", "φ", a
# lower-case name or an "α" index, but not "ξ", so a reversed dispatch on
# "$" did not validate.
errors: 0
input: |
  [] > main
    $. 1 > z
