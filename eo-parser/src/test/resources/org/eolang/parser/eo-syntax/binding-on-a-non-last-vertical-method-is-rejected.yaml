---
# yamllint disable rule:line-length
# #8185: the chain sits in argument position (under app2, not a formation
# body), so R-6.6.4 is the rule that fires here, not R-3.12.3.
sheets: []
asserts:
  - /object/errors/error[contains(text(),'inline binding allowed only on the last method in a chain')]
input: |
  [] > app
    source > app2
      receiver
      .first:slot
      .second > result
