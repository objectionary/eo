# yamllint disable rule:line-length
sheets: []
asserts:
  - /object[@ms='0']
  - /object/errors[count(error)=1]
  - /object/errors/error[contains(text(),'invalid unicode or octal escape')]
input: |
  [] > pl
    b > child
      "x" > [m]
      "r\c"
