---
# yamllint disable rule:line-length
# #7251: a `.method` continuation with no horizontal args becomes a vapplication
# over a vmethod head, so its deeper children are an ordinary argument group and
# the all-or-nothing rule of R-6.6.2 governs them too.
sheets: []
asserts:
  - /object/errors/error[contains(text(),'argument bindings must be all-or-nothing')]
input: |
  [] > main
    foo > app
    .bar
      a:x
      b
