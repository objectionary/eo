---
# yamllint disable rule:line-length
sheets: []
asserts:
  - /object[not(errors)]
input: |
  +package snippets

  [] > self-fibo
    [n] >>
      if. > @
        n.lt 2
        n
        plus.
          % (n.minus 1)
          % (n.minus 2)
    | 6 > num
    stdout > @
      "%d is the %dth number\n".printf
        *
          num
          6
