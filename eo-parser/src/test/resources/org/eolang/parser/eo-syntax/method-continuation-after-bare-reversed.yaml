# same-indent `.method` continuation closed it, and the missing receiver was
# emitted as an object with no base at all.
sheets: []
asserts:
  - /object/errors/error[contains(text(),'reversed dispatch missing receiver')]
input: |
  [] > foo
    size.
    .m > x
