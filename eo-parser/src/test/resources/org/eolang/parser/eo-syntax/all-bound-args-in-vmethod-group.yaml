---
# #7251: the uniform half of R-6.6.2 — every arg of a vmethod group carries a
# binding, so the group is valid and every binding reaches the XMIR.
sheets: []
asserts:
  - /object[not(errors)]
  - //o[@base='ξ.app.bar']/o[@base='Φ.a' and @as='x']
  - //o[@base='ξ.app.bar']/o[@base='Φ.b' and @as='y']
input: |
  [] > main
    foo > app
    .bar > baz
      a:x
      b:y
