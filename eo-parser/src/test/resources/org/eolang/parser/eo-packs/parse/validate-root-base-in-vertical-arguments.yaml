---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/parser/parse/wrap-method-calls.xsl
  - /org/eolang/parser/parse/build-fqns.xsl
  - /org/eolang/parser/parse/roll-bases.xsl
  - /org/eolang/parser/parse/validate-root-base.xsl
asserts:
  - /object/errors[count(error[@check='validate-root-base' and @severity='critical'])=2]
  - /object/errors/error[@check='validate-root-base' and @severity='critical' and @line='2']
  - /object/errors/error[@check='validate-root-base' and @severity='critical' and @line='3']
input: |
  stdout > app
    $.left
    ^.right
