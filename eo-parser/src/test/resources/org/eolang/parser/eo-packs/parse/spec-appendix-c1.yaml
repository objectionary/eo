---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/parser/parse/build-fqns.xsl
asserts:
  - /object[not(errors)]
input: |-
  # A program demonstrating most constructs.
  # Comment block of two lines.

  +author someone@example.com
  +version 1.0

  [args] > main
    mem.alloc > @
      0
      [x] >>
        run > @
          *
            x.put 2
            loop
              ^.x.lt 6 > [i] >>
              [i] >>
                true > @
