---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/parser/parse/const-to-dataized.xsl
  - /org/eolang/parser/parse/vars-float-up.xsl
asserts:
  - /object[not(errors)]
  - /object[count(o)=1]
  - //o[@name='app']/o[@local='b' and @base='bar']
  - //o[@name='app']/o[@base='.foo']/o[starts-with(@base, 'a🌵') and not(@name)]
  - //o[@base='.as-bytes' and starts-with(@name, 'a🌵') and o[@base='Φ.dataized' and o[@local='t']]]
  - /object[count(.//o[@base='Φ.string'])=1]
  - //o[@name='y']/o[@base='.as-bytes' and starts-with(@name, 'a🌵')]
  - //o[@name='y']/o[@name='oops']
  - //o[@name='last']
  - //object[count(//o[@name='oops'])=1]
  - //o[@name='aaa']
  - //o[@name='ooo']
  - //o[@local='mm' and @base='Φ.number']
  - //o[@base='qux' and @name='φ']/o[starts-with(@base, 'a🌵')]
input: |
  [] > main
    [] > app
      foo. > baz
        bar >> b
          x

    [] > x
      first > ff
      one > qux
        [] > y
          two > @
            input >>! t
              "Hello, world!"
              [] > oops
                50 > @
      three t > zz
      [] > last
        three 1 > @

    [ppp] > pp
      one > @
        [aaa] > kkk
          1 > ooo
    [] > head
      bb > @
        [zz]
          qux > @
            42 >> mm
