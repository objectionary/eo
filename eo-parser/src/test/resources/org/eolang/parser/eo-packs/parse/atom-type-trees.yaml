---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/parser/parse/wrap-method-calls.xsl
  - /org/eolang/parser/parse/vars-float-up.xsl
  - /org/eolang/parser/parse/build-fqns.xsl
  - /org/eolang/parser/parse/expand-aliases.xsl
  - /org/eolang/parser/parse/resolve-aliases.xsl
  - /org/eolang/parser/parse/add-default-package.xsl
  - /org/eolang/parser/parse/roll-bases.xsl
  - /org/eolang/parser/parse/mandatory-as.xsl
asserts:
  - /object[not(errors)]
  - /object/o[@name='flag']/o[@name='λ' and @atom='Φ.bool']
  - /object/o[@name='status']/o[@name='λ' and @atom='Φ.posix.status-return(Φ.number,Φ.string)']
  - /object/o[@name='twice']/o[@name='λ' and @atom='Φ.number(Φ.string(Φ.bytes))']
  - /object/o[@name='inner']/o[@name='λ' and @atom='Φ.number(Φ.x(Φ.y),Φ.bytes)']
  - /object/o[@name='inner']/o[@name='b' and @base='∅' and @type='Φ.pair(Φ.number,Φ.string)?']
  - /object/o[@name='inner']/o[@name='c' and @base='∅' and @type='Φ.pair(A,Φ.bytes(B))']
  - /object/o[@name='inner']/o[@name='cant' and @base='∅' and @args='Φ.a(Φ.b,A) Φ.c B']
input: |
  [] > flag /Q.bool
  [] > status /Q.posix.status-return(Q.number,Q.string)
  [] > twice /Q.number(Q.string(Q.bytes))
  [] > inner /Q.number(Q.x(Q.y),Q.bytes)
    ? > b /Q.pair(Q.number,Q.string)?
    ? > c /Q.pair(A,Q.bytes(B))
    ? > cant /{Q.a(Q.b,A) Q.c B}
