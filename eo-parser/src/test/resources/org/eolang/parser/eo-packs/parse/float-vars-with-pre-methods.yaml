---
# yamllint disable rule:line-length
sheets:
  - /org/eolang/parser/parse/const-to-dataized.xsl
  - /org/eolang/parser/parse/vars-float-up.xsl
asserts:
  - //o[@base='.a' and @name='one' and count(o)=1]
  - //o[@base='.b' and @local='two' and count(o)=1]
  - //o[@base='.c' and @local='three' and count(o)=1]
  - //o[@base='.d' and @local='four' and count(o)=1]
  - //o[@base='e' and @local='five' and count(o)=0]
input: |
  a. > one
    b. >> two
      c. >> three
        d. >> four
          e >> five
