---
# yamllint disable rule:line-length
# Before "roll-bases" an own read is a dispatch on "ξ" or on its "ρ" hops,
# and it is as much an own read as the rolled "ξ.ρ.x" is (#9788).
sheets:
  - /org/eolang/parser/parse/wrap-applications.xsl
  - /org/eolang/parser/parse/resolve-local-names.xsl
  - /org/eolang/parser/parse/wrap-method-calls.xsl
  - /org/eolang/parser/parse/build-fqns.xsl
  - /org/eolang/parser/parse/add-default-package.xsl
  - /org/eolang/parser/parse/hide-voids.xsl
asserts:
  - /object[not(errors)]
  - //o[@name='self' and @base='.v🌵x']/o[1][@base='ξ']
  - //o[@name='parent' and @base='.v🌵x']/o[1][@base='.ρ']/o[1][@base='ξ']
  - //o[@name='far' and @base='.x']
input: |
  [x] > foo
    $.x > self
    [] > inner
      ^.x > parent
      bar.x > far
