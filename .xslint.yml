---
# xslint configuration — https://github.com/xslint/xslint
# The vendored xs3p stylesheet and the test fixtures are not ours to lint.
# Every xslint check is enforced across the codebase. The only per-check
# exceptions are four cohesive stylesheets that carry an inline
# `xslint-disable-file too-many-templates` and the `_specials.xsl` symbol table
# with `xslint-disable-file unused-variable`, each explained at its head.
exclude:
  - "**/xs3p/**"
  - "**/src/test/**"
